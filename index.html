n gauche et en avançant ton pied droit.","Répète le mouvement de l'autre côté, en reculant ton pied gauche et en fléchissant ton genou droit.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Enroule la corde autour de la plante de ton pied et tiens les extrémités de la corde avec tes mains.","Tire doucement la corde vers toi, en fléchissant ton pied et en étirant tes mollets.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche la tension sur la corde et détends ton pied.","Répète l'étirement avec l'autre jambe."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Abaisse ton corps en fléchissant tes genoux et en poussant tes hanches vers l'arrière comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le dos droit tout au long du mouvement.","Descends jusqu'à ce que tes cuisses soient parallèles au sol ou aussi bas que tu le peux confortablement.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens-toi à un support stable, comme une chaise ou un mur, pour l'équilibre.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Garde la poitrine relevée et le dos droit tout au long du mouvement.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence avec la barre au sol devant toi, les pieds écartés à la largeur des épaules.","Penche-toi et saisis la barre en prise pronation, légèrement plus large que la largeur des épaules.","Garde le dos droit et la poitrine relevée pendant que tu soulèves la barre du sol, en étendant tes hanches et tes genoux.","Lorsque la barre atteint le milieu de tes cuisses, tire-la vers le haut de façon explosive en haussant les épaules et en tirant tes coudes haut et vers les côtés.","Lorsque la barre atteint son point le plus haut, glisse-toi rapidement en dessous en faisant pivoter tes coudes et en réceptionnant la barre sur tes épaules en position de front squat.","Redresse-toi avec la barre, en étendant complètement les hanches et les genoux.","Abaisse la barre jusqu'à la position de départ, en gardant le contrôle du poids tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains directement sous les épaules et le corps aligné de la tête aux pieds.","Gaine ta sangle abdominale et contracte tes fessiers pour maintenir une position stable.","Abaisse ton corps sur tes avant-bras, un bras à la fois, en maintenant une ligne droite de la tête aux pieds.","Maintiens cette position pendant la durée souhaitée, en gardant ta sangle abdominale et tes fessiers gainés.","Pour revenir à la position de départ, pousse sur tes avant-bras et remonte ton corps en position de planche haute.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence allongé face contre terre sur un ballon de stabilité, les pieds écartés à la largeur des épaules et les orteils touchant le sol.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine tes muscles abdominaux et soulève lentement le haut du corps du ballon, en gardant le dos droit.","Fais pivoter ton torse d'un côté, en amenant ton épaule vers ta hanche. Garde tes hanches et tes jambes stables tout au long du mouvement.","Marque une pause, puis reviens à la position de départ.","Répète la rotation de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction avec une prise neutre (paumes tournées l'une vers l'autre) et les bras complètement étendus.","Gaine ta sangle abdominale et resserre tes omoplates.","Tire ton corps vers le haut en direction de la barre en fléchissant tes coudes et en les entraînant vers le bas en direction de tes hanches.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ avec contrôle.","Répète le nombre de répétitions souhaité."],["Commence assis sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Place tes mains sur les côtés du ballon de stabilité pour te soutenir.","Gaine tes abdominaux et enroule lentement tes hanches vers l'avant, en amenant tes genoux vers ta poitrine.","Marque une pause en haut du mouvement, puis étends lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les paumes tournées vers l'extérieur et les bras complètement étendus.","Gaine ta sangle abdominale et resserre tes omoplates.","Tire ton corps vers le haut en direction de la barre en fléchissant tes coudes et en amenant ta poitrine vers la barre.","Marque une pause en haut du mouvement, puis abaisse lentement ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et le corps bien aligné.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en gardant ton corps droit.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Depuis la position de pompe, tire ta poitrine vers le sol en fléchissant tes coudes, en gardant ton corps droit.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et le corps bien aligné.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en gardant ton corps droit.","Pousse à travers tes mains pour étendre tes bras et revenir à la position de départ.","Amène rapidement un genou vers ta poitrine, puis change rapidement et amène l'autre genou vers ta poitrine.","Continue à alterner les genoux aussi vite que possible tout en gardant une bonne exécution.","Continue pendant la durée ou le nombre de répétitions souhaité."],["Place le ballon Bosu au sol avec le côté plat tourné vers le haut.","Positionne-toi en position de pompes, les mains sur les bords extérieurs du ballon Bosu.","Gaine ta sangle abdominale et abaisse ton corps vers le ballon Bosu en pliant tes coudes.","Repousse-toi vers le haut jusqu'à la position de départ en étendant tes bras.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Gaine ta sangle abdominale et abaisse ton corps vers le sol en pliant tes coudes, en gardant ton corps en ligne droite.","Marque une pause lorsque ta poitrine est juste au-dessus du sol, puis repousse-toi vers le haut pour revenir à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Place le ballon Bosu au sol avec le côté plat tourné vers le haut.","Positionne-toi en position de pompes, les mains sur les bords extérieurs du ballon Bosu.","Gaine ta sangle abdominale et abaisse ton corps vers le ballon Bosu en pliant tes coudes.","Repousse-toi vers le haut jusqu'à la position de départ en étendant tes bras.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et positionne-toi face vers le bas avec tes mains sur le ballon, écartées à la largeur des épaules.","Étends tes jambes droit derrière toi, en équilibre sur les orteils.","Gaine ta sangle abdominale et abaisse ta poitrine vers le ballon en pliant tes coudes, en gardant ton corps en ligne droite.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et positionne-toi face vers le bas avec tes mains sur le ballon, écartées à la largeur des épaules.","Étends tes jambes droit derrière toi, en équilibre sur les orteils.","Gaine ta sangle abdominale et abaisse ta poitrine vers le ballon en pliant tes coudes, en gardant ton corps en ligne droite.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur, à environ une longueur de bras.","Place tes mains sur le mur à hauteur des épaules, un peu plus larges que la largeur des épaules.","Recule de quelques pas, en gardant le corps bien droit et les pieds écartés à la largeur des hanches.","Plie tes coudes et abaisse ta poitrine vers le mur en gardant ton corps aligné.","Repousse-toi vers la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur, à environ une longueur de bras.","Place tes mains sur le mur à hauteur des épaules, un peu plus larges que la largeur des épaules.","Recule les pieds, en les gardant écartés à la largeur des hanches.","Gaine ta sangle abdominale et garde ton corps en ligne droite de la tête aux talons.","Plie tes coudes et abaisse ta poitrine vers le mur en gardant ton corps droit.","Marque une pause, puis repousse-toi jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains rapprochées, directement sous les épaules.","Tiens un haltère dans chaque main, en les posant sur le sol.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Abaisse ton corps vers le sol en fléchissant les coudes, en gardant le dos droit et ta sangle abdominale gainée.","En te repoussant vers le haut, soulève une jambe du sol et lance-la sur le côté en la gardant tendue.","Repose ta jambe au sol et répète la pompe, puis change de jambe.","Continue à alterner les coups de pied à chaque répétition de pompe."],["Commence en position de planche haute, les mains sur le médecine-ball, écartées à la largeur des épaules.","Gaine ta sangle abdominale et abaisse ton corps vers le sol en pliant tes coudes, en gardant ton dos droit.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche, les avant-bras sur le sol et les coudes directement sous les épaules.","Gaine ta sangle abdominale et garde ton corps en ligne droite de la tête aux pieds.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en les gardant près de ton corps.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et le corps aligné de la tête aux talons.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","Une fois ta poitrine juste au-dessus du sol, pousse sur tes mains pour tendre les bras et soulever le haut de ton corps.","En haut du mouvement, projette tes omoplates vers l'avant en poussant le haut de ton dos vers le plafond.","Marque une pause, puis inverse le mouvement en rétractant tes omoplates et en abaissant ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et le corps bien aligné.","Abaisse ton corps vers le sol en fléchissant les coudes, en gardant ta sangle abdominale gainée.","Repousse-toi vers la position de départ.","Reporte ton poids sur ta main gauche et fais pivoter ton corps vers la droite, en levant ton bras droit vers le plafond.","Maintiens la position de la planche latérale pendant quelques secondes, puis reviens à la position de départ.","Répète la pompe et la planche latérale du côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Abaisse ton corps en fléchissant tes genoux et en poussant tes hanches vers l'arrière comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le dos droit.","Descends jusqu'à ce que tes cuisses soient parallèles au sol.","Pousse à travers tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras le long du corps.","Commence par bouger rapidement tes pieds de haut en bas, comme si tu courais sur place.","Garde des mouvements rapides et légers, en te concentrant sur le fait de rester sur la plante des pieds.","Continue pendant la durée ou le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Étends un bras droit sur le côté, parallèle au sol.","Abaisse ton corps vers le sol en fléchissant les coudes, en gardant le dos droit et la sangle abdominale gainée.","Repousse-toi vers la position de départ en utilisant les muscles de ta poitrine pour soulever ton corps.","Répète avec l'autre bras étendu."],["Allonge-toi sur le dos, les pieds à plat au sol et les genoux fléchis.","Place tes bras le long de ton corps, les paumes tournées vers le bas.","Contracte tes fessiers et tes ischio-jambiers, et soulève tes hanches du sol jusqu'à ce que ton corps forme une ligne droite de tes genoux à tes épaules.","Maintiens cette position pendant quelques secondes, puis abaisse lentement tes hanches jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Étends ton bras droit en travers de ta poitrine, en plaçant ta main gauche sur ton coude droit.","Tire doucement ton bras droit vers ton épaule gauche, en sentant un étirement dans ton épaule droite.","Maintiens l'étirement pendant 15 à 30 secondes, puis relâche.","Répète de l'autre côté."],["Saisis la barre de traction avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Enroule la corde autour de la plante de ton pied droit et tiens les extrémités de la corde avec tes mains.","Lève lentement la jambe droite vers la poitrine, en gardant le genou tendu et le pied fléchi.","Maintiens l'étirement pendant quelques secondes, puis abaisse lentement ta jambe jusqu'à la position de départ.","Répète avec ta jambe gauche.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Commence à genoux au sol, les genoux écartés à la largeur des hanches et les pieds fléchis.","Enroule l'élastique autour de tes cuisses, juste au-dessus de tes genoux.","Place tes mains sur tes hanches ou tends-les devant toi pour l'équilibre.","Contracte tes fessiers et tes muscles abdominaux.","Pousse tes hanches vers l'avant et contracte tes fessiers en soulevant tes genoux du sol, en étendant tes hanches jusqu'à ce que tes cuisses soient parallèles au sol.","Maintiens la position un moment, puis abaisse lentement tes genoux jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide et attache-le autour de ta cheville.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","En gardant ta sangle abdominale gainée et le haut de ton corps stable, étends ta jambe droit devant toi.","Marque une pause en haut, puis ramène lentement ta jambe à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Assieds-toi sur une chaise ou un banc, le dos droit et les pieds à plat sur le sol.","Tiens l'élastique en prise supination, les paumes tournées vers le haut et les bras étendus le long de tes côtés.","En gardant le haut des bras immobile, expire et fléchis l'élastique vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement l'élastique jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une chaise ou un banc, le dos droit et les pieds à plat sur le sol.","Tiens les poignées de l'élastique dans chaque main, les paumes tournées vers le bas et les coudes fléchis à un angle de 90 degrés.","Étends tes bras vers l'avant, en poussant l'élastique loin de ta poitrine.","Marque une pause à la fin du mouvement, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une chaise ou un banc, le dos droit et les pieds à plat sur le sol.","Enroule l'élastique autour de tes cuisses, juste au-dessus de tes genoux.","Place tes mains sur les côtés de la chaise ou du banc pour te soutenir.","Sollicite tes abducteurs (muscles externes de la cuisse) et écarte lentement tes genoux, contre la résistance de l'élastique.","Marque une pause à la fin du mouvement, puis rapproche lentement tes genoux l'un de l'autre.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une chaise ou un banc, le dos droit et les pieds à plat sur le sol.","Tiens l'élastique des deux mains, les paumes tournées vers l'avant, et amène-le à hauteur d'épaule.","Pousse l'élastique au-dessus de ta tête, en tendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement l'élastique à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues, et passe l'élastique autour de tes pieds.","Tiens les extrémités de l'élastique avec tes mains, les paumes tournées l'une vers l'autre.","Garde le dos droit et penche-toi légèrement vers l'arrière, en gainant ta sangle abdominale.","Tire l'élastique vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les bras tendus le long du corps.","Fléchis les genoux et décolle les pieds du sol en amenant tes cuisses perpendiculaires au sol.","Contracte tes abdominaux et enroule tes hanches en les décollant du sol, en ramenant tes genoux vers ta poitrine.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Positionne-toi entre deux barres parallèles, les bras complètement tendus et le corps droit.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, les genoux sous les coussins et les pieds à plat sur le sol.","Saisis les poignées avec une prise en supination, légèrement plus écartées que la largeur des épaules.","Tiens-toi bien droit, la poitrine sortie et les épaules en arrière, en conservant une légère cambrure dans le bas du dos.","Tire les poignées vers le bas en direction de ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en bas du mouvement, puis relâche lentement les poignées jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Saisis la barre de traction avec une prise en supination, les mains écartées à la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en menant avec ta poitrine.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur un ballon de stabilité, les hanches reposant sur le ballon et les jambes tendues droit derrière toi.","Place tes mains au sol devant toi pour la stabilité.","En gainant tes fessiers et tes ischio-jambiers, lève tes jambes vers le plafond aussi haut que possible.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur un banc plat, les hanches au bord et les jambes pendant hors du banc.","Tiens-toi au banc pour la stabilité.","En gardant les jambes tendues, lève-les vers le plafond aussi haut que possible.","Contracte tes fessiers en haut du mouvement.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi et les mains posées sur le sol derrière toi, les doigts pointés vers tes pieds.","Pousse sur tes mains et soulève tes hanches du sol, en venant dans une position de planche inversée.","Gaine ta sangle abdominale et lève une jambe du sol, en l'étendant droite vers le plafond.","Maintiens un moment, puis abaisse ta jambe.","Répète avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Commence suspendu aux anneaux, les bras complètement tendus et le corps droit.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que tes épaules soient sous tes coudes.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Commence à genoux au sol, les genoux écartés à la largeur des hanches.","Place tes mains au sol devant toi pour le soutien.","Penche-toi lentement vers l'avant, en reportant ton poids sur tes mains et en tendant tes jambes derrière toi.","Garde le dos droit et engage tes fessiers pendant que tu pousses tes hanches vers l'arrière et vers le plafond.","Maintiens cette position pendant quelques secondes, en ressentant un étirement dans tes fessiers.","Reviens lentement à la position de départ en fléchissant les genoux et en abaissant les hanches.","Répète le nombre de répétitions souhaité."],["Tiens-toi devant une barre de traction, les pieds écartés à la largeur des épaules.","Lève les bras et saisis la barre en prise pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en menant avec ta poitrine.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence assis au sol, les jambes tendues devant toi.","Place le rouleau perpendiculaire à ton corps, juste en dessous de tes fessiers.","Fais rouler lentement ton corps vers l'arrière, en laissant le rouleau remonter le long de ton dos.","Continue à rouler jusqu'à ce que le rouleau atteigne le haut de ton dos.","Marque une pause, puis roule lentement jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche, les avant-bras sur le rouleau et le corps bien aligné.","Gaine ta sangle abdominale et fais rouler lentement le rouleau vers l'avant, en étendant ton corps aussi loin que possible tout en gardant le contrôle.","Marque une pause au point le plus éloigné, puis fais rouler lentement le rouleau vers ta position de départ.","Répète le nombre de répétitions souhaité."],["Commence à genoux au sol, le rouleau positionné sous tes hanches.","Place tes mains sur le rouleau pour te soutenir.","Fais rouler lentement le rouleau vers l'avant, en étendant les hanches et en étirant les fessiers.","Maintiens l'étirement pendant quelques secondes, puis roule en arrière jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence assis au sol, les jambes tendues devant toi.","Place le rouleau sous tes fessiers, juste au-dessus de tes genoux.","Penche-toi en arrière et place tes mains au sol derrière toi pour te soutenir.","Contracte tes fessiers et fais rouler lentement le rouleau vers l'avant, en fléchissant les genoux et en les amenant vers ta poitrine.","Marque une pause à la fin du mouvement, en ressentant un étirement dans tes fessiers.","Fais rouler lentement le rouleau pour revenir à la position de départ, en étendant les jambes.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les bras tendus droit au-dessus de la tête et les jambes tendues droit devant toi.","Place le rouleau entre tes pieds et saisis-le avec tes orteils.","En gainant tes abdominaux, soulève tes jambes du sol et enroule tes genoux vers ta poitrine, en faisant rouler le rouleau vers ton corps.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ, en faisant rouler le rouleau loin de ton corps.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une surface plane, les jambes tendues devant toi.","Tiens le rouleau des deux mains, les paumes tournées vers le bas, et place-le sur tes cuisses.","Penche-toi légèrement en avant et fais rouler le rouleau loin de ton corps, en tendant tes bras droit devant toi.","Marque une pause, puis fais rouler lentement le rouleau vers ton corps, en pliant tes bras et en ramenant le rouleau vers tes cuisses.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une surface plane, les jambes tendues devant toi.","Tiens le rouleau des deux mains, les paumes tournées vers le bas, et place-le sur tes cuisses.","Penche-toi légèrement en arrière et gaine ta sangle abdominale.","Lève le rouleau à hauteur des épaules en gardant tes bras tendus.","Abaisse lentement le rouleau vers tes cuisses.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens le rouleau à deux mains devant ton corps.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Étends tes bras vers l'avant et fais rouler le rouleau vers le bas en direction de tes pieds, en ressentant un étirement dans tes grands dorsaux.","Maintiens l'étirement pendant quelques secondes, puis fais lentement rouler le rouleau vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à la corde, les pieds écartés à la largeur des épaules.","Saisis la corde avec les deux mains, les paumes tournées vers toi.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Commence à te hisser le long de la corde en alternant les mouvements main par-dessus main.","Utilise tes jambes pour faciliter le mouvement vers le haut.","Continue à grimper jusqu'à atteindre la hauteur souhaitée ou le sommet de la corde.","Pour descendre, inverse le mouvement main après main tout en contrôlant ta descente.","Répète le nombre de répétitions souhaité."],["Commence debout, bien droit, les pieds écartés à la largeur des hanches.","Gaine ta sangle abdominale et garde ton haut du corps détendu.","Commence à courir sur place en levant tes genoux vers ta poitrine et en atterrissant en douceur sur la plante de tes pieds.","Maintiens un rythme régulier et continue à courir pendant la durée ou la distance souhaitée.","Pense à respirer profondément et à maintenir une bonne posture tout au long de l'exercice."],["Commence debout, bien droit, les pieds écartés à la largeur des hanches.","Gaine ta sangle abdominale et garde ton haut du corps détendu.","Commence à courir sur place en levant tes genoux vers ta poitrine et en atterrissant en douceur sur la plante de tes pieds.","Maintiens un rythme régulier et continue à courir pendant la durée ou la distance souhaitée.","Pense à respirer profondément et à maintenir une bonne posture tout au long de l'exercice."],["Tiens-toi debout, les pieds écartés à la largeur des hanches.","Fais un pas en avant avec le pied droit, en gardant le pied gauche bien ancré.","Fléchis ton genou droit et abaisse ton corps en gardant ta jambe gauche tendue.","Place tes mains sur ta cuisse droite pour te soutenir.","Maintiens l'étirement pendant 20 à 30 secondes, puis change de côté et répète."],["Assieds-toi au sol, les genoux fléchis et les pieds à plat sur le sol.","Penche-toi légèrement en arrière en gardant le dos droit et la sangle abdominale gainée.","Joins tes mains devant ta poitrine ou tiens un poids si tu le souhaites.","Décolle tes pieds du sol, en équilibre sur tes ischions.","Fais pivoter ton torse vers la droite, en amenant tes mains ou le poids vers le côté droit de ton corps.","Marque une pause, puis fais pivoter ton torse vers la gauche, en amenant tes mains ou le poids vers le côté gauche de ton corps.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules et les bras tendus devant toi.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Abaisse ton corps en fléchissant tes coudes et en rétractant tes omoplates, comme si tu essayais de serrer un crayon entre elles.","Marque une pause en bas, puis pousse sur tes mains pour tendre tes coudes et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains directement sous les épaules et le corps bien aligné.","Abaisse ta poitrine vers le sol, en gardant les coudes près de ton corps.","En descendant, contracte tes omoplates l'une vers l'autre et pousse ta poitrine vers l'avant.","Marque une pause en bas, puis pousse pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction, les paumes tournées vers l'extérieur et les bras complètement tendus.","Rétracte tes omoplates en les tirant vers le bas et vers l'arrière.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en te concentrant sur le rapprochement de tes omoplates.","Marque une pause en haut du mouvement, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Saute du sol et croise simultanément ta jambe droite devant ta jambe gauche.","À l'atterrissage, change rapidement de jambe en croisant ta jambe gauche devant ta jambe droite.","Continue à alterner les jambes et à sauter aussi vite que possible.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'une chaise ou d'un banc, les pieds à plat sur le sol.","Étends une jambe droit devant toi, en gardant ton talon au sol.","Penche-toi légèrement en avant, en sentant un étirement dans le muscle de ton mollet.","Maintiens l'étirement pendant 20 à 30 secondes.","Change de jambe et répète l'étirement."],["Assieds-toi au sol, les jambes tendues devant toi.","Fléchis ton genou droit et croise ta cheville droite sur ta cuisse gauche.","Place ta main droite sur le sol derrière toi pour te soutenir.","Avec ta main gauche, appuie doucement sur ton genou droit pour accentuer l'étirement.","Maintiens l'étirement pendant 30 secondes à 1 minute.","Change de côté et répète."],["Assieds-toi sur un banc plat, le dos droit et les pieds à plat sur le sol.","Place tes mains sur les côtés du banc pour te soutenir.","En gardant les jambes tendues, lève-les lentement devant toi jusqu'à ce qu'elles soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'une chaise, les pieds à plat sur le sol.","Place tes mains sur tes cuisses ou sur les côtés de la chaise pour te soutenir.","Penche-toi lentement vers l'avant à partir des hanches, en gardant le dos droit.","Sens l'étirement dans le bas de ton dos et maintiens pendant 20 à 30 secondes.","Reviens lentement à la position de départ et répète pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Fléchis ton genou droit et pose ton pied droit à l'extérieur de ton genou gauche.","Place ton coude gauche à l'extérieur de ton genou droit et tourne doucement ton torse vers la droite.","Maintiens l'étirement pendant 20 à 30 secondes, puis change de côté et répète."],["Assieds-toi au sol, le dos contre un mur et les jambes tendues devant toi.","Fléchis les genoux et pose les pieds à plat sur le sol, écartés à la largeur des hanches.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et penche-toi d'un côté, en amenant ton coude vers ta hanche.","Marque une pause, puis reviens à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues et largement écartées.","Fléchis tes pieds et contracte tes quadriceps.","Place tes mains au sol derrière toi pour le soutien.","En gardant le dos droit, penche-toi vers l'avant à partir des hanches.","Continue à te pencher vers l'avant jusqu'à ce que tu sentes un étirement dans tes ischio-jambiers.","Maintiens cette position pendant quelques respirations.","Relâche lentement l'étirement et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos sur un tapis ou un banc, les jambes tendues.","Place tes mains le long de ton corps ou sous tes fessiers pour le soutien.","Fléchis les genoux et décolle les pieds du sol en amenant tes cuisses vers ta poitrine.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur une machine à leg curl, les jambes tendues et les chevilles accrochées sous le levier rembourré.","Place tes mains sur les poignées latérales de la machine pour te soutenir.","En gardant le haut de ton corps immobile, expire et fléchis tes jambes vers le haut aussi loin que possible.","Maintiens la position contractée pendant une brève pause en contractant tes ischio-jambiers.","Abaisse lentement tes jambes vers la position de départ en inspirant.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Fléchis les genoux et pose les pieds à plat sur le sol, écartés à la largeur des hanches.","Soulève tes hanches du sol, en gainant tes fessiers et tes ischio-jambiers.","Enroule lentement tes jambes vers tes fessiers, en gardant tes hanches soulevées.","Marque une pause en haut, puis étends lentement tes jambes pour revenir à la position de départ.","Redescends tes hanches jusqu'au sol.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps en position accroupie.","Saute de manière explosive, en étendant tes hanches et tes genoux tout en balançant tes bras pour prendre de l'élan.","Atterris en douceur sur la pointe des pieds et enchaîne immédiatement avec la répétition suivante.","Répète le nombre de répétitions souhaité."],["Trouve un espace dégagé ou un tapis de course pour effectuer l'exercice.","Tiens-toi bien droit, les pieds écartés à la largeur des hanches.","Commence à courir sur place, en levant bien les genoux et en pompant avec les bras.","Après quelques secondes, commence à faire de petites foulées vers l'avant en maintenant un rythme rapide.","Continue à courir à petites foulées pendant la durée ou la distance souhaitée."],["Saisis la barre de traction avec une prise à la largeur des épaules, les paumes tournées vers l'extérieur.","Suspends-toi librement, les bras complètement étendus.","Sollicite les muscles de ton dos et tire ton corps vers la barre jusqu'à ce que ton menton dépasse la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains directement sous les épaules et le corps bien aligné.","Gaine ta sangle abdominale et lève ta main droite du sol, en la tendant à travers pour toucher ton épaule gauche.","Repose ta main droite sur le sol et répète en tapant ton épaule droite avec ta main gauche.","Continue à alterner les touchés d'épaule tout en gardant tes hanches et ton torse stables.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et le corps aligné de la tête aux talons.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","En te repoussant vers le haut, décolle ta main droite du sol et tape ton épaule gauche.","Ramène ta main droite au sol et répète la pompe, cette fois en levant ta main gauche et en tapotant ton épaule droite.","Continue à alterner les touchés d'épaule à chaque répétition de pompe.","Maintiens une sangle abdominale stable et évite une rotation excessive des hanches pendant tout l'exercice.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et empilées l'une sur l'autre.","Redresse-toi sur ton avant-bras, en gardant ton coude directement sous ton épaule.","Gaine ta sangle abdominale et lève tes hanches du sol, en créant une ligne droite de ta tête à tes pieds.","Tout en gardant ta sangle abdominale gainée, lève ta jambe supérieure le plus haut possible sans faire pivoter tes hanches.","Marque une pause en haut, puis abaisse ta jambe.","Répète le nombre de répétitions souhaité, puis change de côté."],["Allonge-toi sur le côté, les jambes tendues et empilées l'une sur l'autre.","Place ton avant-bras au sol directement sous ton épaule, avec ton coude plié à un angle de 90 degrés.","Gaine ta sangle abdominale et lève tes hanches du sol, en créant une ligne droite de ta tête à tes pieds.","Maintiens cette position pendant la durée souhaitée.","Redescends tes hanches jusqu'à la position de départ.","Répète de l'autre côté."],["Tiens-toi entre deux barres parallèles, les pieds écartés à la largeur des épaules.","Place tes mains sur les barres et soulève ton corps du sol, en soutenant ton poids sur tes bras.","Gaine tes abdominaux et lève lentement tes jambes sur le côté, en les gardant droites.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les mains sur les hanches.","Reporte ton poids sur une jambe et lève la jambe opposée sur le côté, en la gardant tendue.","Marque une pause en haut, puis abaisse lentement ta jambe pour revenir à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et ton bras inférieur tendu droit au-dessus de la tête.","Fléchis ton genou supérieur et pose ton pied au sol devant ta jambe inférieure.","Passe ton bras supérieur au-dessus de ta tête et agrippe-toi à quelque chose de stable, comme un mur ou un meuble.","Soulève lentement ta jambe du dessous du sol, en la gardant tendue, jusqu'à ce que tu ressentes un étirement dans ton flanc.","Maintiens l'étirement pendant 20 à 30 secondes, puis abaisse lentement ta jambe.","Répète de l'autre côté."],["Allonge-toi sur le côté, les jambes tendues et superposées l'une sur l'autre.","Place ton bras inférieur sous ta tête pour le soutien.","Sollicite tes adducteurs et lève ta jambe supérieure aussi haut que possible sans faire pivoter tes hanches ni te pencher en arrière.","Marque une pause en haut, puis abaisse lentement ta jambe pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Commence allongé sur le côté, les jambes tendues et superposées l'une sur l'autre.","Redresse-toi sur ton avant-bras, en gardant ton coude directement sous ton épaule.","Gaine ta sangle abdominale et lève tes hanches du sol, en créant une ligne droite de ta tête à tes pieds.","Tout en maintenant la position de planche latérale, lève ta jambe supérieure vers le plafond en la gardant tendue.","Abaisse lentement ta jambe vers la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout ou assis bien droit, les épaules détendues.","Incline la tête vers la droite, en amenant ton oreille droite vers ton épaule droite.","Place ta main droite sur le côté gauche de ta tête et exerce doucement une pression pour accentuer l'étirement.","Maintiens l'étirement pendant 15 à 30 secondes.","Répète de l'autre côté en inclinant ta tête vers la gauche et en appliquant une pression avec ta main gauche.","Répète l'étirement 2 à 3 fois de chaque côté."],["Commence allongé sur le côté, les jambes tendues et superposées l'une sur l'autre.","Place ta main inférieure au sol directement sous ton épaule, les doigts pointés vers l'avant.","Pousse sur ta main du bas pour soulever ton corps du sol, en gardant tes jambes droites et ta sangle abdominale gainée.","Étends ton bras supérieur droit vers le plafond, en formant une ligne droite de ta tête à tes talons.","Abaisse ton corps jusqu'à la position de départ avec contrôle.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus devant toi.","Étends ton bras droit sur le côté, parallèle au sol, la paume tournée vers le bas.","Avec ta main gauche, attrape ta main droite et tire-la doucement vers ton corps, en sentant un étirement dans ton avant-bras droit.","Maintiens l'étirement pendant 15 à 30 secondes, puis relâche.","Répète de l'autre côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis une barre de traction avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps relâché.","Hisse-toi vers le haut en fléchissant tes coudes et en amenant ton menton vers la barre, tout en gardant ton corps droit.","Une fois ton menton au-dessus de la barre, redescends jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus sur les côtés.","Penche-toi vers la droite au niveau de la taille en tendant ta main droite vers ton pied droit tout en gardant ta main gauche tendue sur le côté.","Reviens à la position de départ, puis penche-toi à la taille vers la gauche, en tendant ta main gauche vers ton pied gauche tout en gardant ta main droite étendue sur le côté.","Répète le mouvement de flexion d'un côté à l'autre pour le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et une main placée un peu plus large que l'autre.","Gaine ta sangle abdominale et abaisse ton corps vers le sol en pliant tes coudes, en gardant ton dos droit.","En te baissant, déplace ton poids d'un côté et décolle le bras opposé du sol en le tendant bien droit sur le côté.","Pousse avec ta poitrine et tes triceps pour ramener ton corps vers le haut jusqu'à la position de départ, tout en abaissant simultanément ton bras tendu vers le sol.","Répète le mouvement en alternant le bras que tu étends à chaque répétition."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Étends une jambe droit devant toi.","Contracte tes fessiers et soulève tes hanches du sol, en formant une ligne droite de tes genoux à tes épaules.","Maintiens un moment en haut, puis abaisse lentement tes hanches jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Tiens-toi les pieds écartés à la largeur des hanches et tiens un haltère dans une main.","Décolle un pied du sol et tiens en équilibre sur l'autre pied.","Soulève lentement ton talon aussi haut que possible, en utilisant les muscles de tes mollets.","Marque une pause en haut, puis abaisse lentement ton talon.","Répète le nombre de répétitions souhaité, puis passe à l'autre jambe."],["Commence debout, un pied posé sur une plateforme ou une planche coulissante.","Fléchis légèrement ton genou et fais glisser le pied sur la plateforme vers l'arrière en étendant ta jambe.","Garde ta sangle abdominale gainée et maintiens une posture droite tout au long du mouvement.","Reviens lentement à la position de départ en faisant glisser ton pied vers la position initiale.","Répète le mouvement le nombre de répétitions souhaité, puis change de jambe."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus devant toi.","Décolle ton pied droit du sol et étends-le vers l'avant.","Abaisse lentement ton corps en fléchissant ton genou gauche et en poussant tes hanches vers l'arrière.","Garde la poitrine relevée et le dos droit pendant que tu descends.","Descends jusqu'à ce que ta cuisse gauche soit parallèle au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur ton talon gauche pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens-toi à un objet stable pour l'équilibre si nécessaire.","Abaisse lentement ton corps en fléchissant les genoux et en te penchant en arrière, en gardant ton torse droit.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol ou aussi loin que tu peux confortablement aller.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Croise tes bras sur ta poitrine.","En gainant tes abdominaux, soulève le haut de ton corps du sol vers tes genoux.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et saute vers la droite en atterrissant sur ton pied droit.","À l'atterrissage, balance ta jambe gauche derrière ta jambe droite et touche le sol avec les orteils de ton pied gauche.","Saute immédiatement vers la gauche, en atterrissant sur ton pied gauche.","À l'atterrissage, balance ta jambe droite derrière ta jambe gauche et touche le sol avec les orteils de ton pied droit.","Continue à alterner les côtés, en sautant et en touchant le sol avec chaque jambe.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et les repose-pieds dans une position confortable.","Saisis les poignées avec une prise en pronation, les paumes tournées vers le bas.","Redresse-toi bien droit, les pieds à plat sur les repose-pieds.","Étends les bras droit devant toi, en gardant les coudes légèrement fléchis.","Contracte tes triceps et pousse les poignées vers le bas jusqu'à tes cuisses.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et garde le dos droit.","Saute vers la droite, en atterrissant sur ton pied droit tout en balançant ta jambe gauche derrière ta jambe droite.","Saute immédiatement vers la gauche, en atterrissant sur ton pied gauche tout en balançant ta jambe droite derrière ta jambe gauche.","Continue à alterner les sauts d'un côté à l'autre, en imitant un mouvement de ski.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre, les bras complètement tendus et le corps détendu.","Gaine ta sangle abdominale et lève tes jambes, en amenant tes genoux vers ta poitrine.","Continue à lever tes jambes vers le haut et par-dessus ta tête, en laissant ton corps passer à travers tes bras.","Une fois tes jambes complètement étendues au-dessus de ta tête, commence à les redescendre vers la position de départ.","En abaissant tes jambes, laisse ton corps repasser entre tes bras jusqu'à ce que tu sois de nouveau suspendu, les bras complètement étendus.","Répète le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un angle de 45 degrés.","Assieds-toi sur la machine à traîneau, le dos contre le coussinet et les pieds sur la plaque de pied.","Place un pied sur la plateforme et étends ta jambe, en poussant le traîneau loin de toi.","Fléchis lentement le genou et abaisse le traîneau vers la position de départ.","Répète avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un angle de 45 degrés.","Place tes pieds sur la plateforme du traîneau, les orteils pointés vers l'avant.","Pousse la plateforme de la machine à traîneau loin de toi en étendant tes chevilles et tes mollets.","Marque une pause en haut, puis abaisse lentement la plateforme du traîneau pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le siège et le repose-pieds de la machine à traîneau dans une position confortable.","Assieds-toi sur la machine à traîneau, le dos contre le dossier et les pieds écartés à la largeur des épaules sur la plaque de pied.","Saisis les poignées sur les côtés du siège pour te stabiliser.","Pousse le repose-pieds loin de ton corps en étendant tes jambes, en gardant tes talons sur le repose-pieds.","Continue à pousser jusqu'à ce que tes jambes soient presque complètement tendues, mais sans verrouiller tes genoux.","Marque une pause en haut du mouvement, puis abaisse lentement la plateforme vers ton corps en fléchissant tes genoux.","Répète le nombre de répétitions souhaité."],["Règle le siège de la machine à traîneau de sorte que tes genoux forment un angle de 45 degrés.","Assieds-toi sur la machine à traîneau, le dos contre le dossier et les pieds écartés à la largeur des épaules sur la plaque de pied.","Saisis les poignées sur les côtés du siège pour te stabiliser.","Pousse le repose-pieds loin de ton corps en étendant tes jambes, en gardant tes talons sur le repose-pieds.","Marque une pause en position complètement étendue.","Fléchis lentement les genoux et abaisse la plaque de pied vers ton corps, en contrôlant le mouvement.","Répète le nombre de répétitions souhaité."],["Règle le siège de la machine à traîneau de sorte que tes genoux forment un angle de 90 degrés lorsque tes pieds sont sur le repose-pieds.","Assieds-toi sur la machine à traîneau, le dos bien à plat contre le dossier et les pieds écartés à la largeur des épaules sur la plaque de pied.","Saisis les poignées sur les côtés du siège pour te stabiliser.","Pousse contre le repose-pieds pour étendre tes jambes en les tendant complètement.","Marque une pause en haut, puis fléchis lentement tes genoux pour abaisser la plateforme et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un angle de 45 degrés.","Assieds-toi sur la machine à traîneau, le dos contre le coussinet et les pieds sur la plateforme de pied.","Positionne tes pieds plus larges que la largeur des épaules.","Pousse contre la plateforme repose-pieds pour étendre tes jambes et tendre tes genoux.","Marque une pause à la fin du mouvement, puis fléchis lentement tes genoux pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le siège de la presse à jambes de sorte que tes genoux soient légèrement fléchis lorsque tes pieds sont sur le traîneau.","Place tes pieds écartés à la largeur des épaules sur le traîneau, les orteils pointés vers l'avant.","Relâche les poignées de sécurité et pousse la machine à traîneau loin nombre de répétitions souhaité."],["Règle la machine à traîneau sur un poids confortable.","Assieds-toi sur la machine à traîneau, le dos contre le coussinet et les pieds sur la plateforme.","Place tes orteils et la plante de tes pieds sur le bord de la plateforme, les talons dans le vide.","Pousse la plateforme loin de toi en étendant tes chevilles, en gardant tes genoux légèrement fléchis.","Continue à pousser jusqu'à ce que tes mollets soient complètement contractés.","Maintiens la contraction un moment, puis abaisse lentement la plateforme jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un poids confortable.","Allonge-toi sur le dos sur la machine à traîneau, les pieds sur la plaque de pieds.","Positionne tes pieds écartés à la largeur des épaules et légèrement orientés vers l'extérieur.","Saisis les poignées de la machine à traîneau pour te stabiliser.","Contracte tes fessiers et tes muscles abdominaux.","Pousse à travers tes talons et étends tes jambes pour soulever la machine à traîneau.","Abaisse le traîneau en fléchissant tes genoux et tes hanches.","Répète le nombre de répétitions souhaité."],["Règle le siège de la presse à jambes de sorte que tes genoux soient légèrement fléchis lorsque tes pieds sont sur le traîneau.","Assieds-toi sur la machine, le dos contre le dossier et les pieds sur le traîneau, écartés à la largeur des épaules.","Place tes orteils et la plante de tes pieds sur le traîneau, en gardant tes talons dans le vide.","Pousse la machine à traîneau vers l'avant en étendant tes chevilles, en gardant tes genoux légèrement fléchis.","Marque une pause en haut, puis abaisse lentement le traîneau en fléchissant tes chevilles.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la masse à deux mains.","Gaine ta sangle abdominale et garde ton dos droit.","Abats le marteau vers le sol, en utilisant la force de ta sangle abdominale et du haut du corps.","En abaissant le marteau, pivote tes hanches et transfère la force au marteau.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Garde tes bras tendus et laisse la barre pendre devant tes cuisses.","Monte tes épaules tout droit vers tes oreilles, en contractant tes trapèzes en haut.","Maintiens un moment, puis abaisse tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège de la machine Smith de sorte que la barre soit à hauteur des épaules.","Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et recule, en maintenant une position stable.","Abaisse la barre derrière ta nuque, en gardant tes coudes pointés vers l'avant.","Pousse la barre vers le haut au-dessus de ta tête jusqu'à ce que tes bras soient complètement tendus.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur de la barre de la machine Smith à hauteur de la poitrine.","Allonge-toi à plat sur le banc, les pieds fermement ancrés au sol.","Saisis la barre avec une prise en pronation légèrement plus écartée que la largeur des épaules.","Sors la barre du support et abaisse-la vers ta poitrine, en gardant les coudes rentrés.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, les orteils pointés vers l'avant.","Place la barre sur le haut de ton dos, en la faisant reposer sur tes trapèzes.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Abaisse ton torse jusqu'à ce qu'il soit parallèle au sol, en ressentant un étirement dans tes ischio-jambiers.","Contracte tes fessiers et tes ischio-jambiers pour ramener ton torse vers le haut en position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi face à la barre, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur de la barre de la machine Smith dans une position confortable.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Place la barre sur le haut de ton dos, en la faisant reposer sur tes trapèzes.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses lentement ton corps en pliant tes genoux et tes hanches.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur le banc, les pieds à plat sur le sol.","Saisis la barre avec une prise serrée, un peu plus étroite que la largeur des épaules.","Abaisse la barre vers ta poitrine, en gardant tes coudes près de ton corps.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Fléchis les hanches et les genoux en gardant ton dos droit et ta poitrine haute, et saisis la barre en prise pronation légèrement plus large que la largeur des épaules.","Gaine ta sangle abdominale et soulève la barre en étendant tes hanches et tes genoux, en gardant la barre près de ton corps.","Tiens-toi bien droit, en étendant complètement les hanches et les genoux.","Abaisse la barre en fléchissant les hanches et les genoux, en gardant le contrôle et ton dos droit.","Répète le nombre de répétitions souhaité."],["Règle le banc décliné à l'angle souhaité.","Allonge-toi sur le banc, les pieds bloqués sous les cale-pieds.","Saisis la barre avec une prise en pronation un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith en position déclinée.","Allonge-toi sur le banc, les pieds bloqués sous les cale-pieds.","Saisis la barre avec une prise inversée, les mains un peu plus larges que la largeur des épaules.","Sors la barre du support et abaisse-la vers ta poitrine, en gardant les coudes rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur d'épaule.","Tiens-toi face à la barre, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Recule et place la barre sur le devant des épaules, en la faisant reposer sur la clavicule et les deltoïdes.","Garde la poitrine relevée, le dos droit et ta sangle abdominale gainée.","Abaisse ton corps en fléchissant les genoux et les hanches, comme si tu t'asseyais sur une chaise.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol ou légèrement en dessous.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur d'épaule.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Passe sous la barre et place-la sur le haut du dos, reposant sur tes trapèzes.","Saisis la barre avec les mains légèrement plus écartées que la largeur des épaules.","Sors la barre du support et fais un pas en arrière, en maintenant une position stable.","En gardant la poitrine relevée et la sangle abdominale gainée, amorce le squat en poussant tes hanches vers l'arrière et en fléchissant tes genoux.","Abaisse ton corps jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que ta souplesse le permet.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la barre de la machine Smith à une hauteur adaptée à ton corps.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Positionne-toi sous la barre, en la faisant reposer sur le haut de tes trapèzes et tes épaules.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu dégages la barre du support.","Fais un pas en arrière et place tes pieds un peu plus écartés que la largeur des épaules.","Fléchis les genoux et abaisse ton corps en gardant la poitrine relevée et le dos droit.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol ou légèrement en dessous.","Marque une pause en bas, puis pousse sur tes talons pour rev
