t et répète du côté gauche."],["Allonge-toi face vers le bas sur un banc, les hanches au bord et les jambes tendues droit derrière toi.","Tiens-toi au banc pour te soutenir.","En gardant le haut de ton corps immobile, plie tes genoux et fléchis tes jambes vers tes fessiers.","Marque une pause en haut, puis étends lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble de sorte que les sangles de cheville soient au réglage le plus bas.","Allonge-toi face vers le bas sur le banc, les jambes tendues et les sangles de chevilles attachées à tes pieds.","Tiens-toi aux poignées du banc pour la stabilité.","Fléchis les genoux et enroule tes jambes vers tes fessiers en contractant tes ischio-jambiers.","Marque une pause en haut du mouvement, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe une barre à hauteur de taille ou utilise un entraîneur en suspension.","Tiens-toi face à la barre ou au sangle de suspension, les pieds écartés à la largeur des épaules.","Saisis la barre ou les poignées avec une prise en pronation, un peu plus large que la largeur des épaules.","Penche-toi en arrière, en gardant le corps droit et les talons au sol.","Tire ta poitrine vers la barre ou les poignées en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe une barre à hauteur de taille et allonge-toi en dessous.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Positionne ton corps de sorte que tes talons soient au sol et ton corps droit.","Tire ta poitrine vers le haut en direction de la barre en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc à une hauteur qui permet à ton corps de pendre librement en dessous.","Allonge-toi face vers le haut au sol, la tête orientée vers le banc.","Lève les bras et saisis le banc en prise pronation, un peu plus large que la largeur des épaules.","Positionne ton corps de sorte que tes talons soient au sol et tes bras complètement tendus.","Gaine ta sangle abdominale et resserre tes omoplates en tirant ta poitrine vers le banc.","Marque une pause en haut du mouvement, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe une barre à hauteur de taille sur une machine Smith ou utilise un entraîneur en suspension.","Tiens-toi face à la barre ou au sangle de suspension et attrape-la en prise pronation, les mains écartées à la largeur des épaules.","Avance les pieds en te penchant en arrière jusqu'à ce que ton corps forme un léger angle.","Garde ton corps droit et tire ta poitrine vers la barre ou les poignées, en resserrant tes omoplates.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un entraîneur en suspension ou des sangles à hauteur de poitrine.","Tiens-toi face au point d'ancrage et attrape les poignées en prise pronation.","Avance les pieds en te penchant en arrière jusqu'à ce que ton corps forme un angle.","Garde ton corps droit et gaine ta sangle abdominale.","Tire ta poitrine vers les poignées en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les bras tendus sur les côtés.","Lève tes jambes vers le plafond en les gardant tendues.","Abaisse lentement tes jambes d'un côté, en cherchant à toucher le sol avec tes pieds.","Maintiens l'étirement pendant quelques secondes, puis ramène tes jambes à la position de départ.","Répète l'étirement de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Étends les bras droit devant toi, parallèles au sol, les paumes tournées l'une vers l'autre.","Contracte les muscles de ta poitrine l'un contre l'autre aussi fort que possible, tout en gardant les bras tendus.","Maintiens cette position pendant quelques secondes, en te concentrant sur la contraction de tes muscles pectoraux.","Relâche la contraction et détends les muscles de ta poitrine.","Répète le nombre de répétitions souhaité."],["Commence allongé sur le dos sur un tapis ou un banc.","Étends les bras droit sur les côtés, perpendiculaires à ton corps.","Gaine ta sangle abdominale et lève tes deux jambes du sol, en les gardant jointes et droites.","Abaisse lentement tes jambes d'un côté, en cherchant à toucher le sol avec tes pieds tout en gardant le contrôle.","Marque une pause, puis utilise ta sangle abdominale pour ramener tes jambes à la position de départ.","Répète le mouvement, cette fois en abaissant tes jambes vers le côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence en position debout, les pieds écartés à la largeur des épaules.","Descends en position accroupie, en posant les mains au sol devant toi.","Renvoie tes pieds vers l'arrière, en atterrissant en position de pompe.","Effectue une pompe, en abaissant ta poitrine vers le sol puis en te repoussant vers le haut.","Ramène tes pieds vers l'avant en sautant, en atterrissant en position de squat.","Saute vers le haut de manière explosive, en tendant les bras au-dessus de ta tête.","Atterris en douceur et redescends immédiatement en position de squat pour commencer la répétition suivante."],["Tiens-toi debout, les pieds joints et les bras le long du corps.","Saute en écartant les pieds et en levant les bras au-dessus de ta tête.","À l'atterrissage, saute rapidement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras au-dessus de la tête.","Gaine ta sangle abdominale et lève tes jambes et ton haut du corps simultanément, en tendant tes mains vers tes orteils.","Marque une pause en haut, puis abaisse lentement tes jambes et le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens les poignées de la corde à sauter avec tes mains, les paumes tournées vers l'intérieur.","Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Fais passer la corde au-dessus de ta tête et saute par-dessus lorsqu'elle arrive vers tes pieds.","Atterris en douceur sur la pointe des pieds et répète le saut lorsque la corde revient.","Continue à sauter pendant la durée ou le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Saute du sol de manière explosive, en étendant tes hanches, tes genoux et tes chevilles.","En plein saut, ramène rapidement tes bras vers l'avant pour l'équilibre.","Atterris en douceur sur la pointe des pieds et enchaîne immédiatement avec la répétition suivante.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Saute de manière explosive, en étendant complètement tes hanches et tes genoux.","Atterris en douceur sur la pointe des pieds et redescends immédiatement ton corps en position de squat.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens un kettlebell dans la main droite, le bras étendu au-dessus de la tête et la paume tournée vers l'avant.","Fais tourner légèrement ton pied gauche vers la droite, et transfère ton poids sur ta jambe gauche.","Fléchis ton genou gauche et bascule au niveau de la hanche en abaissant ton torse vers le côté gauche.","Garde le bras droit tendu au-dessus de la tête et les yeux sur le kettlebell.","En abaissant ton torse, laisse ta jambe droite se tendre et ton pied droit pivoter légèrement.","Abaisse ton torse jusqu'à ressentir un étirement dans ton ischio-jambier gauche et jusqu'à ce que ton bras droit pointe vers le sol.","Marque une pause, puis gaine ta sangle abdominale et pousse sur ton talon gauche pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et la poitrine relevée.","Laisse les kettlebells pendre devant ton corps, les bras complètement étendus.","En un mouvement fluide, étends de manière explosive tes hanches, hausse les épaules et tire les kettlebells vers tes épaules.","Lorsque les kettlebells atteignent la hauteur des épaules, fais pivoter tes poignets et réceptionne les kettlebells en position rack, les paumes tournées vers l'intérieur et les kettlebells reposant sur l'extérieur de tes avant-bras.","Abaisse les kettlebells jusqu'à la position de départ et répète le mouvement avec le bras opposé.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur d'épaule.","Développe un kettlebell au-dessus de ta tête, en tendant complètement ton bras.","Abaisse le kettlebell à hauteur des épaules.","Répète avec l'autre bras.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Commence allongé sur le dos sur le sol, les genoux fléchis et les pieds à plat sur le sol.","Tiens un kettlebell dans chaque main, les paumes tournées vers tes pieds et les bras étendus droit vers le plafond.","Abaisse un kettlebell vers ton épaule tout en gardant l'autre kettlebell tendu droit vers le haut.","Repousse le kettlebell abaissé vers le haut jusqu'à la position de départ tout en abaissant simultanément l'autre kettlebell vers ton épaule.","Continue à alterner le mouvement de développé avec chaque kettlebell pour le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains agrippant les kettlebells et les pieds écartés à la largeur des hanches.","Gaine ta sangle abdominale et garde ton corps en ligne droite de la tête aux talons.","Tire un kettlebell vers ta poitrine, en gardant ton coude près de ton corps.","Abaisse le kettlebell jusqu'à la position de départ et répète avec l'autre bras.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens un kettlebell dans chaque main, paumes tournées vers ton corps.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Tire un kettlebell vers ta poitrine, en gardant ton coude près de ton corps et en contractant tes omoplates.","Abaisse le kettlebell jusqu'à la position de départ et répète avec l'autre bras.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur d'épaule, paumes tournées vers toi.","Gaine ta sangle abdominale et pousse les kettlebells au-dessus de ta tête, en tournant tes paumes vers l'avant à mesure que tu étends tes bras.","Marque une pause en haut du mouvement, puis abaisse lentement les kettlebells jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans ta main droite.","Fléchis légèrement les genoux et pousse la kettlebell au-dessus de ta tête avec ton bras droit en gardant ton coude verrouillé.","Fais pivoter ton torse vers la gauche, en transférant ton poids sur ton pied gauche.","Fléchis ton genou gauche et abaisse ton torse vers le sol en gardant ton bras droit tendu au-dessus de ta tête.","En descendant, garde les yeux sur le kettlebell et la poitrine ouverte.","Une fois ta main gauche en contact avec le sol, pousse sur ton pied gauche et tends ta jambe gauche, en poussant tes hanches vers l'avant.","En poussant tes hanches vers l'avant, utilise ta sangle abdominale et ton bras droit pour repousser le kettlebell vers la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et la poitrine relevée.","Laisse le kettlebell pendre entre tes jambes, le bras complètement étendu.","En un mouvement fluide, étends de manière explosive tes hanches et tes genoux tout en tirant la kettlebell vers ton épaule.","Lorsque le kettlebell atteint la hauteur des épaules, fais pivoter ton poignet de sorte que le bas du kettlebell soit tourné vers le haut.","Réceptionne la kettlebell à hauteur de l'épaule avec ton coude fléchi et ta paume tournée vers le haut.","Abaisse le kettlebell jusqu'à la position de départ en inversant le mouvement.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et la poitrine relevée.","Laisse les kettlebells pendre bien droit devant ton corps.","En un mouvement fluide, étends de manière explosive tes hanches et tes genoux tout en haussant les épaules.","Lorsque les kettlebells montent, tire-les vers tes épaules en gardant tes coudes hauts et écartés vers les côtés.","Réceptionne les kettlebells à hauteur des épaules, les paumes tournées vers l'intérieur et les coudes pointés vers l'avant.","Abaisse les kettlebells jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur d'épaule.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Développe les kettlebells au-dessus de ta tête, en tendant complètement tes bras.","Fléchis les genoux et descends rapidement en demi-accroupissement.","Étends de manière explosive tes hanches et tes genoux, en propulsant les kettlebells au-dessus de ta tête.","Verrouille tes bras et rattrape les kettlebells au-dessus de la tête, les genoux légèrement fléchis.","Redresse-toi et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur des épaules.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Amorce le mouvement en étendant de manière explosive tes hanches, tes genoux et tes chevilles, en propulsant les kettlebells au-dessus de ta tête.","Lorsque les kettlebells atteignent le sommet, développe-les complètement au-dessus de la tête en verrouillant tes bras.","Abaisse les kettlebells jusqu'à la position de départ en fléchissant tes coudes et en les ramenant à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main, bras tendus devant tes cuisses.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos plat et la poitrine relevée.","En un seul mouvement explosif, étends tes hanches, tes genoux et tes chevilles, et tire simultanément les kettlebells vers tes épaules.","Lorsque les kettlebells atteignent la hauteur des épaules, fais pivoter tes poignets et propulse les kettlebells au-dessus de la tête en étendant complètement tes bras.","Abaisse les kettlebells jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans ta main droite.","Étends ton bras droit au-dessus de la tête, en gardant les yeux sur le kettlebell.","Fais tourner ton pied gauche de 45 degrés vers la gauche et ton pied droit de 90 degrés vers la droite.","Penche-toi vers la gauche au niveau de la taille en gardant ton bras droit tendu au-dessus de ta tête.","Abaisse le kettlebell vers le sol, en tendant vers ton pied gauche.","Marque une pause, puis gaine ta sangle abdominale et pousse sur ton pied droit pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Commence allongé sur le dos sur le sol, les genoux fléchis et les pieds à plat sur le sol.","Tiens un kettlebell dans une main, la paume tournée vers tes pieds.","Étends ton bras droit vers le plafond, en gardant ton coude verrouillé et ton poignet droit.","Abaisse lentement le kettlebell vers la position de départ, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Fais passer la kettlebell entre tes jambes, en changeant de main lorsqu'elle arrive derrière tes jambes.","Lorsque le kettlebell revient vers l'avant, passe-le à l'autre main entre tes jambes.","Continue à passer la kettlebell entre tes jambes dans un mouvement en huit.","Maintiens un rythme régulier et gaine ta sangle abdominale pendant tout l'exercice.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens le kettlebell des deux mains devant ta poitrine, près de ton corps.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses tes hanches vers le bas et l'arrière, comme si tu t'asseyais sur une chaise.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Pousse sur tes talons pour te relever, en contractant tes fessiers en haut.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell près de ta poitrine à deux mains.","En gardant la poitrine relevée et la sangle abdominale gainée, abaisse ton corps en position de squat en fléchissant les genoux et les hanches.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell devant tes cuisses.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Abaisse le kettlebell vers le sol, en le laissant se balancer entre tes jambes.","Étends rapidement tes hanches et tes genoux, en utilisant l'élan pour faire monter le kettlebell à hauteur des épaules.","Lorsque le kettlebell atteint la hauteur des épaules, fais pivoter tes poignets et réceptionne le kettlebell en position rack, le coude rentré et le kettlebell reposant sur ton avant-bras.","Abaisse le kettlebell jusqu'à la position de départ entre tes jambes, et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell devant ta poitrine à deux mains.","Fais un pas en avant avec le pied droit, en abaissant ton corps en position de fente.","En te fendant vers l'avant, fais passer le kettlebell sous ta cuisse droite et transfère-le dans ta main gauche.","Pousse sur ton pied droit pour revenir à la position de départ, tout en repassant simultanément le kettlebell dans ta main droite.","Répète la fente du côté opposé, en passant le kettlebell sous ta cuisse gauche.","Continue à alterner les fentes et à passer la kettlebell d'une main à l'autre pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main en prise pronation.","Fléchis légèrement les genoux et bascule au niveau des hanches en abaissant la kettlebell entre tes jambes.","Étends de manière explosive tes hanches, tes genoux et tes chevilles, en utilisant l'élan pour balancer la kettlebell jusqu'à hauteur des épaules.","Lorsque le kettlebell atteint la hauteur des épaules, fais pivoter ton poignet et propulse ta main bien droit vers le haut en verrouillant ton bras au-dessus de la tête.","Abaisse le kettlebell jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos au sol, les genoux fléchis et les pieds à plat au sol.","Tiens le kettlebell dans une main, la paume tournée vers tes pieds et le bras étendu droit vers le plafond.","Abaisse lentement le kettlebell vers ta poitrine en fléchissant le coude, en gardant le haut de ton bras près de ton corps.","Marque une pause lorsque le kettlebell est juste au-dessus de ta poitrine, puis repousse-le vers le haut pour revenir à la position de départ en étendant ton coude.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main à hauteur d'épaule.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Développe le kettlebell au-dessus de ta tête en ligne droite, en tendant complètement ton bras.","En poussant le kettlebell au-dessus de ta tête, fléchis simultanément tes genoux et redresse-les rapidement pour générer de l'élan.","Lorsque le kettlebell atteint son point le plus haut, glisse-toi rapidement en dessous en fléchissant tes genoux et tes hanches.","Réceptionne la kettlebell avec une légère flexion des genoux et des hanches, et ton bras complètement tendu au-dessus de ta tête.","Tiens-toi bien droit, en étendant complètement les genoux et les hanches, et stabilise le kettlebell au-dessus de la tête.","Abaisse le kettlebell jusqu'à la position de départ en fléchissant tes genoux et tes hanches, et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main à hauteur d'épaule.","Gaine ta sangle abdominale et garde ton dos droit.","Développe le kettlebell au-dessus de ta tête, en tendant complètement ton bras.","Marque une pause en haut, puis abaisse lentement le kettlebell pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main à hauteur d'épaule.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Développe le kettlebell au-dessus de ta tête en tendant ton bras et en tendant complètement tes jambes.","Abaisse le kettlebell jusqu'à la position de départ en fléchissant tes genoux et en ramenant le kettlebell à ton épaule.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et ta sangle abdominale gainée.","Tire le kettlebell vers le haut en direction de ta poitrine en gardant ton coude près de ton corps et en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement le kettlebell pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté et recommence avec l'autre bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main entre tes jambes.","Fléchis légèrement les genoux et bascule au niveau des hanches en abaissant la kettlebell vers le sol.","Étends de manière explosive tes hanches et tes genoux, en utilisant l'élan pour balancer la kettlebell vers ton épaule.","Lorsque le kettlebell atteint la hauteur des épaules, fais pivoter ta main et propulse-le bien droit au-dessus de la tête en étendant complètement ton bras.","Abaisse le kettlebell entre tes jambes et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell d'une main.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Lève le kettlebell à hauteur des épaules en gardant ton coude près de ton corps.","Étends complètement ton bras au-dessus de la tête, en redressant ton coude.","Abaisse le kettlebell à hauteur des épaules, puis reviens à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell devant ta poitrine à deux mains.","Décolle ton pied gauche du sol et étends-le vers l'avant, en le gardant parallèle au sol.","Abaisse lentement ton corps en position accroupie, en gardant ton pied droit à plat sur le sol et ta jambe gauche tendue.","Marque une pause en bas du squat, puis pousse sur ton talon droit pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Commence en position de planche haute, les mains sur les kettlebells, écartées à la largeur des épaules.","Abaisse ta poitrine vers le sol, en gardant les coudes près de ton corps.","Pousse à travers tes mains de manière explosive en soulevant tes mains des kettlebells et en tendant complètement tes bras.","Atterris en douceur sur les kettlebells et rabaisse immédiatement ta poitrine pour la répétition suivante.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens un kettlebell dans chaque main à hauteur des épaules, les paumes tournées vers l'avant.","Développe les kettlebells au-dessus de ta tête, en tendant complètement tes bras.","Abaisse les kettlebells à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens un kettlebell dans chaque main à hauteur d'épaule, les paumes tournées vers l'avant.","Développe les kettlebells au-dessus de ta tête en tendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement les kettlebells à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur d'épaule.","Développe un kettlebell au-dessus de ta tête tout en gardant l'autre kettlebell à hauteur des épaules.","Abaisse le kettlebell pressé à hauteur des épaules tout en pressant simultanément l'autre kettlebell au-dessus de la tête.","Continue à alterner le mouvement de poussée en créant un mouvement de bascule.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils tournés vers l'extérieur.","Tiens un kettlebell des deux mains devant ton corps, les bras étendus vers le bas.","Fléchis les genoux et abaisse tes hanches en position accroupie en gardant le dos droit.","Pousse sur tes talons et étends explosivement tes hanches et tes genoux, en tirant le kettlebell vers ton menton.","En tirant le kettlebell vers le haut, garde tes coudes hauts et écartés et contracte tes omoplates l'une vers l'autre.","Abaisse le kettlebell jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens le kettlebell des deux mains devant ton corps, les bras étendus.","Fléchis légèrement les genoux et bascule au niveau des hanches en poussant tes fesses vers l'arrière.","Balance le kettlebell vers l'arrière entre tes jambes, en gardant les bras tendus et le dos plat.","Pousse tes hanches vers l'avant et balance le kettlebell jusqu'à hauteur d'épaule, en utilisant l'élan généré par tes hanches.","Laisse le kettlebell revenir en balancier entre tes jambes et répète le mouvement pour le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell devant ta poitrine à deux mains, les paumes tournées l'une vers l'autre.","Descends en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière, en gardant ta poitrine relevée et ton dos droit.","Une fois au bas du squat, pousse explosivement sur tes talons pour te relever tout en poussant simultanément le kettlebell au-dessus de ta tête.","Verrouille tes bras en haut du mouvement, en étendant complètement tes coudes.","Abaisse le kettlebell jusqu'à la position de départ en inversant le mouvement, en fléchissant tes coudes et en ramenant le poids à ta poitrine.","Répète le nombre de répétitions souhaité."],["Commence allongé sur le dos, les jambes tendues et le kettlebell tenu dans ta main droite, le bras complètement tendu au-dessus de ton épaule.","Fléchis ton genou droit et pose ton pied droit à plat sur le sol en gardant ta jambe gauche tendue.","En poussant sur ton pied droit, soulève tes hanches du sol, en venant dans une position de pont.","Fais glisser ta jambe gauche sous ton corps, en fléchissant le genou gauche et en posant le pied gauche à plat sur le sol.","Fais pivoter ton torse vers la gauche, en amenant ta main gauche au sol pour te soutenir.","En poussant sur ton pied droit et ta main gauche, soulève ton torse du sol, en venant dans une position agenouillée.","Depuis la position à genoux, lève-toi en gardant le kettlebell tendu au-dessus de la tête.","Inverse le mouvement pour revenir à la position de départ.","Répète l'exercice de l'autre côté, en commençant avec le kettlebell dans ta main gauche."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell devant tes cuisses à deux mains, paumes tournées vers toi.","Fléchis légèrement les genoux et bascule au niveau des hanches en abaissant la kettlebell vers le sol.","Étends de manière explosive tes hanches et tes genoux, en utilisant l'élan pour tirer la kettlebell vers tes épaules.","Lorsque le kettlebell atteint la hauteur des épaules, fais pivoter tes poignets et réceptionne le kettlebell en position rack, les coudes rentrés et le kettlebell reposant sur l'arrière de ton avant-bras.","Abaisse le kettlebell jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans chaque main à hauteur d'épaule, paumes tournées vers l'avant.","Gaine ta sangle abdominale et pousse les kettlebells au-dessus de ta tête, en étendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement les kettlebells pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens un kettlebell dans chaque main, paumes tournées vers ton corps.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Tire les kettlebells vers le haut en direction de ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement les kettlebells pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un kettlebell dans ta main droite au-dessus de ta tête.","Fais tourner ton pied gauche vers l'extérieur d'environ 45 degrés et garde ton pied droit pointé vers l'avant.","Penche ton torse vers le côté gauche en gardant ton bras droit tendu au-dessus de ta tête et les yeux sur la kettlebell.","Abaisse ton torse aussi bas que possible en gardant ton bras droit tendu et ton bras gauche étendu sur le côté.","Marque une pause, puis reviens à la position de départ en poussant sur ton pied droit et en gainant tes obliques.","Répète le nombre de répétitions souhaité, puis change de côté."],["Assieds-toi au bord d'un banc ou d'une chaise, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Penche-toi légèrement en arrière et place tes mains sur le bord du banc ou de la chaise pour te soutenir.","En gainant tes ischio-jambiers, soulève tes pieds du sol et étends tes jambes droit devant toi.","Marque une pause en haut, puis fléchis lentement tes genoux et ramène tes pieds vers ton corps.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et utilise un mouvement de balancier pour générer de l'élan.","En te balançant vers l'avant, tire ta poitrine vers la barre en utilisant tes grands dorsaux et tes biceps pour initier le mouvement.","Continue le mouvement vers le haut jusqu'à ce que ta poitrine atteigne la barre, puis passe en position de dip en poussant sur la barre et en étendant tes bras.","Redescends jusqu'à la position de départ en pliant les bras et en contrôlant la descente.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève tes omoplates du sol et amène ta main droite vers ton genou gauche.","Reviens à la position de départ et répète, cette fois en tendant ta main gauche vers ton genou droit.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence à genoux au sol, les pieds écartés à la largeur des hanches et les orteils pointés vers l'avant.","Tiens une barre en travers du haut de ton dos, en la posant sur tes épaules.","Gaine ta sangle abdominale et tes fessiers, puis saute explosivement en l'air, en étendant tes hanches et tes genoux.","En sautant, pousse sur tes orteils et étends complètement tes chevilles, tes genoux et tes hanches.","Atterris en douceur au sol, en fléchissant les genoux pour absorber l'impact.","Enchaîne immédiatement avec la répétition suivante, en répétant le mouvement de squat sauté."],["Mets-toi à genoux au sol, les genoux écartés à la largeur des hanches et les orteils pointés vers l'arrière.","Étends tes bras au-dessus de la tête et entrelace tes doigts.","En gardant le dos droit, penche-toi lentement vers le côté droit, en ressentant un étirement dans ton grand dorsal gauche.","Maintiens l'étirement pendant 20 à 30 secondes, puis reviens à la position de départ.","Répète l'étirement du côté gauche, en te penchant vers la gauche et en ressentant un étirement dans ton grand dorsal droit.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence à genoux, les mains sur le sol, écartées à la largeur des épaules.","Étends tes jambes derrière toi, en appui sur les orteils, et soulève ton corps en position de planche.","En gardant ta sangle abdominale gainée et tes hanches stables, soulève une main du sol et tape l'épaule opposée.","Ramène la main au sol et répète avec l'autre main.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence à genoux au sol, les mains écartées à la largeur des épaules, les doigts pointés vers l'avant.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, de sorte que ton corps forme une ligne droite de la tête aux talons.","Gaine ta sangle abdominale et abaisse ton corps vers le sol en pliant tes coudes, en les gardant près de tes flancs.","Continue à descendre jusqu'à ce que ta poitrine soit juste au-dessus du sol, puis repousse vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Positionne-toi entre deux barres parallèles, les bras tendus et soutenant le poids de ton corps.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Saisis la barre de traction avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi, les bras complètement étendus et le corps droit.","Contracte tes grands dorsaux et tes biceps pour hisser ton corps vers la barre, en gardant les coudes près du corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Place tes mains au sol à côté de tes hanches, les doigts pointés vers l'avant.","Gaine ta sangle abdominale et lève tes jambes du sol, en les gardant droites.","Essaie d'amener tes jambes parallèles au sol, en formant un « L » avec ton corps.","Maintiens cette position aussi longtemps que possible.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre à deux mains devant ta poitrine.","Fléchis légèrement les genoux et fais pivoter ton torse vers la droite en balançant la barre vers ta hanche droite.","Une fois au bas du mouvement, inverse rapidement le mouvement et pivote ton torse vers la gauche en balançant la barre vers le haut et en travers de ton corps vers ton épaule gauche.","Continue ce mouvement de torsion en alternant les côtés, pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la barre en prise pronation, en la faisant reposer sur l'avant de tes épaules.","En gardant ta sangle abdominale gainée et le dos droit, soulève la barre vers le haut et loin de ton corps, en la levant à hauteur d'épaule.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et le corps bien droit.","Gaine ta sangle abdominale et déplace lentement ton poids vers l'avant, en amenant tes épaules au-delà de tes mains.","Garde tes coudes légèrement fléchis et ton corps droit pendant que tu te penches vers l'avant.","Maintiens cette position pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Garde la main gauche levée pour protéger ton visage et la main droite près du menton.","Fais pivoter tes hanches et pivote sur ton pied gauche en étendant ton bras gauche vers l'avant dans un mouvement de coup de poing.","Fais pivoter ton torse et gaine les muscles de ta sangle abdominale pour générer de la puissance dans le coup de poing.","Ramène ton bras d'un coup sec à la position de départ et répète pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc plat, les jambes tendues droit devant toi.","Place tes mains sur le banc à côté de tes hanches pour le soutien.","Gaine tes abdominaux et lève tes jambes du sol, en amenant tes genoux vers ta poitrine.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues.","Plie un genou et amène-le vers ta poitrine en tenant ta cuisse ou ton tibia.","Tends la jambe autant que possible tout en la gardant surélevée.","Maintiens l'étirement pendant 20 à 30 secondes.","Répète avec l'autre jambe."],["Règle le siège et la plateforme pour pieds de la machine à levier dans la position souhaitée.","Assieds-toi sur la machine, le dos contre le dossier et les pieds sur la plateforme de pied.","Place tes mains sur les poignées ou les côtés de la machine pour plus de stabilité.","Pousse un pied contre la plateforme repose-pieds en étendant ta jambe jusqu'à ce qu'elle soit presque complètement tendue.","Marque une pause, puis plie lentement ta jambe et reviens à la position de départ.","Répète avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Règle la hauteur du siège et la position du repose-pieds pour garantir un bon alignement.","Assieds-toi sur la machine, le dos droit et les pieds à plat sur la plaque de pied.","Saisis les poignées avec une prise serrée, les paumes tournées l'une vers l'autre.","Garde la poitrine relevée et les épaules en arrière tout au long de l'exercice.","Tire une poignée vers ton torse tout en gardant l'autre poignée immobile.","Contracte tes omoplates l'une vers l'autre à la fin du mouvement.","Ramène lentement la poignée à la position de départ et répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Règle la machine à levier au niveau de résistance souhaité.","Tiens-toi sur la plateforme pour les pieds et saisis les poignées en prise pronation, légèrement plus écartées que la largeur des épaules.","Suspends-toi, les bras complètement étendus, en gardant le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers les poignées, en menant avec ta poitrine.","Continue à tirer jusqu'à ce que ton menton soit au-dessus des poignées.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine pour l'adapter à ta taille et à ton amplitude de mouvement.","Assieds-toi sur la machine, le dos contre le coussinet et les pieds bien calés.","Place tes mains sur les poignées ou les barres de prise.","Gaine ta sangle abdominale et penche-toi lentement en avant, en laissant ton dos s'arrondir légèrement.","Marque une pause en position basse, en ressentant un étirement dans le bas de ton dos.","En utilisant les muscles de ton dos, relève lentement ton torse vers la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la barre en prise pronation, les mains un peu plus écartées que la largeur des épaules.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et place-toi face à la machine.","Saisis la barre en V avec une prise en pronation, en gardant le dos droit et les genoux légèrement fléchis.","Tire la barre en V vers ton abdomen en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut du mouvement, puis relâche lentement le poids pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos contre le coussin.","Saisis les poignées avec une prise en supination, les paumes tournées vers le haut, et garde les coudes près de tes flancs.","Expire et remonte les poignées vers le haut, en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement les poignées jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Règle le siège de la machine à levier de sorte que tes épaules soient alignées avec le coussin du levier.","Place tes orteils sur le coussin du levier, les talons dans le vide.","Saisis les poignées ou les supports latéraux pour te stabiliser.","Pousse le coussin du levier vers le bas en étendant tes chevilles, en contractant tes mollets.","Marque une pause en bas du mouvement.","Reviens lentement à la position de départ en laissant tes talons remonter.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos bien à plat contre le coussin.","Saisis les poignées avec une prise en pronation et place tes coudes à un angle de 90 degrés.","Pousse les poignées vers l'avant jusqu'à ce que tes bras soient complètement tendus, en expirant pendant le mouvement.","Marque une brève pause à la fin du mouvement, puis reviens lentement à la position de départ en inspirant.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos bien à plat contre le coussin.","Saisis les poignées avec une prise en pronation et place tes coudes à un angle de 90 degrés.","Pousse les poignées vers l'avant jusqu'à ce que tes bras soient complètement tendus, en expirant pendant le mouvement.","Marque une brève pause à la fin du mouvement, puis reviens lentement à la position de départ en inspirant.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et la plateforme pour pieds dans la position souhaitée.","Assieds-toi sur la machine, le dos contre le coussinet et les pieds à plat sur la plateforme de pied.","Saisis les poignées ou les côtés du siège pour te stabiliser.","Contracte tes fessiers et tes ischio-jambiers, et pousse sur tes talons pour soulever le poids.","Garde le dos droit et évite d'arrondir tes épaules.","Étends complètement tes hanches en haut du mouvement, en contractant tes fessiers.","Abaisse le poids de manière contrôlée, en gardant la tension sur tes fessiers et tes ischio-jambiers.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et le dossier de la machine à levier dans une position confortable.","Assieds-toi sur la machine, le dos contre le dossier et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et place tes mains légèrement plus écartées que la largeur des épaules.","Pousse les poignées vers l'avant et loin de ton corps jusqu'à ce que tes bras soient complètement tendus.","Abaisse lentement les poignées vers ta poitrine, en gardant tes coudes légèrement fléchis.","Marque une pause en bas, puis ramène les poignées à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à levier à la hauteur adaptée à ton corps.","Positionne-toi face à la machine, les orteils sur le repose-pieds et les talons dans le vide.","Place tes mains sur les poignées ou les barres de support pour plus de stabilité.","Sollicite tes mollets et lève tes talons aussi haut que possible, en utilisant la pointe de tes pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à t.","Répète le nombre de répétitions souhaité."],["Règle la machine pour l'adapter à ton corps et assieds-toi dessus, le dos contre le dossier.","Place le bas de tes jambes sous le levier rembourré, juste au-dessus de tes chevilles.","Saisis les poignées sur les côtés de la machine pour te soutenir.","En gardant le haut de tes jambes immobile, expire et fléchis tes jambes vers le haut aussi loin que possible.","Maintiens la position contractée pendant une brève pause en contractant tes ischio-jambiers.","Inspire et abaisse lentement le levier jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur la machine à levier, le dos contre le dossier et les pieds sur les repose-pieds.","Saisis les poignées ou les barres latérales pour te stabiliser.","Gaine tes abdominaux et lève lentement tes jambes vers ta poitrine, en enroulant ton torse vers l'avant en même temps.","Marque une pause en haut, puis abaisse lentement tes jambes et ton torse pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et garde les bras légèrement fléchis.","Expire et resserre tes omoplates en tirant les poignées vers l'arrière et vers l'extérieur, loin de ton corps.","Marque une pause au sommet de la contraction, puis inspire et reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise parallèle, les paumes tournées l'une vers l'autre, et garde les bras légèrement fléchis.","Expire et resserre tes omoplates en tirant les poignées vers l'arrière et vers l'extérieur, loin de ton corps.","Marque une pause au sommet de la contraction, puis inspire et reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et les repose-pieds dans une position confortable.","Assieds-toi sur la machine, la poitrine contre le coussinet et les pieds sur les repose-pieds.","Saisis les poignées avec une prise en pronation, écartées à la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée.","Tire les poignées vers ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet du mouvement.","Relâche lentement les poignées et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le siège de la presse à jambes de sorte que tes genoux soient légèrement fléchis lorsque tes pieds sont sur le repose-pieds.","Assieds-toi sur la machine, le dos contre le dossier et les pieds à plat sur la plaque de pied, écartés à la largeur des épaules.","Place tes orteils et la plante de tes pieds sur le repose-pieds, en gardant tes talons hors du bord.","Relâche les poignées de sécurité et pousse le repose-pieds loin de toi en étendant tes genoux.","Une fois tes genoux complètement tendus, abaisse lentement tes talons en fléchissant tes mollets.","Marque une pause en bas, puis pousse le repose-pieds vers le haut en tendant tes mollets.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos contre le dossier.","Saisis les poignées avec une prise en pronation et place tes mains à hauteur des épaules.","Pousse les poignées vers le haut jusqu'à ce que tes bras soient complètement tendus, mais ne verrouille pas tes coudes.","Marque une pause en haut, puis abaisse lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et le dossier de la machine à levier dans une position confortable.","Assieds-toi sur la machine, le dos contre le dossier et les pieds à plat sur le sol.","Saisis les poignées de la machine avec une prise en pronation, un peu plus large que la largeur des épaules.","Pousse les poignées vers le haut et vers l'avant jusqu'à ce que tes bras soient complètement tendus, mais pas verrouillés.","Marque une pause en haut, puis abaisse lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et le dossier de la machine à levier dans une position confortable.","Assieds-toi sur la machine, le dos contre le dossier et les pieds à plat sur le sol.","Saisis les poignées de la machine avec une prise en pronation, un peu plus large que la largeur des épaules.","Pousse les poignées vers le haut et vers l'avant jusqu'à ce que tes bras soient complètement tendus, mais pas verrouillés.","Marque une pause en haut, puis abaisse lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine à levier, le dos contre le coussin.","Saisis les poignées avec une prise en pronation et garde les bras tendus.","En gardant le dos droit, lève tes épaules vers tes oreilles le plus haut possible.","Maintiens la contraction un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à ta hauteur et tiens-toi debout, les pieds écartés à la largeur des épaules.","Place tes épaules sous les coussins et tiens les poignées pour plus de stabilité.","Lève tes talons aussi haut que possible en étendant tes chevilles.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et place tes mains à hauteur de la poitrine.","Pousse les poignées vers l'avant jusqu'à ce que tes bras soient complètement tendus, en gardant tes coudes légèrement fléchis.","Marque une pause, puis ramène lentement les poignées vers ta poitrine, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et la position du repose-pieds pour garantir un bon alignement.","Assieds-toi sur la machine, la poitrine contre le coussinet et les pieds à plat sur la plaque de pied.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Garde le dos droit et gaine ta sangle abdominale.","Tire les poignées vers ton torse en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet de la contraction, puis relâche lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Garde le dos droit et gaine ta sangle abdominale.","Tire les poignées vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut du mouvement, puis relâche lentement et étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos contre le coussin.","Saisis les poignées avec une prise en pronation et étends complètement les bras devant toi.","En gardant le haut des bras immobile, abaisse lentement les poignées vers ton front en fléchissant tes coudes.","Marque une pause en bas, puis pousse les poignées vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et place-toi face à la machine.","Saisis les poignées avec une prise en pronation et garde le dos droit.","Tire les poignées vers ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet du mouvement, puis relâche lentement et étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe la corde à un point d'ancrage haut.","Tiens-toi dos au point d'ancrage, les pieds écartés à la largeur des épaules.","Saisis la corde avec une prise en pronation, les paumes tournées vers le bas.","Penche-toi légèrement en avant, en gardant le dos droit et la sangle abdominale gainée.","Tire la corde vers ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause au sommet du mouvement, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes bras le long de ton corps, les paumes tournées vers le bas.","Contracte tes fessiers et ta sangle abdominale, puis soulève tes hanches du sol jusqu'à ce que ton corps forme une ligne droite de tes genoux à tes épaules.","Marque une pause en haut, en contractant tes fessiers.","Abaisse lentement tes hanches vers la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le ventre, les jambes tendues et les bras le long du corps.","Contracte tes fessiers et tes ischio-jambiers, et soulève lentement le haut du corps du sol, en enroulant ton dos vers le haut.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec le pied droit, en abaissant ton corps en position de fente.","Pousse sur ton pied droit et saute en l'air en changeant la position de tes pieds en plein saut.","Atterris en douceur avec le pied gauche en avant et abaisse immédiatement ton corps en position de fente.","Continue à alterner entre les fentes et les sauts pour le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec le pied droit, en abaissant ton corps en position de fente.","En te fendant, pivote ton torse vers la droite en amenant ton coude gauche vers ton genou droit.","Marque une pause, puis reviens à la position de départ.","Répète de l'autre côté en avançant ton pied gauche et en faisant pivoter ton torse vers la gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues.","Fléchis ta jambe supérieure et attrape ta cheville ou ton pied avec ta main.","Tire doucement ta cheville ou ton pied vers tes fessiers jusqu'à ce que tu sentes un étirement dans tes quadriceps.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche l'étirement et répète de l'autre côté."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et lève ton haut du corps du sol, en amenant ton coude droit vers ton genou gauche.","En même temps, étends ta jambe droite bien droite et soulève-la du sol.","Marque une pause, puis reviens à la position de départ.","Répète le mouvement, cette fois en amenant ton coude gauche vers ton genou droit et en étendant ta jambe gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc plat, le dos plaqué contre lui.","Place tes mains sous tes fessiers pour te soutenir.","Garde les jambes tendues et serrées, et lève-les vers le plafond.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Place tes mains sous tes fessiers pour te soutenir.","Gaine ta sangle abdominale et lève tes jambes du sol, en les levant vers le plafond.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, le dos bien à plat contre le coussin.","Saisis les poignées avec une prise en pronation et place tes coudes à un angle de 90 degrés.","Pousse les poignées vers l'avant jusqu'à ce que tes bras soient complètement tendus, en expirant pendant le mouvement.","Marque une pause à la fin du mouvement, puis reviens lentement à la position de départ en inspirant.","Répète le nombre de répétitions souhaité."],["Tiens-toi dos à un mur, les pieds écartés à la largeur des hanches.","Fais glisser lentement ton dos le long du mur jusqu'à ce que tes genoux soient fléchis à un angle de 90 degrés.","Décolle ton pied droit du sol et amène ton genou vers ta poitrine.","Repose ton pied droit et soulève ton pied gauche du sol, en ramenant ton genou vers ta poitrine.","Continue à alterner entre le fait de lever ton pied droit et ton pied gauche pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un médecine-ball à deux mains à hauteur de poitrine.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Descends en position accroupie, en gardant le dos droit et la poitrine relevée.","Étends de manière explosive tes hanches et tes jambes, tout en lançant simultanément le médecine-ball au-dessus de ta tête.","Relâche le ballon en haut du mouvement et rattrape-le en redescendant.","Abaisse ton corps en position de squat et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant le médecine-ball à hauteur de poitrine.","Étends tes bras vers l'avant, en poussant le médecine-ball loin de ta poitrine avec force.","En relâchant le ballon, accompagne le mouvement avec tes bras et ton torse en transférant ton poids de ton pied arrière à ton pied avant.","Attrape la balle lorsqu'elle rebondit sur le mur ou revient du partenaire, et répète immédiatement le mouvement.","Continue pour le nombre de répétitions souhaité."],["Commence dans une position à 3 appuis, une main sur le médecine-ball et l'autre main sur le sol.","Étends tes jambes et place ton corps en ligne droite.","Abaisse ta poitrine vers le sol tout en gardant le dos droit.","Pousse le médecine-ball loin de ton corps en tendant complètement ton bras.","Reviens à la position de départ et répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un médecine-ball à hauteur de poitrine.","Étends tes bras vers l'avant, en poussant le médecine-ball loin de ta poitrine.","Marque une pause, puis ramène lentement le médecine-ball vers ta poitrine.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant le médecine-ball à hauteur de poitrine.","Étends tes bras vers l'avant, en poussant le médecine-ball loin de ta poitrine.","Marque une pause, puis ramène lentement le médecine-ball vers ta poitrine.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un médecine-ball à hauteur de poitrine.","Avance le pied droit et pousse simultanément le médecine-ball vers l'avant, en tendant complètement les bras.","En poussant le ballon vers l'avant, relâche-le et laisse-le rouler vers l'avant.","Cours rapidement vers l'avant et attrape le ballon avant qu'il ne touche le sol.","Une fois que tu attrapes le ballon, ramène-le contre ta poitrine et répète le mouvement avec ton pied gauche en avant.","Continue à alterner les jambes et à répéter l'exercice pour le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains sur le médecine-ball, écartées à la largeur des épaules.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","Repousse-toi vers la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un médecine-ball à deux mains au-dessus de ta tête.","Gaine ta sangle abdominale et garde ton dos droit.","Fléchis légèrement les genoux et projette avec force le médecine-ball au sol devant toi.","En claquant le ballon vers le sol, utilise tout ton corps pour générer de la puissance, y compris tes épaules et ta sangle abdominale.","Attrape la balle au rebond et répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos sur un banc, les genoux fléchis et les pieds à plat au sol.","Tiens le médecine-ball des deux mains, en étendant tes bras droit au-dessus de ta poitrine.","Abaisse le médecine-ball vers ta poitrine, en gardant tes coudes près de ton corps.","Pousse de manière explosive le médecine-ball vers le haut, en tendant complètement tes bras et en lançant le ballon aussi haut que possible.","Attrape le médecine-ball et répète le nombre de répétitions souhaité."],["Saisis la barre de traction avec une prise en supination (paumes tournées vers toi), les mains un peu plus larges que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et les pieds décollés du sol.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en menant avec ta poitrine.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ avec contrôle.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds écartés à la largeur des hanches.","Abaisse ton corps vers le sol, en fléchissant les coudes et en gardant ta sangle abdominale gainée.","En abaissant ton corps, déplace ton poids vers l'arrière et soulève tes hanches vers le plafond, créant un V inversé avec ton corps.","Continue à abaisser ton corps jusqu'à ce que ta poitrine soit juste au-dessus du sol, puis inverse le mouvement en repoussant tes hanches vers le bas et en étendant tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains directement sous les épaules et le corps bien aligné.","Abaisse ton corps vers le sol en fléchissant tes coudes, en les gardant près de tes côtés.","Une fois tes coudes à un angle de 90 degrés, abaisse tes avant-bras au sol, en gardant tes coudes directement sous tes épaules.","Marque une pause, puis pousse sur tes paumes pour relever tes avant-bras jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Place un élastique autour de tes chevilles.","Tiens-toi debout, les pieds écartés à la largeur des épaules et fléchis légèrement tes genoux.","Fais un pas sur le côté avec le pied droit, en maintenant la tension sur l'élastique.","Suis avec ton pied gauche, en faisant un pas sur le côté pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Commence en position de planche haute, les mains directement sous les épaules et le corps bien aligné.","Gaine ta sangle abdominale et amène ton genou droit vers ta poitrine, puis change rapidement et amène ton genou gauche vers ta poitrine.","Continue à alterner les jambes dans un mouvement de course en gardant tes hanches basses et ta sangle abdominale gainée.","Maintiens un rythme régulier et respire de façon régulière pendant tout l'exercice.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction, les paumes tournées vers l'extérieur et les bras complètement tendus.","Gaine ta sangle abdominale et tire ton corps vers la barre, en menant avec ta poitrine.","Une fois en haut du mouvement, change ta prise pour que tes paumes soient tournées vers toi.","Continue à te hisser jusqu'à ce que ta poitrine soit au-dessus de la barre et que tes bras soient complètement fléchis.","Inverse le mouvement en t'abaissant lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre verticale, les paumes tournées vers l'extérieur et les bras complètement tendus.","Gaine ta sangle abdominale et tire ton corps vers la barre, en menant avec ta poitrine.","En te hissant vers le haut, penche-toi légèrement en arrière et amène tes coudes vers tes côtés.","Continue à tirer jusqu'à ce que ta poitrine atteigne la barre et que tes coudes soient complètement fléchis.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et positionne-toi en position de pompe avec tes mains sur le ballon, légèrement plus rapprochées que la largeur des épaules.","Gaine ta sangle abdominale et garde ton corps en ligne droite de la tête aux pieds.","Abaisse ta poitrine vers le ballon en fléchissant les coudes, en les gardant près de ton corps.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout ou assis bien droit, les épaules détendues.","Incline la tête d'un côté, en amenant ton oreille vers ton épaule.","Maintiens l'étirement pendant 15 à 30 secondes.","Répète de l'autre côté.","Effectue 2 à 4 séries de chaque côté."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine tes abdominaux et décolle tes omoplates du sol, en faisant pivoter ton torse d'un côté.","Marque une pause, puis abaisse tes omoplates jusqu'à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine tes abdominaux et décolle tes omoplates du sol, en faisant pivoter ton torse d'un côté.","Marque une pause, puis abaisse lentement tes omoplates vers le sol.","Répète de l'autre côté en alternant les côtés à chaque répétition."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre olympique en prise pronation.","Laisse la barre pendre à bout de bras devant tes cuisses, les paumes tournées vers ton corps.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant la barre en prise pronation.","Lève la barre au-dessus de ta tête en tendant complètement tes bras.","En gardant le haut des bras près de la tête, abaisse lentement la barre derrière ta tête en fléchissant tes coudes.","Marque une pause, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur, les pieds écartés à la largeur des épaules.","Étends un bras droit devant toi et place ta paume contre le mur.","Gaine ta sangle abdominale et penche ton corps vers l'avant, en gardant ton bras droit et ton dos plat.","Pousse lentement contre le mur avec ta paume, en activant tes grands dorsaux.","Maintiens la position pendant quelques secondes, puis relâche et répète avec l'autre bras."],["Tiens-toi face à une barre de traction, les pieds écartés à la largeur des épaules.","Lève les bras et saisis la barre en prise supination, une main agrippant la barre et l'autre tenant ton poignet pour te soutenir.","Suspends-toi à la barre, le bras complètement étendu, en gardant le corps droit et la sangle abdominale gainée.","Hisse-toi vers le haut en direction de la barre en fléchissant ton coude et en contractant les muscles de ton dos.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre, puis abaisse-toi lentement jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras et recommence."],["Tiens-toi dos à un banc ou une chaise, les pieds écartés à la largeur des épaules.","Place une main sur le banc ou la chaise derrière toi, les doigts pointés vers ton corps.","Étends tes jambes devant toi, en gardant les talons au sol.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc ou de la chaise.","Marque une pause en bas, puis pousse sur tes paumes pour tendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté et recommence avec l'autre bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant le médecine-ball d'une main devant ta taille.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Lève le médecine-ball au-dessus de ta tête en tendant complètement ton bras.","Claque avec force le médecine-ball au sol, en utilisant ta sangle abdominale et tes épaules pour générer de la puissance.","Attrape le médecine-ball au rebond et répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens une serviette d'une main.","Penche-toi vers l'avant au niveau de la taille en gardant ton dos droit et ta sangle abdominale gainée.","Étends complètement ton bras, en laissant la serviette pendre devant toi.","Tire la serviette vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement la serviette pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils pointés vers l'avant.","Place tes mains sur une surface stable pour le soutien, comme un mur ou une barre.","Décolle une jambe du sol, en gardant ton genou légèrement fléchi.","Lève ton talon aussi haut que possible en utilisant tes mollets.","Marque une pause en haut, puis abaisse lentement ton talon.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Tiens-toi les pieds écartés à la largeur des hanches et place tes mains sur un mur ou un objet solide pour l'équilibre.","Décolle un pied du sol et tiens en équilibre sur l'autre pied.","Soulève lentement ton talon du sol, en élevant ton corps sur la pointe du pied.","Marque une pause en haut, puis abaisse lentement ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe et recommence."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Étends une jambe vers l'avant, en la gardant décollée du sol.","Fléchis ta jambe d'appui et abaisse ton corps comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le dos droit.","Pousse à travers ton talon pour revenir à la position de départ.","Répète avec l'autre jambe."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Abaisse ton corps vers le sol en fléchissant les coudes, en gardant le dos droit et la sangle abdominale gainée.","En te repoussant vers le haut, lance une jambe sur le côté en l'étendant complètement et en engageant tes fessiers.","Ramène ta jambe à la position de départ et répète la pompe, en alternant les jambes à chaque répétition.","Continue à alterner les coups de pied et les pompes pour le nombre de répétitions souhaité."],["Tiens-toi debout ou assis bien droit, les pieds écartés à la largeur des épaules.","Étends un bras au-dessus de la tête, en le fléchissant au niveau du coude pour que ta main atteigne l'omoplate opposée.","Avec ton autre main, tire doucement le coude du bras tendu vers le côté opposé de ta tête, en sentant un étirement dans tes triceps.","Maintiens l'étirement pendant 15 à 30 secondes, puis relâche.","Répète de l'autre côté."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains le long de ton corps.","Gaine tes abdominaux et bascule ton bassin vers le haut, en pressant le bas de ton dos contre le sol.","Maintiens cette position pendant quelques secondes, en te concentrant sur la contraction de tes abdominaux.","Relâche l'inclinaison et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes bras le long de ton corps, les paumes tournées vers le bas.","Contracte tes fessiers et tes muscles abdominaux.","Bascule ton bassin vers le haut, en soulevant tes hanches du sol.","Maintiens la position du pont pendant quelques secondes.","Abaisse lentement tes hanches vers la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Enroule la corde autour de la plante de ton pied et tiens les extrémités de la corde avec tes mains.","Tire doucement la corde vers toi, en fléchissant ton pied et en étirant tes mollets.","Maintiens l'étirement pendant 15 à 30 secondes.","Relâche la tension sur la corde et répète l'étirement avec l'autre jambe.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Gaine ta sangle abdominale et lève tes hanches vers le plafond, en formant un V inversé avec ton corps.","Abaisse le haut de ton corps vers le sol en fléchissant les coudes, en les gardant près de ton corps.","En descendant, déplace ton poids vers l'avant et passe en position du cobra en tendant tes bras et en soulevant ta poitrine.","Inverse le mouvement en fléchissant tes coudes et en abaissant ta poitrine vers le sol.","Pousse à travers tes mains pour revenir à la position en V inversé.","Continue le mouvement en abaissant tes hanches vers le sol, pour revenir à la position de départ des pompes.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en gardant ton corps aligné.","Pousse de manière explosive sur le sol en utilisant les muscles de ta poitrine pour propulser le haut de ton corps hors du sol.","Atterris en douceur avec les mains de retour en position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi les pieds écartés à la largeur des hanches et les bras le long du corps.","Fais un pas en arrière avec le pied droit, en atterrissant sur la pointe du pied.","Fléchis ton genou gauche et abaisse ton corps en position de fente.","En descendant dans la fente, tends simultanément tes bras au-dessus de la tête.","Marque une pause en bas de la fente, puis reviens à la position de départ en poussant sur ton talo
