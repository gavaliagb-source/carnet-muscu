a poitrine, en gardant tes bras légèrement fléchis.","Gaine ta sangle abdominale et fais pivoter lentement ton torse d'un côté, en gardant les hanches et les jambes stables.","Marque une pause à la fin de la rotation, puis reviens lentement à la position de départ.","Répète la rotation du côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Fixe une poignée de câble à une poulie basse et tiens-toi face à la machine.","Saisis la poignée avec ta main gauche et éloigne-toi de la machine, en étendant complètement ton bras.","Positionne tes pieds écartés à la largeur des épaules, les genoux légèrement fléchis.","Garde le dos droit et ta sangle abdominale gainée tout au long de l'exercice.","Tire la poignée vers ton corps en faisant pivoter ton torse vers la droite pendant le mouvement.","Contracte les muscles de ton dos à la fin du mouvement.","Reviens lentement à la position de départ, en maintenant la tension sur le câble.","Répète le nombre de répétitions souhaité, puis change de côté et effectue le mouvement avec ta main droite."],["Assieds-toi sur un banc incliné, le dos contre le coussin et les pieds à plat sur le sol.","Saisis les poignées du câble avec une prise en supination, les paumes tournées vers le haut et les bras complètement tendus.","En gardant le haut des bras immobile, expire et fléchis les poignées vers tes épaules en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement les poignées jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la poignée de câble dans chaque main, les paumes tournées vers l'intérieur et les bras fléchis à un angle de 90 degrés.","En gardant le haut des bras immobile, étends tes avant-bras vers l'arrière jusqu'à ce que tes bras soient complètement tendus.","Marque une pause, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble de sorte que la barre de tirage soit à une hauteur au-dessus de ta tête.","Assieds-toi sur le siège et saisis la barre de tirage avec une prise en supination, les mains un peu plus écartées que la largeur des épaules.","Garde le dos droit et penche-toi légèrement vers l'arrière.","Tire la barre vers ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe les poignées aux câbles à hauteur de la poitrine.","Tiens-toi au centre de la machine à câble, un pied légèrement devant l'autre.","Saisis les poignées avec les paumes tournées vers le bas et les bras étendus sur les côtés.","Garde une légère flexion dans tes coudes et gaine ta sangle abdominale.","Tire les câbles ensemble devant ta poitrine, en les croisant l'un sur l'autre.","Contracte les muscles de ta poitrine au sommet du mouvement.","Relâche lentement les câbles pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à hauteur de la poitrine.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée.","Tire la barre vers le haut de ta poitrine, en contractant tes omoplates.","Marque une pause en haut du mouvement.","Relâche lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens l'accessoire du câble en prise pronation.","Garde le dos droit et ta sangle abdominale gainée tout au long de l'exercice.","Tire l'accessoire du câble droit vers le haut en direction de ton menton, en menant avec tes coudes.","Marque une pause en haut, en rapprochant tes omoplates l'une de l'autre.","Abaisse lentement la poignée du câble vers la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble de sorte que la barre de tirage soit à une hauteur au-dessus de ta tête.","Assieds-toi sur le siège et saisis la barre de tirage avec une large prise en pronation.","Garde le dos droit et la poitrine relevée pendant que tu te penches légèrement vers l'arrière.","Tire la barre vers le haut de ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à poulie basse.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en supination, les paumes tournées vers le haut et les mains écartées à la largeur des épaules.","Pose tes avant-bras sur un banc ou un coussin, les poignets dépassant du bord.","En gardant tes avant-bras immobiles, expire et fléchis tes poignets vers le haut aussi loin que possible.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur, les pieds écartés à la largeur des hanches.","Place tes mains contre le mur à hauteur des épaules.","Recule un pied, en gardant le talon au sol et la jambe tendue.","Fléchis légèrement ton genou avant et penche-toi en avant en sentant un étirement dans ton mollet.","Maintiens l'étirement pendant 20 à 30 secondes.","Change de jambe et répète l'étirement."],["Tiens-toi face à un mur, les pieds écartés à la largeur des hanches.","Place tes mains contre le mur à hauteur des épaules.","Recule le pied droit, en gardant le talon au sol et la jambe tendue.","Fléchis ton genou gauche et penche-toi vers l'avant en gardant ta jambe arrière tendue et ton talon au sol.","Maintiens l'étirement pendant 20 à 30 secondes.","Change de jambe et répète l'étirement."],["Tiens-toi face à un mur ou un objet solide, les pieds écartés à la largeur des hanches.","Tiens les extrémités de la corde dans chaque main et place le milieu de la corde autour de la plante de ton pied droit.","Recule le pied gauche, en gardant le talon au sol et la jambe tendue.","Penche-toi en avant, en gardant le dos droit, et tire doucement sur la corde pour étirer ton mollet.","Maintiens l'étirement pendant 20 à 30 secondes, puis relâche.","Répète avec l'autre jambe."],["Installe une barre au sol et allonge-toi face contre le banc, la poitrine juste au bord.","Penche-toi et saisis la barre en prise pronation, un peu plus large que la largeur des épaules.","Les jambes tendues et les pieds au sol, soulève la barre du sol en tendant tes bras.","Tire la barre vers ta poitrine, en contractant tes omoplates.","Abaisse la barre jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Assieds-toi sur la chaise romaine, le dos contre le dossier et tes avant-bras posés sur les coussinets.","Garde le haut du corps stable et le dos droit.","Gaine tes abdominaux et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou aussi haut que tu peux confortablement aller.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'une chaise, le dos droit et les pieds à plat sur le sol.","Étends une jambe droit devant toi, en gardant ton talon au sol.","Penche-toi légèrement en avant, en sentant un étirement dans tes quadriceps.","Maintiens cette position pendant 20 à 30 secondes.","Change de jambe et répète l'étirement."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Étends les bras droit devant toi à hauteur d'épaules.","Croise tes bras devant ton corps, le bras droit par-dessus le bras gauche.","Entrelace tes doigts et presse tes paumes l'une contre l'autre.","Resserre doucement tes omoplates et pousse tes mains vers l'avant, en sentant un étirement dans ta poitrine et à l'avant de tes épaules.","Maintiens l'étirement pendant 20 à 30 secondes, puis relâche.","Répète le nombre de répétitions souhaité."],["Positionne-toi sur des barres parallèles, les bras complètement tendus et le corps droit.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que tes épaules soient sous tes coudes.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Règle les barres de dips à une hauteur qui te permet de les saisir confortablement.","Tiens-toi entre les barres et place tes mains sur chaque barre, légèrement plus écartées que la largeur des épaules.","Saute et tends les bras, en soutenant le poids de ton corps sur les barres.","Fléchis tes genoux et croise tes chevilles derrière toi.","Abaisse ton corps en fléchissant tes coudes, en gardant ta poitrine relevée et tes épaules abaissées.","Continue à descendre jusqu'à ce que tes épaules soient en dessous de tes coudes ou jusqu'à ce que tu sentes un étirement dans ta poitrine.","Pousse à travers tes paumes et étends tes coudes pour ramener ton corps vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Saisis les barres parallèles, les paumes tournées vers le bas et les bras complètement tendus.","Fléchis tes genoux et croise tes chevilles.","Abaisse ton corps en fléchissant tes bras jusqu'à ce que tes épaules soient sous tes coudes.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens le ballon d'exercice des deux mains et étends tes bras droit devant toi.","Ramène lentement le ballon d'exercice vers ta poitrine, en ressentant un étirement dans les muscles pectoraux.","Maintiens l'étirement pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et le corps bien aligné.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","En te baissant, tape ta poitrine avec ta main droite.","Repousse-toi vers le haut jusqu'à la position de départ.","Répète le mouvement, cette fois en tapotant ta poitrine avec ta main gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les paumes tournées vers toi et les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et tire ton corps vers la barre, en menant avec ta poitrine.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction avec une prise parallèle serrée, les paumes tournées vers toi.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les mains sur les hanches.","Fléchis légèrement les genoux et décolle les talons du sol en équilibre sur la pointe des pieds.","En gardant les genoux fléchis, fais pivoter tes genoux en un mouvement circulaire, d'abord dans le sens des aiguilles d'une montre puis dans le sens inverse.","Effectue le mouvement pour le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules.","Abaisse ton corps vers le sol en fléchissant les coudes, en gardant ta sangle abdominale gainée.","Pousse à travers tes paumes de manière explosive pour propulser ton corps hors du sol.","En plein saut, tape des mains avant de retomber dans la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains directement sous les épaules et le corps bien aligné.","Abaisse ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","En descendant, fais pivoter ton corps vers la gauche en tendant ton bras gauche bien droit sur le côté.","Repousse-toi vers la position de départ en faisant pivoter ton corps vers le centre.","Répète la pompe, cette fois en faisant pivoter ton corps vers la droite et en étendant ton bras droit sur le côté.","Continue à alterner les côtés à chaque répétition."],["Saisis la barre de traction, les paumes tournées vers toi et les mains écartées à la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et les pieds décollés du sol.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains rapprochées, directement sous les épaules.","Gaine ta sangle abdominale et abaisse ton corps vers le sol, en gardant tes coudes près de tes flancs.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence à quatre pattes, les mains écartées à la largeur des épaules et les genoux écartés à la largeur des hanches.","Abaisse le haut de ton corps vers le sol en fléchissant les coudes, en les gardant près de tes flancs.","Marque une pause lorsque ta poitrine est juste au-dessus du sol.","Pousse à travers tes paumes pour tendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence assis au sol, les genoux fléchis et les pieds à plat sur le sol.","Place tes mains derrière toi, les doigts pointés vers tes pieds, et soulève tes hanches du sol.","Étends une jambe droit devant toi tout en tendant simultanément ta main opposée vers tes orteils.","Reviens à la position de départ et répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève le haut de ton corps du sol et tourne pour amener ton coude droit vers ton genou gauche.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète de l'autre côté en amenant ton coude gauche vers ton genou droit.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Étends les bras droit au-dessus de ta tête.","En gainant tes abdominaux, soulève le haut de ton corps du sol, en t'enroulant vers l'avant en direction de tes genoux.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Allonge-toi en arrière sur le ballon jusqu'à ce que le bas de ton dos soit soutenu et que le haut de ton corps soit parallèle au sol.","Place tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps vers tes genoux, en enroulant ton torse vers l'avant.","Marque une pause en haut du mouvement, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Allonge-toi en arrière sur le ballon jusqu'à ce que le bas de ton dos soit soutenu et que le haut de ton corps soit parallèle au sol.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps du ballon, en enroulant tes épaules vers tes hanches.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et décolle tes épaules du sol, en t'enroulant vers l'avant en direction de tes genoux.","Marque une pause en haut, puis abaisse lentement tes épaules pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fais un pas en diagonale derrière et en travers de ton corps avec le pied droit, en le croisant derrière ta jambe gauche.","Fléchis les deux genoux comme si tu faisais une révérence, en abaissant ton corps vers le sol.","Garde le torse droit et le poids sur le pied avant.","Pousse à travers ton pied avant pour revenir à la position de départ.","Répète de l'autre côté en faisant un pas en diagonale derrière et en travers de ton corps avec ton pied gauche."],["Règle la hauteur du siège et installe-toi sur le vélo cross trainer.","Place tes pieds sur les pédales et agrippe le guidon.","Commence à pédaler d'un mouvement fluide et contrôlé.","Maintiens un rythme régulier et augmente la résistance si tu le souhaites.","Continue à pédaler pendant la durée souhaitée de ta séance de cardio."],["Allonge-toi sur le dos, les bras tendus vers le plafond.","Fléchis les genoux et décolle les jambes du sol en créant un angle de 90 degrés au niveau de tes hanches et de tes genoux.","Gaine ta sangle abdominale et le bas de ton dos pour presser le bas de ton dos contre le sol.","Abaisse lentement ton bras droit et ta jambe gauche vers le sol, en les gardant tendus et suspendus juste au-dessus du sol.","Marque une pause, puis reviens à la position de départ.","Répète le mouvement avec ton bras gauche et ta jambe droite.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, les pieds bloqués et les genoux fléchis à un angle de 90 degrés.","Place tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps vers tes genoux, en enroulant ton torse.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Place tes mains au sol légèrement plus écartées que la largeur des épaules, avec tes pieds surélevés sur une surface stable.","Garde ton corps bien aligné de la tête aux pieds, en gainant ta sangle abdominale.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en les gardant près de ton corps.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, les pieds bloqués et les genoux fléchis.","Place tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps du banc, en t'enroulant vers l'avant en direction de tes genoux.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et le corps bien aligné.","Abaisse ta poitrine vers le sol en fléchissant les coudes, en les gardant près de ton corps.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains rapprochées, formant un losange avec tes pouces et tes index.","Garde ton corps bien aligné de la tête aux pieds, en gainant ta sangle abdominale et tes fessiers.","Abaisse ta poitrine vers le losange formé par tes mains, en gardant les coudes près de ton corps.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les orteils sur une surface surélevée, comme une marche ou un bloc.","Place tes mains sur un support stable, comme un mur ou une rampe, pour l'équilibre.","Lève tes talons aussi haut que possible en reportant le poids de ton corps sur la plante de tes pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules.","Abaisse ta poitrine vers le sol, en gardant les coudes près de ton corps.","Une fois ta poitrine juste au-dessus du sol, pose rapidement tes genoux au sol.","Repousse-toi vers le haut jusqu'à la position de départ en étendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit avec un haltère dans chaque main, les paumes tournées vers l'avant et les bras complètement tendus.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever les haltères jusqu'à ce que tes biceps soient complètement contractés et que les haltères soient à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser les haltères jusqu'à la position de départ.","Répète le nombre de répétitions souhaité en alternant les bras."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens un haltère dans chaque main, les paumes tournées vers l'avant.","Place l'arm blaster sur tes bras, en veillant à un maintien sûr.","En gardant le haut des bras immobile, expire et fléchis un haltère vers ton épaule en contractant tes biceps.","Continue à lever l'haltère jusqu'à ce que ton biceps soit complètement contracté et que l'haltère soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et abaisse lentement l'haltère jusqu'à la position de départ.","Répète le mouvement avec le bras opposé.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc à prêcheur avec un haltère dans chaque main, paumes tournées vers ton torse et bras entièrement tendus.","Garde le haut des bras immobile et expire en fléchissant les poids tout en contractant tes biceps.","Continue à lever les haltère d gauche jusqu'à la position de départ, en gardant ton pied droit sur la marche.","Répète le mouvement en alternant le pied avec lequel tu montes à chaque fois.","Continue pour le nombre de répétitions souhaité."],["Tiens-toi devant un banc ou une marche avec un haltère dans chaque main, les paumes tournées vers ton corps.","Place ton pied droit sur le banc ou le step, en veillant à ce que tout ton pied soit en contact avec la surface.","Monte sur le banc ou la marche avec le pied droit, en poussant sur ton talon pour soulever ton corps.","En montant sur la marche, soulève simultanément ton genou gauche vers ta poitrine.","Marque une pause en haut du mouvement, puis abaisse lentement ton pied gauche au sol tout en gardant ton pied droit sur le banc ou la marche.","Répète le mouvement avec ton pied gauche sur le banc ou la marche.","Continue à alterner entre ton pied droit et ton pied gauche pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main en prise pronation.","En gardant le dos droit et ta sangle abdominale gainée, bascule au niveau des hanches et abaisse les haltères vers le sol, en permettant une légère flexion des genoux.","Abaisse les haltères jusqu'à ce que tu ressentes un étirement dans tes ischio-jambiers, puis contracte tes fessiers et pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds fermement ancrés au sol.","Tiens un haltère des deux mains et étends les bras droit au-dessus de ta poitrine.","En gardant les bras tendus, abaisse lentement l'haltère derrière ta tête dans un mouvement en arc.","Marque une pause, puis ramène l'haltère à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main en prise pronation.","En gardant le dos droit et ta sangle abdominale gainée, bascule au niveau des hanches et abaisse les haltères vers le sol, en laissant ton torse se pencher vers l'avant.","Continue à abaisser les haltères jusqu'à ce que tu sentes un étirement dans tes ischio-jambiers, en gardant les genoux légèrement fléchis.","Marque une pause en bas, puis contracte tes fessiers et tes ischio-jambiers pour relever ton torse jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils tournés vers l'extérieur.","Tiens un haltère des deux mains devant ton corps, les bras étendus.","Fléchis les genoux et abaisse tes hanches en position accroupie en gardant le dos droit.","Abaisse l'haltère entre tes jambes, en gardant tes bras tendus.","Pousse sur tes talons et étends tes hanches vers l'avant, en tirant l'haltère vers le haut et devant ton corps.","Contracte tes fessiers en haut du mouvement, puis abaisse l'haltère entre tes jambes.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main le long du corps.","En gardant la poitrine relevée et la sangle abdominale gainée, abaisse lentement ton corps en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc plat avec un haltère dans chaque main, paumes tournées l'une vers l'autre.","Lève les haltères à hauteur des épaules, puis fais pivoter tes poignets de sorte que tes paumes soient tournées vers l'extérieur.","Pousse les haltères vers le haut jusqu'à ce que tes bras soient complètement tendus, puis abaisse-les de nouveau à hauteur des épaules.","Ramène tes poignets à la position de départ et répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans ta main droite.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Amène ton coude droit vers ton côté en le gardant fléchi à un angle de 90 degrés.","Étends ton bras droit vers l'arrière, en contractant tes triceps.","Marque une pause, puis abaisse lentement l'haltère jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Tiens un haltère dans chaque main avec une prise en pronation, les paumes tournées vers l'extérieur.","Étends les bras droit au-dessus de la poitrine, en gardant une légère flexion dans les coudes.","Abaisse les haltères vers ta poitrine, en gardant tes coudes près de ton corps.","En abaissant les haltères, fais pivoter tes poignets de sorte que tes paumes soient tournées vers toi en bas du mouvement.","Marque une pause en bas, puis inverse le mouvement en pressant les haltères vers le haut jusqu'à la position de départ.","En poussant les haltères vers le haut, tourne tes poignets pour revenir à la position de départ, paumes tournées vers l'extérieur.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main en prise pronation.","Laisse les haltères pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit et ta sangle abdominale gainée, expire et soulève les haltères droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main en prise pronation.","Lais s jusqu'à tes épaules tout en gardant tes bras immobiles.","En haut du mouvement, tourne tes poignets pour que tes paumes soient tournées vers l'extérieur de ton corps.","Abaisse lentement les haltères vers la position de départ, en tournant tes paumes de nouveau vers ton corps.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc à prêcheur avec un haltère dans chaque main, paumes tournées vers le haut et coudes posés sur le coussin.","Enroule les haltères vers tes épaules, en gardant tes bras immobiles et les paumes tournées vers le haut.","En haut de la flexion, tourne tes poignets pour que tes paumes soient tournées vers le bas.","Abaisse lentement les haltères vers la position de départ, en tournant tes poignets vers la position de départ en même temps.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens un haltère des deux mains avec une prise en pronation, et lève-le au-dessus de ta tête.","Plie tes coudes et abaisse l'haltère derrière ta tête en gardant le haut de tes bras près de tes oreilles.","Étends tes bras et ramène l'haltère à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Étends les bras droit sur les côtés, parallèles au sol.","Ramène lentement tes bras vers l'avant, en les croisant devant ton corps.","Sens l'étirement dans les muscles de ta poitrine.","Maintiens l'étirement pendant 10 à 30 secondes.","Reviens à la position de départ et répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'un banc ou d'une chaise, les mains agrippant le bord à côté de tes hanches.","Fais glisser tes hanches vers l'avant hors du banc et tends tes jambes, en gardant les talons au sol.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Marque une pause en bas, puis pousse sur tes mains pour tendre tes bras et soulever ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence allongé face contre terre sur le sol, les jambes tendues et les mains placées directement sous tes épaules.","Gaine ta sangle abdominale et pousse à travers tes paumes pour lever ton haut du corps du sol, en gardant tes coudes près de tes flancs.","Marque une pause en haut, en contractant les muscles du haut de ton dos.","Abaisse lentement ton corps vers la position de départ.","Répète le nombre de répétitions souhaité."],["Commence allongé sur le dos, les genoux fléchis et les pieds à plat sur le sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et lève ton haut du corps du sol, en amenant ton coude droit vers ton genou gauche.","En même temps, amène ton genou gauche vers ton coude droit en créant un mouvement de torsion.","Marque une pause en haut, puis abaisse lentement le haut de ton corps et étends tes jambes pour revenir à la position de départ.","Répète le mouvement, cette fois en amenant ton coude gauche vers ton genou droit et ton genou droit vers ton coude gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Place tes mains sur tes hanches ou croise-les devant ta poitrine.","En gardant le dos droit, penche-toi lentement vers l'avant au niveau de la taille, en abaissant le haut de ton corps vers le sol.","Marque une pause en bas, puis relève lentement le haut de ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens un haltère dans chaque main, les paumes tournées vers l'intérieur et les bras étendus le long de tes flancs.","Gaine ta sangle abdominale et lève lentement un bras vers ton épaule, en gardant le coude légèrement fléchi.","Marque une pause en haut, puis abaisse lentement ton bras pour revenir à la position de départ.","Répète le mouvement avec l'autre bras.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et allonge-toi face contre lui, tes hanches reposant sur le ballon et tes pieds contre un mur pour la stabilité.","Étends les bras droit devant toi, les paumes tournées vers le bas.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en gardant le dos droit et le cou aligné avec la colonne vertébrale.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et allonge-toi face contre lui, tes hanches reposant sur le ballon.","Positionne tes pieds contre un mur ou une autre surface stable pour te soutenir.","Croise tes bras derrière ta tête, les mains touchant l'arrière de ta tête.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en étendant ton dos jusqu'à ce que ton corps forme une ligne droite de la tête aux hanches.","Marque une pause en haut du mouvement, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et allonge-toi face contre lui, tes hanches reposant sur le ballon et tes pieds contre un mur pour la stabilité.","Positionne tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en étendant ton dos jusqu'à ce que ton corps forme une ligne droite de la tête aux talons.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence allongé face contre terre sur le ballon de stabilité, les hanches reposant sur le ballon et les pieds fermement ancrés au sol.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en étendant ton dos jusqu'à ce que ton corps forme une ligne droite de la tête aux talons.","Marque une pause en haut, puis tourne lentement ton torse d'un côté, en gardant tes hanches et tes jambes stables.","Reviens au centre et répète la rotation de l'autre côté.","Redescends le haut du corps jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Place tes mains sur le ballon à côté de tes hanches, les doigts pointés vers l'avant.","Contracte tes triceps et pousse sur tes mains pour soulever ton corps du ballon, en tendant tes bras.","Abaisse ton corps en fléchissant tes coudes, en les gardant près de tes côtés.","Répète le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et agenouille-toi devant lui.","Place ton pied droit sur le ballon de stabilité, le genou fléchi à un angle de 90 degrés.","Étends ta jambe gauche derrière toi, en la gardant tendue.","Penche-toi en avant, en poussant tes hanches vers le ballon de stabilité, jusqu'à ce que tu sentes un étirement dans le fléchisseur de ta hanche droite.","Maintiens l'étirement pendant 20 à 30 secondes, puis change de côté et répète."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens le ballon de stabilité des deux mains, en le serrant contre ta poitrine.","Gaine tes muscles abdominaux et penche-toi lentement en arrière, en gardant le dos droit et les pieds bien ancrés au sol.","Continue à te pencher vers l'arrière jusqu'à ce que tu sentes un étirement dans les muscles de ton dos.","Maintiens la position pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens un haltère dans une main et étends ton bras droit au-dessus de ta tête.","Penche-toi lentement du côté opposé, en ressentant un étirement dans ton grand dorsal.","Maintiens l'étirement pendant 20 à 30 secondes, puis reviens à la position de départ.","Répète de l'autre côté."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Avance lentement les pieds, en faisant rouler le ballon le long de ton dos jusqu'à ce que le bas de ton dos repose sur le ballon.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine ta sangle abdominale et abaisse lentement le haut du corps vers le sol, en laissant le bas de ton dos s'étirer sur le ballon.","Maintiens l'étirement pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et la tête soutenue par le ballon de stabilité.","Place ton bras supérieur sur le ballon pour plus de stabilité.","Passe ton bras supérieur au-dessus de ta tête et laisse ton torse pivoter légèrement.","Sens l'étirement dans tes grands dorsaux sur le côté de ton corps.","Maintiens l'étirement pendant 20 à 30 secondes, puis change de côté et répète."],["Tiens-toi dos à un mur et place un ballon d'exercice entre le bas de ton dos et le mur.","Positionne tes pieds écartés à la largeur des épaules, les orteils pointés vers l'avant.","Tiens un haltère dans chaque main, les bras étendus le long de tes flancs.","Lève tes talons du sol en reportant le poids de ton corps sur la plante de tes pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur, les pieds écartés à la largeur des épaules.","Place un ballon d'exercice entre le mur et le bas de ton dos.","Tiens un haltère dans chaque main, les bras étendus le long de tes flancs.","Place une balle de tennis entre tes chevilles.","Lève tes talons du sol en soulevant ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi dos à un mur et place un ballon d'exercice entre le bas de ton dos et le mur.","Positionne tes pieds écartés à la largeur des épaules et légèrement devant toi.","Tiens un haltère dans chaque main, les bras étendus le long de tes flancs.","Place une balle de tennis entre tes genoux.","Lève tes talons du sol en soulevant ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur le ballon de stabilité, les hanches reposant sur le ballon et les jambes tendues droit derrière toi.","Place tes mains au sol devant toi pour le soutien.","Contracte tes fessiers et tes muscles abdominaux pour stabiliser ton corps.","Soulève lentement une jambe du sol, en la gardant tendue et parallèle au sol.","Fais tourner ta jambe vers l'extérieur, loin de ton corps, tout en gardant tes hanches et le haut de ton corps stables.","Marque une pause à la fin de la rotation, puis ramène lentement ta jambe à la position de départ.","Répète la rotation avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Commence allongé sur le dos, les jambes tendues et les talons reposant sur le ballon de stabilité.","Place tes bras le long de ton corps pour la stabilité.","Contracte tes fessiers et tes muscles abdominaux pour soulever tes hanches du sol, en créant une ligne droite de tes épaules à tes talons.","Fléchis ton genou droit et amène-le vers ta poitrine en gardant ta jambe gauche tendue et ton pied fléchi.","Lance ta jambe droite en diagonale à travers ton corps, en la tendant complètement et en engageant tes ischio-jambiers.","Ramène lentement la jambe droite à la position de départ, en gardant le contrôle et la stabilité.","Répète le mouvement avec ta jambe gauche, en alternant les côtés pour le nombre de répétitions souhaité."],["Commence en position de pompe, les mains sur le sol et les tibias posés sur le ballon de stabilité.","Gaine ta sangle abdominale et lève tes hanches vers le plafond, en faisant rouler le ballon vers tes mains.","Garde les jambes tendues et le corps en position de pique, formant un V inversé.","Plie tes coudes et abaisse le haut de ton corps vers le sol en gardant ta tête alignée avec tes mains.","Pousse à travers tes mains et étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur un tapis, les jambes tendues et les orteils reposant sur le ballon de stabilité.","Place tes mains au sol, écartées à la largeur des épaules, et gaine ta sangle abdominale.","En gardant les jambes tendues, soulève-les lentement du sol, en utilisant ton bas du dos et tes fessiers pour les lever le plus haut possible.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Fais rouler lentement le ballon vers l'avant, en avançant les pieds jusqu'à ce que le haut de ton dos repose sur le ballon et que tes jambes soient tendues droit devant toi.","Place tes mains sur tes hanches pour te soutenir.","Gaine ta sangle abdominale et abaisse lentement le haut du corps vers le sol, en gardant le dos droit et la poitrine relevée.","Arrête-toi lorsque tu sens un étirement dans les ischio-jambiers, et maintiens la position pendant 20 à 30 secondes.","Reviens lentement à la position de départ en poussant sur tes talons et en utilisant tes ischio-jambiers pour te tirer vers le haut.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens un haltère dans une main et étends ton bras droit au-dessus de ta tête.","Plie ton coude et abaisse l'haltère derrière ta tête en gardant le haut de ton bras près de ton oreille.","Maintiens l'étirement pendant quelques secondes, puis reviens à la position de départ.","Répète avec l'autre bras."],["Assieds-toi sur un ballon d'exercice, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Tiens un haltère des deux mains et étends les bras droit vers le plafond.","Abaisse lentement l'haltère derrière ta tête, en gardant tes coudes près de tes oreilles.","Marque une pause, puis ramène l'haltère vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon d'exercice et tiens une barre EZ avec une prise en pronation.","Étends les bras droit vers le haut, en gardant les coudes près de la tête.","Abaisse lentement la barre derrière ta tête en fléchissant les coudes.","Marque une pause, puis étends tes bras vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds au sol.","Tiens la barre EZ en prise pronation (paumes tournées vers l'extérieur), les mains écartées à la largeur des épaules.","Étends tes bras droit au-dessus de ta poitrine, en gardant une légère flexion dans tes coudes.","Abaisse la barre en arc de cercle derrière ta tête, en maintenant la légère flexion de tes coudes.","Marque une pause, puis ramène la barre à la position de départ en inversant le mouvement en arc.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et la tête au bout du banc.","Tiens la barre EZ en prise serrée, les paumes tournées vers le haut, et étends tes bras droit au-dessus de ta poitrine.","En gardant le haut des bras immobile, abaisse  en prise pronation, les mains écartées à la largeur des épaules.","Étends complètement tes bras, en gardant tes coudes près de ta tête.","Abaisse lentement la barre vers ton front, en fléchissant tes coudes.","Marque une pause, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Assieds-toi sur le banc, le dos contre le coussin, et tiens la barre EZ avec une prise en pronation.","Étends complètement tes bras au-dessus de la tête, en gardant tes coudes près de ta tête.","Abaisse la barre derrière ta tête en fléchissant tes coudes, en gardant le haut de tes bras immobile.","Marque une pause, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre EZ avec une prise en pronation, un peu plus large que la largeur des épaules.","Abaisse la barre vers ta poitrine, en gardant tes coudes serrés près de ton corps.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens la barre EZ en prise supination.","Garde tes coudes près de ton torse et le haut de tes bras immobile tout au long de l'exercice.","Enroule la barre vers le haut en contractant tes biceps, tout en expirant.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Ramène lentement la barre vers la position de départ en inspirant.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc à prêcheur, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis la barre EZ avec une prise en supination, les mains écartées à la largeur des épaules.","Pose le haut de tes bras sur le coussin, en laissant tes avant-bras pendre vers le bas.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et le dos droit.","Tiens la barre EZ en prise supination, les paumes tournées vers le haut et les mains écartées à la largeur des épaules.","Pose le haut de tes bras sur tes cuisses, en laissant la barre EZ pendre devant toi.","En gardant le haut des bras immobile, expire et fléchis la barre EZ vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre EZ jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre EZ en prise pronation, les mains écartées à la largeur des épaules.","Lève la barre au-dessus de ta tête en tendant complètement tes bras.","En gardant le haut des bras immobile, abaisse la barre derrière ta tête en fléchissant tes coudes.","Marque une pause, puis ramène la barre à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre EZ en prise supination, paumes tournées vers le haut.","Pose le haut de tes bras sur un banc à prêcher ou un ballon de stabilité, en laissant tes coudes pendre vers le bas.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre EZ en prise supination, paumes tournées vers le haut.","Pose le haut de tes bras sur un banc à prêcher ou un ballon de stabilité, en laissant tes coudes pendre vers le bas.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens la barre EZ en prise supination, les paumes tournées vers le haut.","Place le haut de tes bras contre l'arm blaster, en les gardant immobiles pendant tout l'exercice.","En gardant les coudes près du corps, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre EZ avec une prise serrée, les mains écartées à la largeur des épaules, les paumes tournées vers l'avant.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse lentement la barre vers ta poitrine, en gardant tes coudes près de ton corps.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens la barre EZ en prise supination, les mains plus écartées que la largeur des épaules.","Garde tes coudes près de ton torse et le haut de tes bras immobile tout au long du mouvement.","Enroule la barre vers tes épaules en contractant tes biceps.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit avec un haltère dans chaque main, les paumes tournées vers tes côtés.","Garde le dos droit et tes épaules en arrière.","Fais de petits pas contrôlés vers l'avant, en gardant une posture bien droite.","Continue à marcher sur la distance ou le temps souhaité.","Pour terminer, arrête de marcher et abaisse prudemment les haltères le long de tes flancs."],["Assieds-toi sur un banc, les pieds à plat sur le sol, et tiens une barre avec une prise en supination, paumes tournées vers le haut.","Pose tes avant-bras sur tes cuisses, en laissant tes poignets dépasser du bord.","Enroule lentement tes doigts vers tes paumes, en serrant fermement la barre.","Maintiens la contraction un moment, puis relâche lentement tes doigts jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence par saisir une barre verticale à deux mains, paumes face à face, et les bras complètement tendus.","Gaine ta sangle abdominale et lève tes jambes du sol, en les gardant droites.","En utilisant la force de ta sangle abdominale et du haut du corps, lève tes jambes jusqu'à ce qu'elles soient parallèles au sol.","Maintiens cette position aussi longtemps que possible, en gardant le corps bien aligné.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","En même temps, soulève tes jambes du sol en fléchissant tes genoux et en les amenant vers ta poitrine.","Marque une pause en haut, puis abaisse lentement le haut de ton corps et tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras droit au-dessus de la tête.","En gainant tes abdominaux, soulève le haut de ton corps du sol tout en levant simultanément tes jambes vers ta poitrine.","Tends tes mains vers tes orteils en soulevant le haut de ton corps et tes jambes.","Marque une pause en haut, puis abaisse lentement le haut de ton corps et tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos au sol, les genoux fléchis et les pieds à plat au sol.","Tiens une barre avec une prise en pronation, les bras étendus droit au-dessus de ta poitrine.","Abaisse lentement la barre vers les côtés, en gardant une légère flexion dans tes coudes.","Abaisse la barre jusqu'à ce que tes bras soient parallèles au sol, en ressentant un étirement dans ta poitrine.","Marque une pause, puis contracte tes muscles pectoraux pour ramener la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les mains le long du corps.","Gaine ta sangle abdominale et lève tes jambes du sol d'environ 15 centimètres.","En gardant les jambes tendues, alterne en levant une jambe légèrement plus haut que l'autre.","Continue ce mouvement de battement pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps en position accroupie.","Balance tes bras vers l'arrière pour prendre de l'élan.","Saute vers l'avant de manière explosive, en étendant tes hanches, tes genoux et tes chevilles.","Atterris en douceur sur la pointe des pieds et enchaîne immédiatement avec le saut suivant.","Répète le nombre de répétitions souhaité."],["Tiens-toi les pieds écartés à la largeur des hanches et les mains sur les hanches.","Fais un grand pas en avant avec le pied droit, en abaissant ton corps en position de fente.","Fléchis ton genou droit à environ 90 degrés en gardant ton genou aligné avec ta cheville.","Pousse sur ton pied droit et reviens à la position de départ.","Répète avec ta jambe gauche, en alternant les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre devant ton corps, les bras tendus.","En gardant le dos droit, abaisse ton corps en fléchissant les genoux et les hanches, comme si tu t'asseyais sur une chaise.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et les pieds joints.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos droit.","En abaissant ton corps, décolle tes pieds du sol et ramène tes genoux vers ta poitrine.","Maintiens cette position pendant quelques secondes, puis étends de nouveau tes jambes et repousse-toi jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction en prise pronation, les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et tire tes omoplates vers le bas et l'arrière.","Fléchis les genoux et ramène-les vers ta poitrine.","Simultanément, lève tes jambes et étends-les droit devant toi, en gardant ton corps parallèle au sol.","Maintiens cette position aussi longtemps que possible, en visant une position de front lever complète.","Pour relâcher, abaisse lentement tes jambes et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction avec une prise en pronation, les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et tire tes omoplates vers le bas et l'arrière.","En gardant le corps droit, lève tes jambes jusqu'à ce qu'elles soient parallèles au sol.","Maintiens cette position aussi longtemps que possible, en visant 10 à 20 secondes.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains directement sous les épaules et le corps aligné de la tête aux pieds.","Gaine ta sangle abdominale et tes fessiers pour maintenir une position stable.","Fais pivoter ton torse vers la droite, en levant ton bras droit et en l'étendant vers le plafond.","Garde tes hanches et tes jambes stables pendant que tu effectues la rotation.","Maintiens un moment, puis reviens à la position de départ.","Répète la torsion du côté gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules et les bras tendus droit sur les côtés.","Penche-toi lentement vers l'avant, en gardant tes bras tendus, jusqu'à ce que le haut de ton corps soit parallèle au sol.","Gaine ta sangle abdominale et maintiens cette position pendant quelques secondes.","Reviens à la position de départ en poussant sur tes pieds et en te relevant.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et les doigts pointés vers l'avant.","Gaine ta sangle abdominale et déplace lentement ton poids vers l'avant, en soulevant tes pieds du sol.","Continue à déplacer ton poids vers l'avant jusqu'à ce que ton corps soit parallèle au sol, en équilibre sur tes mains.","Maintiens cette position aussi longtemps que possible, en gardant le corps bien aligné.","Abaisse lentement tes pieds vers le sol et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains posées un peu plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et abaisse ton corps vers le sol, en gardant tes coudes près de tes flancs.","En te baissant, penche ton corps vers l'avant et décolle tes pieds du sol en t'équilibrant sur tes mains.","Continue à abaisser ton corps jusqu'à ce que ta poitrine soit juste au-dessus du sol.","Pousse à travers tes mains et étends tes bras pour ramener ton corps vers le haut jusqu'à la position de départ.","Maintiens une ligne droite de ta tête à tes talons pendant tout le mouvement.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à une barre haute, les pieds écartés à la largeur des épaules.","Lève les bras et saisis la barre en prise pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps droit.","Contracte tes grands dorsaux et tes biceps pour amener ta poitrine vers la barre, en menant avec le sternum.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Contracte tes fessiers et soulève tes hanches du sol, en formant une ligne droite de tes genoux à tes épaules.","Tout en gardant tes hanches soulevées, décolle un pied du sol et ramène ton genou vers ta poitrine.","Repose ton pied au sol et répète le mouvement avec l'autre jambe.","Continue à alterner les jambes dans un mouvement de marche tout en maintenant la position du pont.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'un banc, le dos contre celui-ci et les pieds à plat sur le sol.","Place tes mains sur le banc à côté de tes hanches pour le soutien.","Contracte tes fessiers et tes ischio-jambiers, puis soulève tes hanches du banc jusqu'à ce que ton corps forme une ligne droite de tes genoux à tes épaules.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à glute-ham raise pour l'adapter à ton corps.","Positionne-toi face contre terre sur la machine, les chevilles bien fixées.","Place tes mains sur ta poitrine ou croise-les sur ta poitrine.","Contracte tes ischio-jambiers et tes fessiers pour lever le haut du corps vers le plafond.","Continue à soulever jusqu'à ce que ton corps forme une ligne droite de ta tête à tes talons.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis une barre de traction avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et tire ton corps vers la barre, en amenant ton menton au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève tes jambes du sol, en amenant tes genoux vers ta poitrine.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un poids confortable.","Tiens-toi sur la machine à traîneau, les orteils sur la plateforme et les talons dans le vide.","Tiens-toi aux poignées pour la stabilité.","Lève tes talons aussi haut que possible en poussant sur la plante de tes pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à traîneau sur un poids approprié.","Tiens-toi sur la machine à traîneau avec un pied, en gardant l'autre pied décollé du sol.","Tiens-toi aux poignées pour la stabilité.","Lève ton talon aussi haut que possible en soulevant ton corps sur la plante de ton pied.","Marque une pause en haut, puis abaisse lentement ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité.","Change de jambe et répète l'exercice."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le poids sur tes talons.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Avance le pied droit et transfère ton poids sur la jambe droite.","En gardant le dos droit, penche-toi lentement vers l'avant au niveau des hanches, en tendant les deux mains vers ton pied droit.","Maintiens l'étirement pendant 20 à 30 secondes, puis reviens à la position de départ.","Répète de l'autre côté."],["Règle la hauteur du siège et la position du guidon à un niveau confortable.","Assieds-toi sur l'ergomètre, le dos droit et les pieds sur les pédales.","Saisis les poignées avec tes mains et place tes bras à un angle de 90 degrés.","Commence à pédaler avec les mains, en poussant et en tirant les poignées d'un mouvement contrôlé.","Continue à pédaler pendant la durée ou le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les mains jointes devant ta poitrine.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Abaisse tes mains vers tes orteils selon un mouvement circulaire, en allant aussi loin que possible sans forcer.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus sur les côtés.","Penche-toi vers l'avant au niveau de la taille en gardant ton dos droit et tes genoux légèrement fléchis.","Penche-toi avec tes mains et joins-les derrière tes jambes.","Soulève lentement tes mains vers le haut et par-dessus ta tête dans un mouvement circulaire, en gardant tes jambes tendues.","Continue le mouvement circulaire jusqu'à ce que tes mains touchent tes orteils.","Inverse le mouvement et ramène tes mains vers le bas à la position de départ.","Répète le nombre de répétitions souhaité."],["Trouve un espace dégagé avec assez de place pour effectuer un poirier.","Place tes mains au sol écartées à la largeur des épaules, les doigts pointés vers l'avant.","Lance tes jambes vers le mur, en utilisant ta sangle abdominale et tes épaules pour maintenir l'équilibre.","Une fois en position de poirier, gaine tes triceps pour soutenir le poids de ton corps.","Maintiens l'appui tendu renversé aussi longtemps que tu peux garder l'équilibre.","Pour redescendre, abaisse lentement tes jambes vers le sol.","Répète le nombre de répétitions souhaité."],["Trouve un mur et tourne-lui le dos, en te tenant à quelques pas.","Place tes mains au sol écartées à la largeur des épaules et lance tes pieds contre le mur, pour arriver en position d'équilibre sur les mains.","Plie tes coudes et abaisse ta tête vers le sol en gardant ton corps aligné.","Pousse à travers tes mains et étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes en fléchissant tes hanches et tes genoux jusqu'à ce que tes cuisses soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou aussi haut que tu peux confortablement aller.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes genoux vers ta poitrine, en faisant pivoter ton torse sur le côté en même temps.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète de l'autre côté en faisant pivoter ton torse dans la direction opposée.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes vers la barre, en les gardant droites.","Continue à soulever jusqu'à ce que ton corps forme un « V », les jambes parallèles au sol.","Maintiens la position un moment, puis abaisse lentement tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes devant toi jusqu'à ce qu'elles soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou aussi haut que tu peux confortablement aller.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les jambes tendues.","Gaine ta sangle abdominale et lève tes jambes vers ta poitrine, en les gardant droites.","Une fois tes jambes parallèles au sol, effectue une rotation des hanches d'un côté, en amenant tes jambes vers ce côté.","Marque une pause, puis reviens à la position de départ.","Répète le mouvement, mais cette fois fais pivoter tes hanches vers le côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi face à un mur, les pieds écartés à la largeur des hanches.","Place tes mains sur le mur pour te soutenir.","Gaine ta sangle abdominale et lève ton genou droit vers ta poitrine, tout en gardant ton pied gauche au sol.","Change rapidement de jambe, en amenant ton genou gauche vers le haut en direction de ta poitrine et en abaissant ton pied droit.","Continue à alterner les jambes dans un mouvement de course en montant les genoux aussi haut que possible.","Maintiens un rythme rapide et garde le haut du corps stable pendant tout l'exercice.","Répète pendant la durée souhaitée ou le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains le long de ton corps, les paumes tournées vers le bas.","Gaine ta sangle abdominale et tes fessiers, puis lève tes hanches du sol jusqu'à ce que ton corps forme une ligne droite de tes genoux à tes épaules.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps en position accroupie.","En descendant en squat, amène tes genoux vers ta poitrine et enlace-les avec tes bras.","Maintiens cette position un instant, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc avec un haltère dans chaque main, les paumes se faisant face.","Étends les bras droit au-dessus de la poitrine, avec une légère flexion dans les coudes.","En gardant une légère flexion des coudes, abaisse les haltères sur les côtés en un large arc jusqu'à ressentir un étirement dans la poitrine.","Marque une pause, puis inverse le mouvement et ramène les haltères à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le banc à lombaires de sorte que le haut de tes cuisses repose sur le coussin et que tes pieds soient bien fixés.","Croise tes bras sur ta poitrine ou place tes mains derrière ta tête.","Abaisse le haut de ton corps vers le sol tout en gardant le dos droit.","Marque une pause en bas, puis relève le haut de ton corps jusqu'à ce qu'il soit aligné avec tes jambes.","Répète le nombre de répétitions souhaité."],["Règle le banc à lombaires de sorte que tes hanches reposent confortablement sur le coussin et que tes pieds soient bien fixés.","Croise tes bras sur ta poitrine ou place tes mains derrière ta tête.","Abaisse lentement le haut de ton corps vers le sol tout en gardant le dos droit.","Marque une pause en bas, puis relève le haut de ton corps jusqu'à ce qu'il soit aligné avec tes jambes.","Répète le nombre de répétitions souhaité."],["Positionne-toi entre deux barres parallèles, les bras complètement tendus et le corps suspendu dans les airs.","Fléchis tes genoux et croise tes chevilles.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Commence en position debout, les pieds écartés à la largeur des hanches.","Penche-toi vers l'avant au niveau de la taille et place tes mains sur le sol devant toi.","Avance les mains jusqu'à te retrouver en position de planche haute, le corps aligné de la tête aux pieds.","Marque une pause, puis fais marcher tes mains vers tes pieds, en gardant tes jambes aussi tendues que possible.","Une fois tes mains au niveau de tes pieds, redresse-toi jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position debout, les pieds écartés à la largeur des hanches.","Penche-toi vers l'avant au niveau de la taille et place tes mains sur le sol devant toi.","Avance les mains jusqu'à te retrouver en position de planche haute, le corps aligné de la tête aux pieds.","En gardant les jambes tendues, marche avec tes pieds vers tes mains, en amenant tes hanches vers le plafond.","Continue à avancer tes mains, en répétant le mouvement pour le nombre de répétitions souhaité."],["Place tes mains sur une surface surélevée, comme un banc ou une marche, légèrement plus écartées que la largeur des épaules.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, ton corps formant une ligne droite de la tête aux talons.","Abaisse ta poitrine vers la surface surélevée en fléchissant les coudes, en les gardant près de tes flancs.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc incliné, le dos à plat contre le banc et les jambes tendues droit devant toi.","Place tes mains sur les côtés du banc pour te soutenir.","En gainant tes abdominaux, soulève tes jambes du banc, en les levant aussi haut que possible tout en les gardant tendues.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Trouve une surface surélevée, comme un banc ou une marche, et place tes mains écartées à la largeur des épaules sur le bord.","Recule les pieds, en gardant le corps aligné de la tête aux talons.","Abaisse ta poitrine vers le bord de la surface, en fléchissant les coudes et en gardant ton corps aligné.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Saute du bord de la surface, en atterrissant en douceur, les genoux légèrement fléchis.","Répète la pompe et le saut en profondeur pour le nombre de répétitions souhaité."],["Place tes mains sur une surface surélevée, comme un banc ou une marche, légèrement plus écartées que la largeur des épaules.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, en formant une ligne droite de ta tête à tes talons.","Abaisse ta poitrine vers la surface surélevée en fléchissant les coudes, en gardant ton corps aligné.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Place tes mains sur le bord d'une caisse ou d'une surface surélevée, légèrement plus écartées que la largeur des épaules.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, en formant une ligne droite de ta tête à tes talons.","Abaisse ta poitrine vers la box en fléchissant les coudes, en gardant ton corps aligné.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Place tes mains sur le bord d'un banc ou d'une surface surélevée, légèrement plus écartées que la largeur des épaules.","Étends tes jambes derrière toi, en appui sur la pointe des pieds, en formant une ligne droite de ta tête à tes talons.","Abaisse ta poitrine vers le banc en fléchissant les coudes, en les gardant près de tes flancs.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Place tes mains sur le banc légèrement plus écartées que la largeur des épaules.","Positionne tes pieds au sol, écartés à la largeur des hanches.","Abaisse ta poitrine vers le banc, en gardant les coudes rentrés.","En descendant, rétracte tes omoplates en resserrant tes scapulas.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Allonge-toi sur le banc, les pieds bloqués sous les cale-pieds.","Place tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps du banc, en t'enroulant vers l'avant.","En te redressant en curl, fais pivoter ton torse d'un côté en amenant ton coude vers le genou opposé.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le mouvement, cette fois en faisant pivoter ton torse vers l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout bien droit, les pieds écartés à la largeur des épaules.","Tiens-toi à un objet stable pour te soutenir.","Fléchis ton genou droit et amène ton pied droit vers tes fessiers en saisissant la corde avec ta main droite.","Tire lentement ton pied droit vers tes fessiers, en ressentant un étirement dans ton quadriceps droit.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche l'étiremen
