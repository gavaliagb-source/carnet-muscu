<style>
:root{color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--card2:#20242b;--line:#2c313a;
  --text:#eef0f3;--muted:#8d95a3;--accent:#c6f135;--accent-ink:#141a00;
  --danger:#ff6b6b;--ok:#4ade80;--ss:#7dd3fc;--warm:#ffc857;--drop:#c4a4ff;--radius:14px;
  --done-bg:#14251b;--has-bg:#1f2a0c;--has-line:#4a5a1d;--w-bg:#3a2e12;--w-line:#6b5420;--d-bg:#2a1f3d;--d-line:#4b3a78;
}
[data-theme="oled"]{--bg:#000;--card:#0c0c0c;--card2:#171717;--line:#262626}
[data-theme="clair"]{color-scheme:light;--bg:#f3f4f6;--card:#fff;--card2:#eceff3;--line:#d9dde3;--text:#14181f;--muted:#5f6b7a;
  --accent:#1f9d55;--accent-ink:#fff;--danger:#d92d3a;--ok:#16a34a;--ss:#0284c7;--warm:#b45309;--drop:#7c3aed;
  --done-bg:#e3f6ea;--has-bg:#e3f4e9;--has-line:#8fcca6;--w-bg:#fdf0d5;--w-line:#e6c27a;--d-bg:#efe7fd;--d-line:#c4a8f2}
[data-theme="bleu"]{--bg:#0b1220;--card:#121b2e;--card2:#1a2540;--line:#26324d;--muted:#8a98b3;--accent:#4cc9f0;--accent-ink:#00212b;
  --ss:#c4b5fd;--has-bg:#0f2733;--has-line:#245a73}
[data-theme="rouge"]{--bg:#140f10;--card:#1e1517;--card2:#2a1d20;--line:#3b2a2e;--muted:#a3908f;--accent:#ff5a5f;--accent-ink:#2b0204;
  --danger:#ff9f43;--has-bg:#331618;--has-line:#6b2a2d}
[data-theme="violet"]{--bg:#100f16;--card:#181624;--card2:#211e33;--line:#302c47;--muted:#958fae;--accent:#b388ff;--accent-ink:#1a0638;
  --has-bg:#261f3d;--has-line:#4f3f82}
[data-theme="hevy"]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--muted:#98989f;--accent:#1e88ff;--accent-ink:#fff;--has-bg:#0d2540;--has-line:#1e5aa8}
[data-theme="rose"]{--bg:#130f12;--card:#1d171b;--card2:#291f26;--line:#3b2c36;--muted:#a3929d;--accent:#ff6fae;--accent-ink:#2b0516;--has-bg:#33172a;--has-line:#7a2d55}
[data-theme="menthe"]{--bg:#0c1312;--card:#131d1b;--card2:#1b2826;--line:#283a37;--muted:#8ea39f;--accent:#3ee6b0;--accent-ink:#002a1c;--has-bg:#0f2e25;--has-line:#1f6b53}
[data-theme="or"]{--bg:#12110d;--card:#1c1a14;--card2:#27241b;--line:#3a3628;--muted:#a39c86;--accent:#f5c542;--accent-ink:#2b2000;--has-bg:#33290c;--has-line:#7a6116}
[data-theme="foret"]{--bg:#0e120d;--card:#161c14;--card2:#1f281c;--line:#2e3b2a;--muted:#93a18e;--accent:#7bc96f;--accent-ink:#0b2306;--has-bg:#1b2e17;--has-line:#3f6b37}
[data-theme="orange"]{--bg:#121010;--card:#1c1816;--card2:#272220;--line:#3a332f;--muted:#a39890;--accent:#ff9f1c;--accent-ink:#2b1700;
  --has-bg:#33200a;--has-line:#7a4a0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
/* iPhone (appli installée) : quand la page est plus courte que l'écran, iOS calcule le bas de l'écran trop haut
   (il oublie la zone de l'heure en haut) et la barre du bas « flotte ». On rend la page toujours au moins aussi haute que l'écran. */
html.ios{height:100%}html.ios body{min-height:calc(100% + env(safe-area-inset-top));box-sizing:border-box}
:root{--nb:max(4px, calc(env(safe-area-inset-bottom) - 18px))}
body{padding-bottom:calc(76px + var(--nb))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0;letter-spacing:-.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px 16px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--nb)}
/* iPhone : le fond de la barre descend jusqu'en bas de l'écran, même sous la barre d'accueil */
nav::after{content:'';position:absolute;left:0;right:0;top:100%;height:120px;background:var(--card)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.ss{border-left:4px solid var(--ss)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exlist{margin:8px 0 12px;padding:0;list-style:none}
.exlist li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.exlist li:last-child{border-bottom:0}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.exlink{border-bottom:1px dotted var(--muted);cursor:pointer}
textarea,input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;padding:0;margin:4px 0;border:0;background:transparent;box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px}
textarea.short{min-height:80px;font-family:inherit;font-size:16px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.setrow input{text-align:center;padding:10px 4px}
.setrow.done input{border-color:var(--ok);background:var(--done-bg)}
.nb{position:relative;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--muted);font-weight:700;font-size:15px}
.nb.t-F{color:#ff9f43;background:color-mix(in srgb,#ff9f43 12%,var(--card2));border-color:color-mix(in srgb,#ff9f43 45%,transparent)}
.nb.t-F::before{content:'F';position:absolute;bottom:2px;right:5px;font-size:9px;font-weight:800;opacity:.85}
.nb.t-W{background:var(--w-bg);color:var(--warm);border-color:var(--w-line)}
.nb.t-D{background:var(--d-bg);color:var(--drop);border-color:var(--d-line)}
.nb.hasn::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.check{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:20px}
.done .check{background:var(--ok);color:#06210f;border-color:var(--ok)}
.colhead{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.pr{color:var(--accent);font-weight:700}
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + var(--nb));z-index:6;
  background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;
  display:none;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px #0008}

#wobar{position:fixed;left:12px;right:12px;bottom:calc(76px + var(--nb));z-index:6;display:none;align-items:center;gap:10px;
  background:var(--card2);border:1px solid var(--accent);border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px #0007;cursor:pointer}
#wobar.show{display:flex}#wobar .wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#wobar .wt{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
body.wob #timer{bottom:calc(140px + var(--nb))}body.wob main{padding-bottom:150px}
.wprog{position:sticky;top:var(--hdrh,58px);z-index:3;background:var(--bg);margin:-6px -2px 10px;padding:6px 2px 8px}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}.pbar>div{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}.check.pop{animation:pop .3s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes nvF{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes nvB{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}#app.enter>*{animation:enter .25s ease both}#app.enter.nv-fwd>*{animation:nvF .28s cubic-bezier(.2,.8,.2,1) both}#app.enter.nv-back>*{animation:nvB .28s cubic-bezier(.2,.8,.2,1) both}@media (prefers-reduced-motion: reduce){#app.enter>*{animation:none!important}}#app.enter>*:nth-child(2){animation-delay:.03s}#app.enter>*:nth-child(3){animation-delay:.06s}#app.enter>*:nth-child(4){animation-delay:.09s}#app.enter>*:nth-child(n+5){animation-delay:.12s}
@media (prefers-reduced-motion: reduce){.check.pop,#app.enter>*{animation:none}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#timer.show{display:flex}#timer.fin{background:var(--ok);color:#06210f}
#timer .t{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:#0002;border:0;color:inherit;border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
#toast .btn{padding:4px 10px}#toast{display:flex;align-items:center;justify-content:center;gap:4px;
  position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(calc(-100% - 40px - env(safe-area-inset-top)));opacity:0;visibility:hidden;
  background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;
  transition:transform .25s,opacity .25s,visibility 0s .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;visibility:visible;transition:transform .25s,opacity .25s}
.modal{position:fixed;inset:0;background:#000a;z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.preview{background:var(--card);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.preview b{color:var(--accent)}
canvas{width:100%;height:210px;display:block}
.stat{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.gap{height:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.main{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
button.chip{cursor:pointer}
.exoimg{position:relative;width:min(100%,340px);aspect-ratio:1/1;background:#fff;border-radius:14px;overflow:hidden;margin:10px auto}
.exoimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.exoimg .fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#555;padding:20px;font-size:14px}
.pkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;margin-bottom:6px}
.pkrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pkh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--card);color:var(--text);
  font-size:14px;position:relative;padding:0}
.cal button.blank{visibility:hidden}
.cal button.has{border-color:var(--has-line);background:var(--has-bg)}
.cal button.has::after{content:'';position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cal button.today{border-color:var(--muted)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal button.sel::after{background:var(--accent-ink)}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar .track{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ie{display:inline-flex;vertical-align:-.18em;line-height:1}.ie .ico{flex:none}
.mythm{display:flex;gap:0;align-items:stretch}.mythm .btn:first-child{flex:1;min-width:0;text-align:left;border-radius:10px 0 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mythm .btn+.btn{border-radius:0 10px 10px 0;border-left:0;padding:0 10px}
.sw2{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:6px;vertical-align:-3px;border:1px solid #fff4}
.sug{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card2);border:1px dashed var(--accent);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid #fff4}
.seg button{font-size:13px}
#back{background:none;border:0;color:var(--text);font-size:24px;padding:0 8px 0 0;line-height:1;cursor:pointer}
#hdr{display:flex;align-items:center;gap:8px}
.hbtn{background:none;border:0;color:var(--text);font-size:22px;padding:2px 4px;cursor:pointer}
.th{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:var(--s);height:var(--s);border-radius:50%;background:#fff;overflow:hidden;border:1px solid var(--line)}
.th::before{content:'🏋️';font-size:calc(var(--s) * .42)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn.big{padding:16px;font-size:16px;text-align:left}
.btn.ghost{background:none;border-color:transparent}
.rcard{cursor:pointer}
.fhead{padding:8px 0;cursor:pointer;user-select:none}
.fempty{display:flex;border:1.5px dashed var(--muted);border-radius:14px;margin:2px 0 14px;overflow:hidden}
.fempty button{flex:1;background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;padding:20px 8px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-width:0}
.fempty button+button{border-left:1.5px dashed var(--muted)}
.fempty button:active{background:var(--card)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;padding:4px 0;cursor:pointer}
.exlink.acc{color:var(--accent);border-bottom:0;font-weight:700;font-size:16px}
.rex{padding:14px 0;border-bottom:1px solid var(--line)}
.rex.ssl{border-left:3px solid var(--ss);padding-left:10px}
.stbl{width:100%;border-collapse:collapse;font-size:15px}
.stbl th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;letter-spacing:.4px}
.stbl td{padding:9px 10px}
.stbl tbody tr:nth-child(odd){background:var(--card2)}
.stbl td:first-child,.stbl th:first-child{width:64px}
.tinput{font-size:20px;font-weight:700;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.ninput{margin-top:8px;font-size:14px;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 0}
.setrow.c3,.colhead.c3{grid-template-columns:40px 1fr 1fr 44px}
.menu .btn{margin-bottom:8px;text-align:left}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:0 0 auto}
.tile{padding:16px 12px;text-align:left;font-size:15px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;cursor:pointer}
.mic{font-size:22px;width:30px;text-align:center}
.gifbig{width:min(70vw,240px);aspect-ratio:1/1;border-radius:14px;background:#fff;object-fit:contain}
.calhead{gap:8px}
.calhead>div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:14px}
.wd7{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:3;background:var(--bg);margin:0;padding:6px 0}
.mtitle{margin:26px 0 12px;text-transform:capitalize;font-size:22px;font-weight:800;letter-spacing:-.3px;scroll-margin-top:calc(150px + env(safe-area-inset-top))}
.cal2{gap:0 !important}
.calsticky{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:3;background:var(--bg);margin:-16px -16px 0}
.calbar{display:flex;border-bottom:1px solid var(--line)}.calbar>div{flex:1;text-align:center;padding:12px 6px;font-size:14px;min-width:0}.calbar>div+div{border-left:1px solid var(--line)}
.calwd{display:grid;grid-template-columns:repeat(7,1fr);padding:9px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}

    let sc = 0, ok = true;
    for (const a of alts) {

    if (!ok) continue;
    sc -= 0.08 * L.nameWords.length;
    if (POP.has(L.id)) sc += 0.6;
    if (L.key === nq) sc += 3;
    out.push([sc, L]);

async function copy(t) {

}

}

/* Charge « ? » : on reprend la meilleure charge de travail de ta dernière séance sur cet exercice */

  const l = lastFull(e.name); if (!l) return e;
  const ws = work(l).filter(s => s.u !== 's' && +s.w > 0); if (!ws.length) return e;
  return {...e, weight: Math.max(...ws.map(s => +s.w)), nw: false};
}
function applyPaste(rid) {

      x.exercises.forEach(ne => { const old = t.exercises.find(o => norm(o.name) === norm(ne.name)); if (old && ne.nw && (ne.weight === '' || ne.weight == null) && old.weight !== '' && old.weight != null) { ne.weight = old.weight; ne.nw = false; } if (old && old.rest && !ne.rest) ne.rest = old.rest; if (old && old.sl && +old.sets === +ne.sets && String(old.reps) === String(ne.reps) && String(old.weight ?? '') === String(ne.weight ?? '')) ne.sl = old.sl; });
      t.name = x.name; t.exercises = x.exercises;

}

function altExercises(name, n = 3) {

    sc += 3 * L.p.filter(m => L0.p.includes(m)).length / Math.max(L.p.length, L0.p.length); if (/pov|side view/i.test(L.name)) sc -= 2; const s0 = L0.s || [], s1 = L.s || []; if (s0.length || s1.length) sc += 3 * s1.filter(m => s0.includes(m)).length / Math.max(s0.length, s1.length, 1);

let recSort = 'recent';

function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - wOff(x)); return x; }

const MEAS = [['waist', 'Taille'], ['chest', 'Poitrine'], ['shoulders', 'Épaules'], ['arm', 'Bras'], ['thigh', 'Cuisse'], ['calf', 'Mollet'], ['hips', 'Hanches']];
const NUTRI = [['kcal', 'Calories', 'kcal'], ['prot', 'Protéines', 'g'], ['steps', 'Pas', 'pas']];
function bodySeries(metric) {
  return S.body.slice().sort((a, b) => a.d.localeCompare(b.d)).map(e => ({d: e.d, v: metric === 'w' ? e.w : NUTRI.some(n => n[0] === metric) ? (e.n || {})[metric] : (e.m || {})[metric]})).filter(p => p.v != null && p.v !== '' && !isNaN(p.v));
}
function vBody() {
  const ws = bodySeries('w');
  let stats = '';
  if (ws.length) {
    const lastE = ws[ws.length - 1], lastT = new Date(lastE.d + 'T12:00').getTime();
    const wk = ws.filter(p => lastT - new Date(p.d + 'T12:00').getTime() <= 6 * 864e5);
    const avg = wk.reduce((s, p) => s + +p.v, 0) / wk.length;
    const prev = ws.length > 1 ? ws[ws.length - 2] : null;
    const delta = prev ? +lastE.v - +prev.v : null;
    stats = `<div class="row" style="margin-bottom:12px">
      <div class="stat"><span class="muted small">Dernier poids</span><b>${lastE.v} ${U()}</b></div>

      <div class="stat"><span class="muted small">Vs précédent</span><b>${delta == null ? '—' : (delta > 0 ? '+' : '') + (Math.round(delta * 10) / 10).toString().replace('.', ',')}</b></div></div>`;
  }
  const opts = [['w', 'Poids (' + U() + ')'], ...MEAS.map(([k, l]) => [k, l + ' (' + MU() + ')']), ...NUTRI.map(([k, l, u]) => [k, l + ' (' + u + ')'])];
  const pts = bodySeries(bodyMetric);
  const today = dkey(new Date());
  const lastEntry = S.body.slice().sort((a, b) => a.d.localeCompare(b.d)).pop();
  const nut = NUTRI.map(([k, l, u]) => { const pts = bodySeries(k).filter(x => Date.now() - new Date(x.d + 'T12:00') <= 7 * 864e5); return pts.length ? `<div class="stat"><span class="muted small">${l} · 7 j</span><b>${Math.round(pts.reduce((a, x) => a + +x.v, 0) / pts.length).toLocaleString(LOC())}</b><span class="muted small">${u}/jour</span></div>` : ''; }).join('');
  return photosCard() + stats + (nut ? `<div class="row" style="margin-bottom:12px;align-items:stretch">${nut}</div>` : '') + `

    <div class="card" style="margin-top:12px">${pts.length ? `<canvas id="chart"></canvas>${NUTRI.some(x => x[0] === bodyMetric) ? '' : predictHtml(pts.map(p => ({d: p.d + 'T12:00', v: +p.v})), bodyMetric === 'w' ? 'body' : 'cm')}` : '<div class="empty">Aucune donnée pour cette mesure.</div>'}</div>

      <label>Poids (${U()})</label><input id="bw" inputmode="decimal" placeholder="${lastEntry && lastEntry.w != null ? esc(lastEntry.w) : ''}">
      <p class="muted small" style="margin:10px 0 0">Mensurations (${MU()}), facultatif :</p>
      <div class="grid2">${MEAS.map(([k, l]) => `<div><label>${l}</label><input id="bm_${k}" inputmode="decimal" placeholder="${lastEntry && lastEntry.m && lastEntry.m[k] != null ? esc(lastEntry.m[k]) : ''}"></div>`).join('')}</div>
      <p class="muted small" style="margin:12px 0 0">Nutrition et activité du jour, facultatif :</p>
      <div class="grid2">${NUTRI.map(([k, l, u]) => `<div><label>${l} (${u})</label><input id="bn_${k}" inputmode="numeric"></div>`).join('')}</div>
      <div class="gap"></div><button class="btn primary block" data-act="body-save">Enregistrer</button>
    </div>
    ${S.body.length ? `<div class="card"><h3>Historique</h3><ul class="exlist">${S.body.slice().sort((a, b) => b.d.localeCompare(a.d)).slice(0, 30).map(e => `<li><span>${new Date(e.d + 'T12:00').toLocaleDateString(LOC(), {day: 'numeric', month: 'short', year: 'numeric'})}</span><span class="row"><span class="tag" style="white-space:normal;text-align:right">${[e.w != null ? e.w + ' ' + U() : '', ...MEAS.filter(([k]) => e.m && e.m[k] != null).map(([k, l]) => `${l.toLowerCase()} ${e.m[k]}`), ...NUTRI.filter(([k]) => e.n && e.n[k] != null).map(([k, l, u]) => `${Math.round(e.n[k]).toLocaleString(LOC())} ${u}`)].filter(Boolean).join(' · ')}</span><button class="btn danger sm" data-act="body-del" data-id="${e.id}">✕</button></span></li>`).join('')}</ul></div>` : ''}`;
}
function saveBody() {
  const d = $('#bd').value || dkey(new Date());
  const num = id => { const v = ($('#' + id).value || '').replace(',', '.').trim(); return v !== '' && !isNaN(v) ? +v : null; };
  const w = num('bw'), m = {}, nn = {};
  MEAS.forEach(([k]) => { const v = num('bm_' + k); if (v != null) m[k] = v; });
  NUTRI.forEach(([k]) => { const v = num('bn_' + k); if (v != null) nn[k] = v; });
  if (w == null && !Object.keys(m).length && !Object.keys(nn).length) { toast('Entre au moins une valeur'); return; }
  let e = S.body.find(x => x.d === d);
  if (!e) { e = {id: uid(), d, w: null, m: {}}; S.body.push(e); }
  if (w != null) e.w = w;
  e.m = Object.assign(e.m || {}, m);
  if (Object.keys(nn).length) e.n = Object.assign(e.n || {}, nn);
  save(); render(); toast('✅ Mesure enregistrée');
}

  });

function parseCsv(txt) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}

  if (m) { const mo = monthIdx(m[2]); if (mo >= 0) return new Date(+m[3], mo, +m[1], hm12(m[4], m[6]), +m[5]); }
  m = s.match(/([A-Za-zÀ-ÿ.]+)\s+(\d{1,2}),?\s+(\d{4}),?\s+(?:à\s+|at\s+)?(\d{1,2}):(\d{2})\s*([ap]\.?\s?m\.?)?/i);
  if (m) { const mo = monthIdx(m[1]); if (mo >= 0) return new Date(+m[3], mo, +m[2], hm12(m[4], m[6]), +m[5]); }

function drawChart(pts, proj = []) {

  }

  if (pts.length > 1) { g.textAlign = 'right'; g.fillText(dateFr(pts[pts.length - 1].d), W - pad.r, H - 6); }
  // courbe lissée + dégradé dessous + records en or, dessinée de gauche à droite

    g.putImageData(snap, 0, 0); g.save(); g.beginPath(); g.rect(0, 0, pad.l + (W - pad.l) * k + 2, H); g.clip();

    if (PP.length > n0) { const [ax, ay] = PP[n0 - 1], [bx, by] = PP[n0]; g.setLineDash([5, 5]); g.strokeStyle = accent; g.globalAlpha = .7; g.lineWidth = 2; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;

function tone(freq, at, dur, vol, wave) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave || 'sine'; o.frequency.value = freq; vol = Math.max(0.0002, vol);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + dur + 0.02);
}
function beep(final) {
  if (S.settings.sound === false || !actx) return;
  try {
    const t = actx.currentTime;
    playSnd(!!final, t, false);
  } catch (e) {}
}
async function syncWake() {
  const want = !!S.active && S.settings.wake === true && !document.hidden;
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener('visibilitychange', syncWake);

let rtMetric = 'vol';
const routineSessions = r => S.history.filter(h => h.routineId === r.id || norm(h.routineName) === norm(r.name));
const BW_RE = /traction|\bdips?\b|pull.?up|chin.?up|pompe|push.?up|muscle.?up|inverted row|rowing invers/i;
const bwMemo = new Map();
function isBWEx(name) { const k = norm(name); if (!bwMemo.has(k)) { const L = libEntry(name); bwMemo.set(k, (L && ['body weight', 'weighted'].includes(L.eq)) || BW_RE.test(name)); } return bwMemo.get(k); }
function bwAt(iso) { if (S.settings.bwVol === false || !S.body.length) return 0; const d = String(iso).slice(0, 10); let v = 0; for (const b of S.body.slice().sort((a, c) => a.d.localeCompare(c.d))) { if (b.d <= d && +b.w > 0) v = +b.w; } return v || (+S.body.filter(b => +b.w > 0).sort((a, c) => a.d.localeCompare(c.d))[0]?.w || 0); }
const sessVol = h => { let bw = null; return h.exercises.reduce((t, e) => { const add = isBWEx(e.name) ? (bw ?? (bw = bwAt(h.date))) : 0; return t + work(e.sets).reduce((a, s) => a + (s.u === 's' ? 0 : ((+s.w || 0) + add) * (+s.r || 0)), 0); }, 0); };
const sessReps = h => h.exercises.reduce((t, e) => t + work(e.sets).reduce((a, s) => a + (s.u === 's' || s.u === 'c' ? 0 : (+s.r || 0)), 0), 0);
function routinePoints(r) {
  return routineSessions(r).map(h => ({d: h.date, v: rtMetric === 'vol' ? sessVol(h) : rtMetric === 'reps' ? sessReps(h) : (+h.duration || 0)}));
}

}

const bestVal = e => { const ws = work(e.sets).filter(s => s.u !== 's'); if (!ws.length) return 0; const v = Math.max(...ws.map(s => e1rm(s.w, s.r))); return v > 0 ? v : Math.max(...ws.map(s => +s.r || 0)) / 1000; };

const STAG_N = 4, STAG_DAYS = 21, STAG_WIN = 70, STAG_RECENT = 21;

  const ws = work(e.sets).filter(s => s.u !== 's'); if (!ws.length) return null;
  const top = Math.max(...ws.map(s => +s.w || 0));

function stagnation(name) {

  const ign = (S.settings.stagIgn || {})[norm(name)]; if (ign && Date.now() < ign) return null;
  const now = Date.now();
  const ss = exSessions(name).slice().sort((a, b) => a.h.date.localeCompare(b.h.date)).filter(x => now - new Date(x.h.date) <= STAG_WIN * 864e5);
  if (ss.length < STAG_N + 1 || ss.some(x => x.e.sets.some(s => s.u === 's'))) return null;
  if (now - new Date(ss[ss.length - 1].h.date) > STAG_RECENT * 864e5) return null;
  let best = null, bestReps = {}, lastProg = 0;
  ss.forEach((x, i) => {
    const m = sesMet(x.e); if (!m) return;
    if (!best) { best = m; bestReps[m.top] = m.reps; lastProg = i; return; }
    const bw = m.top === 0 && best.top === 0;
    const prog = bw ? m.maxR > best.maxR || m.reps > (bestReps[0] || 0)
      : m.e > best.e * 1.01 || m.top > best.top || m.reps > (bestReps[m.top] ?? Infinity);
    if (prog) lastProg = i;
    if (m.e > best.e || m.top > best.top || (bw && m.maxR > best.maxR)) best = {...best, e: Math.max(best.e, m.e), top: Math.max(best.top, m.top), maxR: Math.max(best.maxR, m.maxR)};

}

/* ----- Record en direct ----- */
function livePR(ei, si) {
  const e = S.active.exercises[ei], s = e.sets[si];
  if (isW(s) || isTimed(e)) return false;
  const w = +s.w || 0, r = +s.r || 0; if (!r) return false;
  const hs = S.history.flatMap(h => h.exercises.filter(x => norm(x.name) === norm(e.name)).flatMap(x => work(x.sets))).filter(x => x.u !== 's');
  if (!hs.length) return false;
  const others = e.sets.filter((x, j) => j !== si && x.done && !isW(x));
  const all = hs.concat(others);
  if (w > 0) { const v = e1rm(w, r), b = Math.max(0, ...all.map(x => e1rm(x.w, x.r))); return b > 0 && v > b + 1e-9; }
  const bw = all.filter(x => !(+x.w > 0)); return bw.length > 0 && r > Math.max(...bw.map(x => +x.r || 0));
}

/* ----- Tableau des maximums ----- */
function maxTable(rec) {

  const rows = [1, 2, 3, 5, 6, 8, 10, 12, 15].map(r => { const w = r === 1 ? one : one / (1 + r / 30); return `<tr><td>${r}</td><td><b>${rnd(w)} ${U()}</b></td><td class="muted">${Math.round(w / one * 100)} %</td></tr>`; }).join('');

/* ----- Récupération musculaire ----- */
function recovery() {
  const now = Date.now(), f = {}, last = {};
  S.history.forEach(h => {
    const hrs = (now - new Date(h.date)) / 36e5 - (+h.duration || 0) / 60; if (hrs > 96 || hrs < -1) return;
    h.exercises.forEach(e => {
      const n = work(e.sets).length, L = libEntry(e.name); if (!n || !L) return;
      const add = (m, k) => { const rt = ['pectorals', 'lats', 'upper back', 'quads', 'hamstrings', 'glutes', 'spine'].includes(m) ? 72 : 48;
        f[m] = (f[m] || 0) + Math.min(1, n * k / 6) * Math.max(0, 1 - Math.max(0, hrs) / rt); if (!last[m] || hrs < last[m]) last[m] = Math.max(0, hrs); };
      L.p.forEach(m => add(m, 1)); L.s.forEach(m => add(m, 0.5));
    });
  });
  Object.keys(f).forEach(m => f[m] = Math.min(1, f[m]));
  return {f, last};
}

    if (t === 'c') return `<circle cx="${g[0] + dx}" cy="${g[1]}" r="${g[2]}" style="${st}"/>`;
    if (t === 'e') return `<ellipse cx="${g[0] + dx}" cy="${g[1]}" rx="${g[2]}" ry="${g[3]}" style="${st}"/>`;

    return `<polygon points="${g[0].split(' ').map(q => { const [x, y] = q.split(',').map(Number); return (x + dx) + ',' + y; }).join(' ')}" style="${st}"/>`;
  }).join('');
}

/* ----- Records d'une séance ----- */
function sessPRs(h) {
  const prs = [];
  h.exercises.forEach(e => {
    const ws = work(e.sets).filter(s => s.u !== 's'); if (!ws.length) return;
    const prev = S.history.filter(x => x.date < h.date).flatMap(x => x.exercises.filter(y => norm(y.name) === norm(e.name)).flatMap(y => work(y.sets))).filter(s => s.u !== 's');
    if (!prev.length) return;
    const v = Math.max(...ws.map(s => e1rm(s.w, s.r))), pv = Math.max(...prev.map(s => e1rm(s.w, s.r)));
    if (v > 0 && pv > 0 && v > pv) { const b = ws.reduce((m, s) => e1rm(s.w, s.r) > e1rm(m.w, m.r) ? s : m); prs.push({name: e.name, set: `${b.w}×${b.r}`}); }
  });
  return prs;
}

  if (d.k === 'r' || d.k === 'f') list = d.items.map(r => `<div class="preview"><b>${esc(r.name)}</b><br><span class="small muted">${r.exercises.map(e => `${esc(e.name)} — ${e.sets}×${esc(e.reps)}`).join('<br>')}</span></div>`).join('');
  else if (d.k === 't') list = d.items.map(t => `<div class="preview"><b>⏱ ${esc(tmN(t))}</b> · ${mmss(tmTotal(t))}</div>`).join('');
  else if (d.k === 's') list = d.items.map(rt => `<div class="preview"><b>🧘 ${esc(T(rt.n[0], rt.n[1] || rt.n[0]))}</b><br><span class="small muted">${rt.items.map(it => esc(stName(it))).join(', ')}</span></div>`).join('');
  const defF = d.f || T(`Partagé par ${d.from || 'un ami'}`, `Shared by ${d.from || 'a friend'}`);
  modal(`<h2>📩 ${T(`${from} te partage :`, `${from} shared with you:`)}</h2>${list}
    ${d.k === 'r' || d.k === 'f' ? `<label>${T('Ajouter dans le dossier', 'Add to folder')}</label><input id="impf" value="${esc(defF)}">` : ''}
    <button class="btn primary block" data-act="imp-ok" style="margin-top:10px">⬇ ${T('Ajouter dans mon appli', 'Add to my app')}</button>
    <button class="btn block" data-act="close" style="margin-top:8px">${T('Non merci', 'No thanks')}</button>`);
}
function openPasteCode(kind) {
  modal(`<div class="row between"><h2>📥 ${T('Coller un partage', 'Paste a share')}</h2><button class="btn sm" data-act="close">✕</button></div>
    <p class="muted small">${T('Colle le message reçu de ton ami au complet (avec la ligne CARNET:).', 'Paste the whole message from your friend (with the CARNET: line).')}</p>
    <textarea id="pcode" class="short" style="min-height:140px"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="pcode-clip">📋 ${T('Coller', 'Paste')}</button><button class="btn primary" style="flex:1" data-act="pcode-ok" data-k="${kind}">${T('Ajouter', 'Add')}</button></div>`);
}
async function pasteCodeOk() {
  const m = (($('#pcode') || {}).value || '').match(/CARNET:\s*([A-Za-z0-9_-]+)/);
  if (!m) { toast(T('⚠️ Code introuvable : colle le message au complet', '⚠️ Code not found: paste the whole message')); return; }
  try { const d = await unpackShare(m[1]); closeModal(); showImport(d); } catch (e) { toast(T('⚠️ Code incomplet ou abîmé', '⚠️ Incomplete or damaged code')); }
}
async function checkImport() {
  const m = location.hash.match(/#imp=([A-Za-z0-9_-]+)/); if (!m) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  let d; try { d = await unpackShare(m[1]); } catch (e) { toast(T('⚠️ Lien de partage invalide ou incomplet', '⚠️ Invalid or incomplete share link')); return; }
  if (!d || !Array.isArray(d.items) || !d.items.length) return;
  showImport(d);
}
function doImport() {
  const d = window._imp; if (!d) return; let msg = '';
  if (d.k === 'r' || d.k === 'f') {
    const f = (($('#impf') || {}).value || '').trim() || DEF_FOLDER;
    if (!S.folders.includes(f)) S.folders.push(f);
    d.items.forEach(r => S.routines.push({id: uid(), name: r.name, folder: f, exercises: r.exercises}));
    msg = T(`✅ ${d.items.length} routine${d.items.length > 1 ? 's' : ''} ajoutée${d.items.length > 1 ? 's' : ''} dans « ${f} »`, `✅ ${d.items.length} routine${d.items.length > 1 ? 's' : ''} added to “${f}”`);
    setRoot('train');
  } else if (d.k === 't') { S.timers = S.timers || []; d.items.forEach(t => S.timers.unshift({...t, id: 'tm' + uid()})); msg = T('✅ Minuteur ajouté', '✅ Timer added'); setRoot('timers'); }
  else if (d.k === 's') { S.stretches = S.stretches || []; d.items.forEach(rt => S.stretches.push({...rt, id: 's' + uid()})); msg = T('✅ Routine d\'étirement ajoutée', '✅ Stretching routine added'); setRoot('stretch'); }
  window._imp = null; save(); closeAll(); render(); toast(msg);
}

const verCmp = (a, b) => { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; };
function openNews(all) {
  const seen = S.settings.seenVer, list = all || !seen ? CHANGELOG : CHANGELOG.filter(c => verCmp(c.v, seen) > 0);
  modal(`<div class="row between"><h2>🆕 ${all ? T('Nouveautés', 'What\'s new') : T('Mise à jour ' + APP_VERSION, 'Update ' + APP_VERSION)}</h2><button class="btn sm" data-act="close">✕</button></div>
    ${all ? '' : `<p class="muted small" style="margin:2px 0 8px">${T('Voici ce qui a changé depuis ta dernière visite :', 'Here\'s what changed since your last visit:')}</p>`}
    ${(all ? list : list.slice(0, 5)).map(c => `<div class="card" style="margin:8px 0"><div class="row between"><b>${T('Version', 'Version')} ${c.v}</b><span class="muted small">${new Date(c.d + 'T12:00').toLocaleDateString(LOC(), {day: 'numeric', month: 'short'})}</span></div>
      <ul style="margin:6px 0 0;padding-left:18px">${(isEN() ? c.en : c.fr).map(x => `<li style="margin:4px 0">${esc(x)}</li>`).join('')}</ul></div>`).join('')}
    <button class="btn primary block" data-act="close" style="margin-top:6px">${T('Super!', 'Great!')}</button>`, {onclose: () => { S.settings.seenVer = APP_VERSION; saveLocal(); }});
}
function checkNews() {
  if (!S.settings.onboarded) { S.settings.seenVer = APP_VERSION; saveLocal(); return; }
  if (!S.settings.seenVer) { S.settings.seenVer = '7.2.1'; }
  if (verCmp(APP_VERSION, S.settings.seenVer) > 0) setTimeout(() => { if (!modals.length) openNews(false); else S.settings.seenVer = APP_VERSION; }, 700);
}

function routineChanges(a, r) {
  if (!r) return [];
  const ch = [], key = x => norm(x.orig || x.name), RE = r.exercises, WE = a.exercises;
  WE.forEach(x => { if (x.orig && norm(x.orig) !== norm(x.name)) ch.push(T(`« ${x.orig} » remplacé par « ${x.name} »`, `“${x.orig}” replaced with “${x.name}”`)); });
  WE.forEach(x => { if (!x.orig) ch.push(T(`Ajouté : ${x.name}`, `Added: ${x.name}`)); });
  RE.forEach(y => { if (!WE.some(x => x.orig && norm(x.orig) === norm(y.name))) ch.push(T(`Retiré : ${y.name}`, `Removed: ${y.name}`)); });
  const ord = WE.filter(x => x.orig).map(x => norm(x.orig)), rord = RE.map(y => norm(y.name)).filter(n => ord.includes(n));
  if (ord.join('|') !== rord.join('|')) ch.push(T('Ordre des exercices', 'Exercise order'));
  const grp = (L, k) => { const m = {}; L.forEach(x => { if (x.ss) m[k(x)] = L.filter(y => y.ss === x.ss).map(k).sort().join('+'); }); return m; };
  const g1 = grp(RE, y => norm(y.name)), g2 = grp(WE, x => key(x));
  const ssDiff = [...new Set([...Object.keys(g1), ...Object.keys(g2)])].some(k => (g1[k] || '') !== (g2[k] || ''));
  if (ssDiff) ch.push(T('Supersets', 'Supersets'));
  WE.forEach(x => { if (x.orig && x.n0 != null && x.sets.length !== x.n0) ch.push(T(`${x.name} : ${x.n0} → ${x.sets.length} séries`, `${x.name}: ${x.n0} → ${x.sets.length} sets`)); });
  WE.forEach(x => { const y = x.orig && RE.find(z => norm(z.name) === norm(x.orig)); if (y && (+x.rest || 0) !== (+y.rest || 0)) ch.push(T(`Repos de ${x.name}`, `${x.name} rest`)); });

}

/* ===================== Cardio : calories et pas ===================== */
const CARDIO_RE = /tapis roulant|treadmill|v[ée]lo stationnaire|stationary bike|spinning|elliptique|elliptical|stairmaster|stepmill|escaliers \(|corde à sauter|jump rope|rameur|rowing machine|ergom|^course\b|^marche ext|^run\b|^walk(ing)?\b(?!.*lunge)|cardio/i;
const isCardio = e => !!(e && (e.cardio || (e.target && e.target.cardio) || CARDIO_RE.test(e.name || '')));
const CARDIO_KIND = n => /course|run|jog/i.test(n) && !/v[ée]lo|bike/i.test(n) ? 'run' : /tapis|treadmill|marche|walk/i.test(n) ? 'walk' : /v[ée]lo|bike|spin/i.test(n) ? 'bike' : /ellipti/i.test(n) ? 'ell' : /escalier|stair|step/i.test(n) ? 'stair' : /corde|rope/i.test(n) ? 'rope' : /rameur|row/i.test(n) ? 'row' : 'other';
const CARDIO_MET = {bike: 7, ell: 5, stair: 9, rope: 11, row: 7, other: 6, walk: 3.5, run: 9};
function bodyKg() { const L = S.body.filter(b => b.w != null).sort((a, b) => a.d.localeCompare(b.d)).pop(); const w = L ? +L.w : (+S.settings.bwDefault || (U() === 'kg' ? 75 : 170)); return U() === 'kg' ? w : w / 2.20462; }
const kmU = () => S.settings.dist || 'km';
/* min = minutes, dist = km ou mi, inc = inclinaison (%) ou niveau, kg = poids du corps */
/* ---- Infos du corps (Profil) ---- */
const ME = () => S.settings.me || {};
const meH = () => +ME().h || (ME().sex === 'f' ? 163 : 176); // taille en cm
const meAge = () => +ME().age || 30, meF = () => ME().sex === 'f';
const strideW = () => meH() / 100 * (meF() ? 0.413 : 0.415); // longueur d'un pas de marche (m)
const strideR = () => meH() / 100 * 0.62;                     // longueur d'un pas de course (m)
const rmrMin = kg => Math.max(0.6, (10 * kg + 6.25 * meH() - 5 * meAge() + (meF() ? -161 : 5)) / 1440); // métabolisme de repos (kcal/min), Mifflin-St Jeor
const vo2W = (v, g) => 0.1 * v + 1.8 * v * g + 3.5; // ACSM marche, v en m/min
const vo2R = (v, g) => 0.2 * v + 0.9 * v * g + 3.5; // ACSM course
const kcalOf = (vo2, min, kg) => ((vo2 - 3.5) * kg * 5 / 1000 + rmrMin(kg)) * min;
const FLAT_V = 83.3; // marche à plat de référence : 5 km/h
function flatStepKcal(kg) { const spm = FLAT_V / strideW(); return kcalOf(vo2W(FLAT_V, 0), 1, kg) / spm; }
/* Calcul principal.
   o = {kind, steps, min, kmh, inc, level, kg}
   Retour : {kcal, steps (équivalent à plat), km (équivalent), realSteps, realKm, min} */
function cardioCompute(o) {
  const kg = o.kg || bodyKg(), g = Math.max(0, +o.inc || 0) / 100, k = o.kind;
  if (k === 'walk' || k === 'run') {
    const run = k === 'run' || (+o.kmh || 0) >= 8, sl = run ? strideR() : strideW();
    let v = (+o.kmh || (run ? 9.5 : 5)) * 1000 / 60, steps = +o.steps || 0, min = +o.min || 0, dist;
    if (steps) { dist = steps * sl; min = dist / v; }
    else if (min) { dist = v * min; steps = Math.round(dist / sl); }
    else return null;
    const vo2 = run ? vo2R(v, g) : vo2W(v, g), kcal = kcalOf(vo2, min, kg);
    const eq = Math.round(kcal / flatStepKcal(kg));
    return {kcal: Math.round(kcal), steps: eq, km: eq * strideW() / 1000, realSteps: Math.round(steps), realKm: dist / 1000, min, ratio: steps ? eq / steps : 0};
  }
  const min = +o.min || 0; if (!min) return null;

  const kcal = kcalOf(met * 3.5, min, kg), eq = Math.round(kcal / flatStepKcal(kg));

/* compatibilité : cartes cardio dans les séances (min, distance, inclinaison ou niveau) */
function cardioCalc(kind, min, dist, inc, kg) {
  min = +min || 0; if (!min) return null;

}

/* La photo de profil est petite (dans les réglages). Les photos de progrès sont gardées dans une base locale du téléphone (IndexedDB) :
   elles ne partent dans aucune sauvegarde, elles restent privées sur ce téléphone. */
function shrinkImg(file, max, q) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', q)); };
    im.onerror = () => { URL.revokeObjectURL(url); ko(new Error(T('Image illisible', 'Unreadable image'))); };
    im.src = url;
  });
}
function pickImage(cb, front) {

    if (/^remind/.test(t.dataset.set)) { if (t.dataset.set === 'remind' && t.checked && !notifOn()) askNotif().then(ok => { if (ok) { S.settings.notif = true; save(); } remindSync(); render(); }); setTimeout(remindSync, 0); if (t.dataset.set === 'remind') setTimeout(render, 0); }
    save();
    if (t.dataset.set === 'lang') { setTimeout(() => location.reload(), 150); return; }
  }
  if (t.id === 'pasteTa') { const ok = document.querySelector('[data-act="paste-ok"]'); previewPaste(ok ? ok.dataset.rid : ''); renderRestPick(); }
  if (t.id === 'pkq' && pk) renderPicker();
  if (t.dataset.rd && rdraft && t.tagName !== 'SELECT') { rdraft[t.dataset.rd] = t.value; rdirty = true; }
  if (t.dataset.rdnote !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdnote].note = t.value; rdirty = true; }
  if (t.dataset.rdw !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdw].sl[+t.dataset.s].w = t.value.replace(',', '.'); rdirty = true; }
  if ((t.dataset.rdlo !== undefined || t.dataset.rdhi !== undefined) && rdraft) {
    const ins = t.parentElement.querySelectorAll('input'), lo = ins[0].value.trim(), hi = ins[1].value.trim();
    rdraft.exercises[+(t.dataset.rdlo ?? t.dataset.rdhi)].sl[+t.dataset.s].r = lo && hi ? (lo === hi ? lo : `${lo}-${hi}`) : (lo || hi);
    rdirty = true;
  }
  if (t.dataset.rdr !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdr].sl[+t.dataset.s].r = t.value.replace(/[–—]/g, '-'); rdirty = true; }
  if (t.id === 'exq') { exQ = t.value; $('#exlist').innerHTML = exListHtml(); }
  if (t.id === 'pltw') renderPlates();
  if (t.dataset.accent !== undefined) { S.settings.accent = t.value; saveLocal(); applyTheme(); }
  if (t.dataset.bgc !== undefined) { S.settings.bg = t.value; saveLocal(); applyTheme(); }
  if (t.dataset.bvol !== undefined) { S.settings.beepVol = +t.value; const l = $('#bvl'); if (l) l.textContent = t.value + ' %'; t.style.setProperty('--p', t.value + '%'); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'exSel') { progEx = t.value; render(); }
  if (t.id === 'bodySel') { bodyMetric = t.value; render(); }
  if (t.dataset.set === 'stPrep') { S.settings.stPrep = +t.value; save(); render(); }
  if (['unit', 'dist', 'icons', 'weekSun', 'prevMode', 'bwVol'].includes(t.dataset.set)) { bwMemo.clear(); render(); }
  if (t.dataset.rd === 'folder' && rdraft) {
    if (t.value === '__new') { const nf = (prompt('Nom du nouveau dossier :') || '').trim(); if (nf) { if (!S.folders.includes(nf)) S.folders.push(nf); rdraft.folder = nf; } render(); }
    else rdraft.folder = t.value;
    rdirty = true;
  }
  if (t.dataset.rdrest !== undefined && rdraft) { const e2 = rdraft.exercises[+t.dataset.rdrest]; if (t.value === '') delete e2.rest; else if (t.value === 'off') e2.rest = -1; else e2.rest = +t.value; rdirty = true; }
  if (t.dataset.pf === 'range') { pfWeeks = +t.value; pfSel = null; render(); }
  if (t.id === 'pltb') { S.settings.bar = +t.value; save(); renderPlates(); }
  if (t.dataset.sched !== undefined) { S.schedule[+t.dataset.sched] = t.value; save(); }
  if (tmDraft && t.dataset.tmf === 'n') tmDraft.n = t.value;
  if (tmDraft && t.dataset.tmn) { const [bi, i] = t.dataset.tmn.split('-').map(Number); tmDraft.blocks[bi].steps[i].n = t.value; }
  if (t.dataset.stsec !== undefined && stDraft) { stDraft.items[+t.dataset.stsec].sec = +t.value; renderStEdit(); }
  if (t.dataset.cycfold !== undefined && t.value) { const c = cyc(); S.routines.filter(r => (r.folder || DEF_FOLDER) === t.value).forEach(r => { if (!c.order.includes(r.id)) c.order.push(r.id); }); save(); renderSched(); }
  if (t.dataset.cycadd !== undefined && t.value) { const c = cyc(); if (!c.order.includes(t.value)) c.order.push(t.value); save(); renderSched(); }
  if (t.dataset.cycnext !== undefined) { cyc().next = {rid: t.value, at: new Date().toISOString()}; save(); renderSched(); }
  // Pas de render() ici : sur iPhone, l'événement « change » arrive dès qu'on touche le sélecteur de couleur,
  // et redessiner la page fermait le sélecteur avec la première couleur touchée. La couleur s'applique déjà en direct.
  if (t.dataset.accent !== undefined || t.dataset.bgc !== undefined) { save(); document.querySelectorAll('.chip.on[data-act="accent-pick"], .chip.on[data-act="bg-pick"]').forEach(c => c.classList.remove('on')); }
  if (t.dataset.bvol !== undefined) { ensureAudio(); setTimeout(() => beep(true), 30); }
  if (t.dataset.set === 'beepSnd') { ensureAudio(); setTimeout(() => beep(true), 30); }
  if (t.dataset.move !== undefined) {
    const r2 = S.routines.find(x => x.id === t.dataset.move); if (!r2) return;
    let f = t.value;
    if (f === '__new') { f = (prompt('Nom du nouveau dossier :') || '').trim(); if (!f) { closeAll(); return; } }
    if (!S.folders.includes(f)) S.folders.push(f);
    r2.folder = f; save(); closeAll(); render(); toast('📁 Routine déplacée dans « ' + f + ' »');
  }
  if (t.dataset.restpick !== undefined) {
    const res = parseText($('#pasteTa').value, editName); if (!res.length) return;
    const r = res[0], i = +t.dataset.restpick;
    if (t.value) r.exercises[i].rest = +t.value; else delete r.exercises[i].rest;
    $('#pasteTa').value = routineToText(r); renderRestPick();
    const ok = document.querySelector('[data-act="paste-ok"]'); previewPaste(ok ? ok.dataset.rid : '');
  }
  if (t.dataset.exrest !== undefined && S.active) {
    const x = S.active.exercises[+t.dataset.exrest]; x.rest = t.value ? +t.value : undefined;
    save();
  }
});
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('resize', () => afterRender(cur()));

render();
try { const sc = sessionStorage.getItem('cm-scroll'); sessionStorage.removeItem('cm-scroll'); if (sc && stack.length === 1) { const [t, y] = sc.split(':'); if (t === stack[0].v && +y > 0) requestAnimationFrame(() => window.scrollTo(0, +y)); } } catch (e) {}
function openWelcome() {
  modal(`<div style="text-align:center"><div style="font-size:46px">💪</div><h2 style="margin:4px 0">${T('Bienvenue dans Carnet Muscu!', 'Welcome to Carnet Muscu!')}</h2><p class="muted small">${T('4 questions et c\'est parti. Tu pourras tout changer dans les Réglages.', '4 quick questions and you\'re set. You can change everything later in Settings.')}</p></div>
    <label>Langue / Language</label><div class="seg"><button class="${isEN() ? '' : 'on'}" data-act="wl-lang" data-v="fr">Français</button><button class="${isEN() ? 'on' : ''}" data-act="wl-lang" data-v="en">English</button></div>
    <label>${T('Ton prénom', 'Your first name')}</label><input id="wlname" value="${esc(S.settings.name || '')}" placeholder="${T('Ex. : Alex', 'E.g. Alex')}">
    <label>${T('Unité', 'Unit')}</label><div class="seg"><button class="${U() === 'lb' ? 'on' : ''}" data-act="wl-unit" data-v="lb">lb</button><button class="${U() === 'kg' ? 'on' : ''}" data-act="wl-unit" data-v="kg">kg</button></div>
    <label>${T('Comment fais-tu tes séries?', 'How do you train your sets?')}</label>
    <div class="menu">${EFFORTS().map(([k, l]) => `<button class="btn block ${(S.settings.effort || 'normal') === k ? 'on' : ''}" data-act="wl-eff" data-v="${k}" style="text-align:left">${l}</button>`).join('')}</div>
    <label>${T('Quel style tu préfères?', 'Which style do you prefer?')}</label>
    <div class="menu"><button class="btn block ${S.settings.game === false ? 'on' : ''}" data-act="wl-game" data-v="0" style="text-align:left">📒 <b>${T('Classique', 'Classic')}</b><br><span class="small" style="opacity:.75;font-weight:400">${T('Un carnet simple et efficace : tes séances, tes records, tes stats.', 'A simple, efficient log: your workouts, records and stats.')}</span></button>
      <button class="btn block ${S.settings.game !== false ? 'on' : ''}" data-act="wl-game" data-v="1" style="text-align:left">⚔️ <b>${T('Mode jeu', 'Game mode')}</b><br><span class="small" style="opacity:.75;font-weight:400">${T('Gagne de l\'XP, monte de niveau et de rang, fais des quêtes et bats des boss.', 'Earn XP, level up and rank up, do quests and beat bosses.')}</span></button></div>
    <p class="muted small" style="margin:4px 0 0">${T('Tu pourras changer dans Réglages → Général.', 'You can change it in Settings → General.')}</p>
    <button class="btn primary block" data-act="wl-ok" style="margin-top:14px">${T('C\'est parti!', 'Let\'s go!')}</button>`, {id: 'welcome', onclose: () => { S.settings.onboarded = true; S.settings.tourPending = true; save(); setTimeout(checkImport, 250); setTimeout(() => { if (!modals.length && !location.hash.includes('imp=') && !location.hash.includes('ami=')) welcomeBackup(); }, 400); }});
}
/* Après l'accueil : proposer la sauvegarde Google en un toucher (la visite guidée suit) */
function welcomeBackup() {
  if (!gdReady() || gdOn()) return maybeTourMain();
  modal(`<div style="text-align:center"><div style="font-size:46px">🛡️</div><h2 style="margin:4px 0">${T('Ne perds jamais tes séances', 'Never lose your workouts')}</h2></div>
    <p class="small">${T('Tes données sont dans ton téléphone. Si tu le changes, le perds ou effaces l\'appli, tout part avec. Connecte Google : tout se sauvegarde tout seul après chaque séance, dans un dossier privé de <b>ton</b> Google Drive (photos comprises).', 'Your data lives on your phone. If you change it, lose it or delete the app, it\'s all gone. Connect Google: everything is saved automatically after each workout, in a private folder of <b>your</b> Google Drive (photos included).')}</p>
    <button class="btn primary block" data-act="wl-gd"><b>G</b>&nbsp; ${T('Activer avec Google (recommandé)', 'Turn on with Google (recommended)')}</button>
    <button class="btn block" data-act="close" style="margin-top:8px">${T('Plus tard', 'Later')}</button>
    <p class="muted small center" style="margin:8px 0 0">${T('Tu pourras l\'activer quand tu veux dans Réglages → Sauvegarde.', 'You can turn it on anytime in Settings → Backup.')}</p>`, {id: 'wlbk', onclose: () => setTimeout(maybeTourMain, 500)});
}

  const t = S.settings.tour || {};

if (!S.settings.onboarded) setTimeout(openWelcome, 300);
else if (isIOS && !isStandalone() && !S.settings.iosHintOff) setTimeout(() => { if (!modals.length) iosHint(); }, 1200);
checkNews();
if (S.settings.onboarded) setTimeout(checkImport, 450);
window.addEventListener('hashchange', checkImport);
setTimeout(checkFriendLink, 600); window.addEventListener('hashchange', checkFriendLink);
setTimeout(() => frLoad(), 2500); document.addEventListener('visibilitychange', () => { if (!document.hidden) frLoad(); });
{ const bad = brokenImports(); if (bad.length) modal(`<h2>🛠️ Dates de séances à réparer</h2>
  <p>J'ai trouvé <b>${bad.length} séances importées de Hevy</b> qui ont toutes reçu la même date à cause d'un bug de l'import (les mois en français comme « août » ou « juil. » n'étaient pas reconnus). C'est corrigé.</p>
  <p class="muted small">Pour les récupérer avec les bonnes dates : supprime-les, puis réimporte ton fichier CSV de Hevy (Hevy → Profil → Réglages → Exporter les données). Les séances déjà correctes ne seront pas dupliquées.</p>
  <button class="btn primary block" data-act="fix-import">Supprimer et réimporter le CSV</button>
  <button class="btn block" data-act="close" style="margin-top:8px">Plus tard</button>`); }
{ const q = new URLSearchParams(location.search).get('go');
  if (q) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (q === 'workout' && S.active) openWorkout();
    if (q === 'today') { if (S.active) openWorkout(); else { const r = schedR(dayIdx(new Date())); if (r) startWorkout(r.id); else toast("Rien de prévu aujourd'hui dans ton horaire"); } }
    else if (q === 'empty') startEmpty();

if (cloudOn()) setTimeout(() => cloudPush(), 4000);

setTimeout(() => loadTxt(), 5000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
