es genoux légèrement fléchis, et tiens une barre d'une main en prise pronation.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta tête en position neutre.","Tire la barre vers le haut en direction de ta poitrine, en gardant ton coude près de ton corps et en contractant tes omoplates.","Abaisse la barre jusqu'à la position de départ de manière contrôlée.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Allonge-toi sur le dos au sol, les genoux fléchis et les pieds à plat au sol.","Tiens la barre d'une main, la paume tournée vers le haut, et étends ton bras droit au-dessus de ta poitrine.","Abaisse lentement la barre vers ta poitrine, en gardant ton coude près de ton corps.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant une barre d'une main en prise pronation.","Garde le dos droit et ta sangle abdominale gainée.","Fléchis les hanches et abaisse la barre vers l'extérieur de ta jambe en gardant ton bras tendu et ta poitrine haute.","Abaisse la barre aussi bas que possible tout en maintenant une bonne forme.","Marque une pause, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens la barre en prise pronation, les mains un peu plus écartées que la largeur des épaules.","Fléchis les genoux et abaisse tes hanches en position accroupie en gardant le dos droit et la poitrine relevée.","Étends de manière explosive tes hanches, tes genoux et tes chevilles, en propulsant la barre vers le haut.","Lorsque la barre atteint la hauteur de la poitrine, tire-la vers le haut avec ton bras en la gardant près de ton corps.","Fais pivoter ton coude sous la barre et étends complètement ton bras au-dessus de ta tête, en verrouillant ton coude.","Abaisse la barre jusqu'à la position de départ de manière contrôlée.","Répète le nombre de répétitions souhaité, puis change de bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en travers du haut de ton dos.","Décolle un pied du sol et étends-le vers l'avant, en le gardant parallèle au sol.","Fléchis ta jambe d'appui et abaisse ton corps comme si tu t'asseyais sur une chaise, en gardant la poitrine relevée et le dos droit.","Descends jusqu'à ce que ta cuisse soit parallèle au sol, puis pousse sur ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe et recommence."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens la barre en prise large, en la positionnant au-dessus de la tête, les bras complètement étendus.","Gaine ta sangle abdominale et abaisse ton corps en position de squat, en gardant ta poitrine relevée et tes genoux alignés au-dessus de tes orteils.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et tes avant-bras posés sur tes cuisses, paumes tournées vers le bas.","Tiens une barre avec une prise en pronation, les mains écartées à la largeur des épaules.","Abaisse la barre vers le sol en fléchissant tes poignets, en gardant tes avant-bras immobiles.","Marque une pause en bas, puis remonte lentement la barre en tendant tes poignets.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol, et tiens une barre avec une prise en supination, paumes tournées vers le haut.","Pose tes avant-bras sur le banc, en laissant tes poignets dépasser du bord.","En gardant tes avant-bras immobiles, expire et fléchis tes poignets vers le haut aussi loin que possible.","Maintiens la position contractée pendant une brève pause, puis inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Tire la barre vers le haut de ton abdomen, en contractant tes omoplates.","Abaisse la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe une barre sur un rack de puissance à hauteur de poitrine.","Tiens-toi face à la barre et positionne-toi en dessous, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, légèrement plus écartée que la largeur des épaules.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse la barre vers ta poitrine, en gardant tes coudes serrés près de ton corps.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc à prêcheur, le haut de tes bras posé sur le coussin et ta poitrine contre le support.","Saisis la barre avec une prise en supination, un peu plus large que la largeur des épaules.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos sur un tapis, les genoux fléchis et les pieds à plat au sol.","Tiens la barre en prise pronation, en la faisant reposer sur ta poitrine.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Allonge-toi face vers le bas sur le banc, la poitrine et le ventre reposant contre lui.","Tiens une barre avec une prise en supination, écartée à la largeur des épaules.","Étends complètement tes bras, en laissant la barre pendre vers le sol.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds au sol.","Tiens une barre avec une prise à la largeur des épaules et étends les bras droit au-dessus de ta poitrine.","En gardant les bras tendus, abaisse la barre derrière ta tête de manière contrôlée jusqu'à ressentir un étirement dans tes grands dorsaux.","Marque une pause, puis ramène la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds au sol.","Tiens la barre en prise pronation (paumes tournées vers l'extérieur) et étends tes bras droit au-dessus de ta poitrine.","En gardant les bras tendus, abaisse la barre derrière ta tête dans un mouvement en arc jusqu'à ressentir un étirement dans tes grands dorsaux.","Marque une pause, puis inverse le mouvement et repousse la barre jusqu'à la position de départ au-dessus de ta poitrine.","Répète le nombre de répétitions souhaité."],["Installe une barre sur un rack à hauteur de genou.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Fléchis les hanches et les genoux pour descendre et saisis la barre en prise pronation, les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et soulève la barre en étendant tes hanches et tes genoux, en ramenant tes épaules en arrière et en contractant tes fessiers en haut.","Abaisse la barre jusqu'à la position de départ en fléchissant les hanches et les genoux.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, paumes tournées vers le bas.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Lève la barre sur les côtés en gardant tes bras tendus, jusqu'à ce qu'ils soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens une barre avec une prise en pronation, les mains légèrement plus écartées que la largeur des épaules.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute.","Tire la barre vers ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules et une barre posée sur le haut du dos.","Fais un pas en arrière avec le pied droit, en atterrissant sur la pointe du pied.","Fléchis les deux genoux pour abaisser ton corps jusqu'à ce que ta cuisse gauche soit parallèle au sol.","Pousse à travers ton talon gauche pour revenir à la position de départ.","Répète avec l'autre jambe."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et t ses lentement la barre jusqu'à la position de départ, en gardant le haut de tes bras immobile.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens une barre avec une prise en pronation, les paumes tournées vers le bas, et les mains légèrement plus écartées que la largeur des épaules.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute, jusqu'à ce que ton torse soit presque parallèle au sol.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, les pieds bloqués et la tête plus basse que les hanches.","Saisis la barre avec une prise inversée, un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Allonge-toi sur le banc, les pieds à plat au sol.","Saisis la barre avec une prise inversée, les mains un peu plus larges que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes rentrés.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés.","Assieds-toi sur le banc face au dossier, la poitrine contre celui-ci.","Saisis la barre avec une prise inversée (paumes tournées vers le bas), les mains un peu plus larges que la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée.","Tire la barre vers le haut de ton abdomen, en contractant tes omoplates.","Marque une pause en haut du mouvement.","Abaisse lentement la barre vers la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et la tête au bout du banc.","Tiens la barre en prise inversée, les paumes tournées vers ton visage, les mains écartées à la largeur des épaules.","Étends les bras droit au-dessus de la poitrine, en gardant les coudes rentrés et les poignets droits.","Abaisse lentement la barre vers ton front en fléchissant les coudes, en gardant le haut de tes bras immobile.","Marque une pause en bas, puis étends tes bras jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc à prêcheur, la poitrine contre le coussin et tes bras tendus droit vers le bas, en tenant une barre avec une prise en pronation.","En gardant le haut des bras immobile, expire et fléchis la barre vers le haut en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol, et tiens une barre avec une prise en pronation, paumes tournées vers le bas.","Pose tes avant-bras sur tes cuisses, en laissant tes poignets dépasser du bord.","Enroule lentement tes poignets vers le haut, en ramenant la barre vers ton corps.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Mets-toi à genoux au sol et tiens une barre des deux mains, écartées à la largeur des épaules.","Fais rouler la barre vers l'avant, en étendant tes bras et en gardant ta sangle abdominale gainée.","Continue à rouler vers l'avant jusqu'à ce que ton corps soit complètement étendu et que tes bras soient au-dessus de ta tête.","Marque une pause, puis fais rouler lentement la barre vers tes genoux, en gardant le contrôle.","Répète le nombre de répétitions souhaité."],["Commence à genoux au sol, avec une barre posée sur un banc devant toi.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","En gardant ta sangle abdominale gainée et le dos droit, fais lentement rouler la barre vers l'avant, en tendant tes bras devant toi.","Continue à faire rouler la barre vers l'avant jusqu'à ce que ton corps soit complètement étendu et que tes bras soient au-dessus de ta tête.","Marque une pause en position complètement étendue, puis fais rouler lentement la barre vers ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils pointés vers l'avant.","Tiens la barre en prise pronation, les mains un peu plus écartées que la largeur des épaules.","Fléchis les hanches en gardant ton dos droit et tes genoux légèrement fléchis.","Abaisse la barre vers le sol, en la gardant près de ton corps.","Sens l'étirement dans tes ischio-jambiers en abaissant la barre.","Une fois que tu ressens un étirement dans tes ischio-jambiers, pousse tes hanches vers l'avant et redresse-toi.","Contracte tes fessiers en haut du mouvement.","Abaisse la barre jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre en prise pronation, un peu plus écartée que la largeur des épaules.","Soulève la barre du rack et descends-la à hauteur des épaules, derrière ta tête.","Pousse la barre vers le haut jusqu'à ce que tes bras soient complètement tendus.","Abaisse la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre en prise pronation, un peu plus écartée que la largeur des épaules.","Soulève la barre à hauteur des épaules, en gardant tes coudes légèrement fléchis et pointés vers l'avant.","Développe la barre au-dessus de ta tête, en tendant complètement tes bras.","Abaisse la barre à hauteur des épaules et répète pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et une barre posée sur tes cuisses.","Place l'avant de tes pieds sur une plateforme surélevée, comme un bloc ou une marche.","Positionne la barre en travers de tes cuisses et tiens-la fermement avec tes mains.","En gardant le dos droit et ta sangle abdominale gainée, soulève tes talons du sol en étendant tes chevilles.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et une barre posée sur tes cuisses.","Place l'avant de tes pieds sur une plateforme surélevée, comme un bloc ou une marche.","Abaisse tes talons aussi bas que possible, en ressentant un étirement dans tes mollets.","Lève tes talons aussi haut que possible en contractant tes mollets.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre en prise serrée derrière ta nuque, les paumes tournées vers l'avant.","Garde tes coudes près de ta tête et abaisse lentement la barre vers l'arrière de ta tête.","Marque une pause, puis étends tes bras vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol, et tiens une barre avec une prise en supination, les mains écartées à la largeur des épaules.","Appuie le haut de tes bras contre l'intérieur de tes cuisses, juste au-dessus de tes genoux, et laisse la barre pendre devant toi.","En gardant le haut des bras immobile, expire et fléchis la barre vers tes épaules, en contractant tes biceps.","Maintiens la position contractée pendant une brève pause, puis inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et une barre posée sur le haut de ton dos.","Garde le dos droit et la poitrine relevée.","Bascule lentement vers l'avant au niveau des hanches, en abaissant ton torse vers le sol.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens la barre en prise pronation, un peu plus écartée que la largeur des épaules.","Soulève la barre du rack et amène-la à hauteur des épaules, les coudes fléchis et les paumes tournées vers l'avant.","Développe la barre au-dessus de ta tête en tendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement la barre à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit et les pieds à plat sur le sol.","Tiens une barre avec une prise en pronation, les mains écartées à la largeur des épaules, et lève-la au-dessus de ta tête.","Abaisse la barre derrière ta tête en fléchissant tes coudes, en gardant le haut de tes bras près de ta tête.","Marque une pause, puis étends tes bras pour ramener la barre vers le haut à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc plat, les pieds à plat sur le sol et les genoux fléchis.","Tiens une barre des deux mains devant ta poitrine, en gardant les coudes légèrement fléchis.","Gaine ta sangle abdominale et tourne lentement ton torse d'un côté, en gardant le dos droit.","Marque une pause à la fin de la torsion, puis tourne lentement pour revenir à la position de départ.","Répète la torsion vers l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre devant toi en prise pronation.","Garde tes bras tendus et ton dos droit tout au long de l'exercice.","Monte tes épaules vers tes oreilles aussi haut que possible, en contractant tes trapèzes en haut.","Maintiens un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre à deux mains, paumes tournées vers le bas.","Garde le dos droit et ta sangle abdominale gainée tout au long de l'exercice.","Fléchis lentement ton torse vers le côté droit, en abaissant la barre vers ton genou droit.","Marque une pause, puis reviens à la position de départ.","Répète le mouvement du côté gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens une barre en travers du haut de ton dos, en la posant sur tes trapèzes.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses ton corps en position de squat, en pliant les genoux et les hanches.","En descendant, pousse tes genoux vers les côtés et garde ton poids sur tes talons.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens une barre en travers du haut de ton dos, en la posant sur tes épaules.","Fais un grand pas sur le côté avec le pied droit, en gardant le pied gauche bien ancré.","Fléchis ton genou droit et abaisse ton corps en position accroupie en gardant la poitrine relevée et le dos droit.","Pousse à travers ton talon droit pour revenir à la position de départ.","Répète de l'autre côté en faisant un pas sur le côté avec ton pied gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des hanches, en tenant une barre devant tes cuisses en prise pronation.","Reporte ton poids sur ton pied gauche et soulève légèrement ton pied droit du sol.","Bascule vers l'avant au niveau des hanches, en gardant le dos droit et ta jambe droite étendue derrière toi pour l'équilibre.","Abaisse la barre vers le sol, en la gardant près de ton corps et ta jambe gauche légèrement fléchie.","Marque une pause en bas, puis contracte tes fessiers et tes ischio-jambiers pour relever ton torse jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant une barre en travers du haut de ton dos.","Fais un grand pas en avant avec une jambe, en gardant le torse bien droit.","Abaisse ton corps en fléchissant ton genou et ta hanche avant, tout en gardant ta jambe arrière tendue.","Continue à descendre jusqu'à ce que ta cuisse avant soit parallèle au sol.","Marque une pause, puis pousse sur ton talon avant pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Assieds-toi sur un banc, le dos droit, et tiens une barre en travers de tes cuisses.","En gardant les jambes tendues, lève une jambe le plus haut possible en gardant l'autre jambe au sol.","Abaisse la jambe levée et répète avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos droit, et tiens une barre en travers de tes cuisses.","Place tes mains sur les côtés du banc pour te soutenir.","En gardant les jambes tendues, lève une jambe le plus haut possible en la gardant parallèle au sol.","Abaisse la jambe et répète avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre devant tes cuisses en prise pronation.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit et la poitrine relevée.","Soulève simultanément la barre vers tes épaules tout en sautant légèrement du sol.","Une fois en haut du mouvement, inverse rapidement le mouvement et abaisse la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens la barre en travers du haut de ton dos, en la faisant reposer sur tes trapèzes ou tes deltoïdes postérieurs.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses tes hanches vers l'arrière et le bas, comme si tu t'asseyais sur une chaise.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Pousse sur tes talons pour te relever, en contractant tes fessiers en haut.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant une barre sur le haut du dos.","Fais un grand pas en avant avec le pied droit, en gardant le torse bien droit.","Abaisse ton corps en fléchissant tes genoux et tes hanches jusqu'à ce que ta cuisse droite soit parallèle au sol.","Marque une pause, puis pousse sur ton talon droit pour revenir à la position de départ.","Répète avec ta jambe gauche en avant pour le nombre de répétitions souhaité."],["Commence à genoux au sol, les genoux écartés à la largeur des hanches et les orteils pointés vers l'avant.","Place une barre sur tes épaules, en la saisissant en prise pronation avec tes mains légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses lentement ton corps en pliant tes genoux, en gardant ton dos droit.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant une barre sur le haut du dos.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Explose vers le haut, en sautant du sol aussi haut que possible.","Atterris en douceur sur tes pieds et recule immédiatement une jambe pour une fente arrière.","Abaisse ton corps jusqu'à ce que ta cuisse avant soit parallèle au sol, en gardant ton dos droit.","Pousse à travers ton talon avant pour revenir à la position de départ.","Répète la séquence de saut et de fente avec l'autre jambe.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Tiens-toi debout bien droit, les pieds écartés à la largeur des épaules, et tiens la barre à deux mains devant tes cuisses.","Gaine ta sangle abdominale et fais rouler lentement la barre vers le sol, en gardant le dos droit et les bras tendus.","Continue à faire rouler la barre vers l'avant jusqu'à ce que ton corps soit complètement étendu et que tes mains soient directement au-dessus de ta tête.","Marque une pause, puis fais rouler lentement la barre vers tes cuisses, en gardant le contrôle et en gainant ta sangle abdominale.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre en prise pronation.","Pose la barre sur le dos de tes mains, les paumes tournées vers le bas et les doigts pointés vers ton corps.","En gardant le haut des bras immobile, expire et fléchis tes poignets vers le haut aussi loin que possible.","Maintiens la position contractée pendant une brève pause, puis inspire et abaisse lentement la xpire et fléchis le poids vers ton épaule.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement le poids jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant une barre devant tes cuisses en prise pronation.","Garde le dos droit et gaine ta sangle abdominale.","Soulève lentement la barre devant toi, en gardant tes bras tendus et tes paumes tournées vers le bas.","Continue à soulever jusqu'à ce que la barre soit légèrement au-dessus du niveau des épaules.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place une barre en travers du haut de ton dos.","Lève tes talons du sol aussi haut que possible en utilisant tes mollets.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation.","Lève la barre au-dessus de ta tête en tendant complètement tes bras.","En gardant le haut des bras près de la tête, abaisse lentement la barre derrière ta tête en fléchissant tes coudes.","Marque une pause, puis ramène la barre à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre en prise supination, les paumes tournées vers le haut.","Garde tes coudes près de ton torse et le haut de tes bras immobile.","Expire et remonte les poids en contractant tes biceps, en amenant la barre aussi près que possible de tes épaules.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","R acte tes ischio-jambiers et tes fessiers pour ramener la barre vers le haut en position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils tournés vers l'extérieur.","Place une barre au sol devant toi, centrée entre tes pieds.","Fléchis les genoux et abaisse tes hanches, en gardant le dos droit et la poitrine relevée, pour saisir la barre en prise pronation.","Gaine ta sangle abdominale et pousse sur tes talons pour soulever la barre du sol, en étendant tes hanches et tes genoux simultanément.","En soulevant, garde ta poitrine ouverte et ton dos droit, et pousse tes hanches vers l'avant pour bien engager tes fessiers.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, en tenant une barre à hauteur des épaules en prise pronation.","Descends en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Une fois au bas du squat, pousse explosivement sur tes talons pour te relever tout en poussant simultanément la barre au-dessus de ta tête.","Abaisse la barre à hauteur des épaules en redescendant en position de squat.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Laisse la barre pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit et la sangle abdominale gainée, expire et soulève la barre droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Laisse la barre pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit, expire et soulève la barre droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Laisse la barre pendre devant tes cuisses, les bras entièrement tendus.","En gardant ta sangle abdominale gainée et le dos droit, expire en soulevant la barre droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire en abaissant lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise large, un peu plus large que la largeur des épaules.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse lentement la barre vers ta poitrine, en gardant tes coudes légèrement écartés.","Marque une pause lorsque la barre touche ta poitrine, puis repousse-la vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise inversée large, un peu plus large que la largeur des épaules.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse lentement la barre vers ta poitrine, en gardant tes coudes serrés et tes poignets droits.","Marque une pause lorsque la barre touche ta poitrine, puis repousse-la vers le haut pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens la barre en travers du haut de ton dos, en la faisant reposer sur tes trapèzes ou tes deltoïdes postérieurs.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses ton corps en squat, en poussant tes hanches vers l'arrière et en pliant tes genoux.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise pronation, les mains plus écartées que la largeur des épaules.","Laisse la barre pendre devant tes cuisses, les bras entièrement tendus.","En gardant le dos droit, expire et soulève la barre droit vers ton menton, en menant avec tes coudes.","Marque une pause en haut, puis inspire et abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et tes avant-bras posés sur tes cuisses, en tenant une barre avec une prise en supination.","Laisse la barre rouler jusqu'au bout de tes doigts en gardant tes poignets droits.","Enroule lentement la barre vers tes avant-bras en fléchissant les poignets.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les pieds à plat sur le sol et les genoux fléchis.","Tiens une barre avec une prise en supination, les paumes tournées vers le haut, et les mains écartées à la largeur des épaules.","Pose tes avant-bras sur tes cuisses, en laissant tes poignets dépasser du bord.","Enroule lentement tes poignets vers le haut, en ramenant la barre vers tes avant-bras.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens la barre au creux de tes coudes, tes mains agrippant la barre pour la stabilité.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses tes hanches vers l'arrière et le bas en position de squat.","Garde les genoux alignés avec les orteils et le poids dans les talons.","Marque une pause en bas du squat, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras le long du corps.","Penche-toi vers l'avant au niveau de la taille en gardant ton dos droit et tes genoux légèrement fléchis.","Penche-toi vers tes orteils avec tes mains en gardant tes jambes aussi tendues que possible.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens une extrémité de la corde dans chaque main, les paumes tournées l'une vers l'autre.","Lève tes bras à hauteur des épaules en gardant tes coudes légèrement fléchis.","Commence à faire des vagues alternées avec les cordes en levant et en abaissant rapidement chaque bras.","Continue pendant la durée ou le nombre de répétitions souhaité."],["Commence à quatre pattes, les mains directement sous les épaules et les genoux directement sous les hanches.","Décolle légèrement tes genoux du sol, en gardant ton dos plat et ta sangle abdominale gainée.","Avance simultanément ta main droite et ton pied gauche, puis ta main gauche et ton pied droit.","Continue à ramper vers l'avant en alternant les mouvements de tes mains et de tes pieds.","Maintiens un rythme régulier et garde ta sangle abdominale contractée pendant tout l'exercice.","Continue sur la distance ou la durée souhaitée."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Entrelace tes doigts derrière ta tête, les coudes pointés vers l'extérieur.","Contracte lentement tes omoplates l'une vers l'autre et pousse ta poitrine vers l'avant.","Maintiens l'étirement pendant 15 à 30 secondes.","Relâche l'étirement et répète autant de fois que souhaité."],["Assieds-toi au bord d'un banc ou d'une chaise, les mains agrippant le bord à côté de tes hanches.","Fais glisser tes fesses hors du banc et tends tes jambes devant toi, en gardant les talons au sol.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'un banc ou d'une chaise, les mains agrippant le bord, doigts pointant vers l'avant.","Fais glisser tes fesses hors du banc, en soutenant ton poids avec tes mains.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, le dos contre le banc et les pieds à plat sur le sol.","Place tes mains sur le banc pour le soutien.","Contracte tes fessiers et tes ischio-jambiers, puis soulève tes hanches du banc jusqu'à ce que ton corps forme une ligne droite de tes genoux à tes épaules.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Positionne-toi sous une barre ou une surface horizontale robuste située à hauteur de poitrine.","Saisis la barre ou la surface avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi, les bras complètement étendus et le corps droit.","Tire ta poitrine vers la barre ou la surface en contractant tes omoplates l'une vers l'autre et en fléchissant tes coudes.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre ou de la surface.","Redescends jusqu'à la position de départ de manière contrôlée.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Étends tes bras sur les côtés, perpendiculaires à ton corps.","En gardant les genoux serrés, abaisse-les lentement sur un côté, en cherchant à toucher le sol avec tes genoux.","Marque une pause, puis gaine ta sangle abdominale et remonte lentement tes genoux à la position de départ.","Répète le mouvement de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les jambes écartées et les pieds à plat sur le sol.","Tiens un haltère dans une main et place ton coude sur l'intérieur de ta cuisse, juste au-dessus du genou.","La paume tournée vers le haut, fléchis l'haltère vers ton épaule en gardant le haut de ton bras immobile.","Contracte tes biceps en haut du mouvement, puis abaisse lentement l'haltère pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Suspends-toi à une barre de traction, les paumes tournées vers toi et les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et hisse-toi vers la barre, en te concentrant sur l'utilisation de tes biceps pour soulever ton corps.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les paumes tournées vers l'extérieur et les mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et hisse-toi vers le haut en pliant tes coudes, en amenant ta poitrine vers la barre.","Marque une pause en haut du mouvement, puis redescends lentement jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence par placer tes mains sur une surface surélevée, comme un banc ou des barres parallèles, les paumes tournées vers le bas et les doigts pointés vers l'avant.","Étends tes jambes devant toi, en gardant les talons au sol et le corps droit.","Abaisse ton corps en fléchissant tes coudes, en les gardant près de tes côtés, jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis pousse sur tes paumes pour tendre tes bras et ramener ton corps vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","Saute vers le haut de manière explosive, en étendant tes hanches, tes genoux et tes chevilles.","En plein saut, ramène rapidement tes pieds l'un contre l'autre.","Atterris en douceur sur la pointe des pieds et redescends immédiatement en position de squat.","Répète le nombre de répétitions souhaité."],["Commence allongé sur le côté, les jambes tendues et superposées l'une sur l'autre.","Place ton avant-bras au sol directement sous ton épaule, avec ton coude plié à un angle de 90 degrés.","Gaine ta sangle abdominale et lève tes hanches du sol, en créant une ligne droite de ta tête à tes pieds.","Maintiens cette position pendant la durée souhaitée.","Redescends tes hanches jusqu'au sol et répète de l'autre côté."],["Mets-toi à genoux au sol, les genoux écartés à la largeur des hanches.","Place tes mains au sol devant toi, écartées à la largeur des épaules, les doigts pointés vers l'avant.","Étends tes jambes droit derrière toi, en équilibre sur les orteils et les mains, en formant une ligne droite de la tête aux talons.","Plie tes coudes et abaisse le haut de ton corps vers le sol en gardant tes coudes près de tes côtés.","Marque une pause en bas, puis pousse sur tes mains pour tendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et la tête soutenue par ton bras.","Garde le haut de ton bras contre ton flanc et plie ton coude pour ramener ton avant-bras vers ton épaule.","Marque une pause en haut, puis abaisse lentement ton avant-bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en te tenant à un objet solide ou à un sangle de suspension, les bras tendus.","Descends en position accroupie, en gardant le dos droit et tes genoux derrière les orteils.","Depuis la position de squat, tire ton corps vers l'objet ou l'appareil de suspension, en resserrant tes omoplates.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant une serviette devant toi, paumes tournées vers le bas.","Fléchis les genoux et abaisse ton corps en position accroupie en gardant le dos droit et la poitrine relevée.","En descendant dans le squat, tire simultanément la serviette vers ta poitrine en resserrant tes omoplates.","Marque une pause en bas du squat, puis reviens lentement à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils pointés vers l'avant.","Place tes mains sur un mur ou une surface stable pour l'équilibre.","Lève lentement les talons du sol, en reportant le poids de ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens un haltère d'une main en prise neutre.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Tire l'haltère vers le haut en direction de ta poitrine, en gardant ton coude près de ton corps et en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement l'haltère pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Penche-toi vers l'avant au niveau de la taille en gardant ton dos droit et ta sangle abdominale gainée.","Étends les bras droit devant toi, en saisissant la barre ou les poignées avec une prise serrée.","Tire la barre ou les poignées vers ton corps, en contractant tes omoplates.","Marque une pause en haut du mouvement, puis relâche lentement et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens un haltère d'une main.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Laisse l'haltère pendre droit vers le bas devant toi, le bras entièrement tendu.","Tire l'haltère vers le haut en direction de ta poitrine, en gardant ton coude près de ton corps.","Contracte tes omoplates l'une vers l'autre en haut du mouvement.","Abaisse l'haltère jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les genoux légèrement fléchis, et tiens une serviette d'une main.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta sangle abdominale gainée.","Tire la serviette vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse lentement la serviette pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis une barre ou des poignées avec une prise en pronation, les paumes tournées vers le bas.","Garde le dos droit et ta sangle abdominale gainée.","Tire la barre ou les poignées vers ton corps, en contractant tes omoplates.","Marque une pause en haut du mouvement.","Relâche lentement et étends les bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une serviette devant toi à deux mains.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Tire la serviette vers ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Fléchis tes genoux et amène-les vers ta poitrine en gardant tes pieds décollés du sol.","En gainant tes abdominaux, soulève tes hanches du sol, en amenant tes genoux vers ta tête.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi devant une boîte ou une plateforme, les pieds écartés à la largeur des épaules.","Fléchis les genoux et saute sur la box, en atterrissant en douceur avec un pied sur la box et l'autre pied dans le vide au bord.","Stabilise-toi sur la boîte avec le pied posé dessus, tout en gardant l'autre pied décollé du sol.","Maintiens cette position pendant quelques secondes, en engageant tes mollets pour garder l'équilibre.","Descends lentement avec le pied posé sur la boîte, en revenant à la position de départ.","Répète l'exercice avec l'autre jambe."],["Commence en position de planche haute, les mains directement sous les épaules et le corps bien aligné.","Gaine ta sangle abdominale et lève ton pied droit du sol, en amenant ton genou droit vers ton coude gauche.","Ramène ton pied droit à la position de départ et répète le mouvement en amenant ton pied gauche vers ton coude droit.","Continue à alterner les côtés en te déplaçant à un rythme contrôlé.","Garde tes hanches à niveau et évite de les lever trop haut ou de les laisser trop s'affaisser.","Maintiens une respiration régulière pendant tout l'exercice.","Répète le nombre de répétitions souhaité."],["Commence en position debout, les pieds écartés à la largeur des épaules.","Abaisse ton corps en position de squat en fléchissant tes genoux et en plaçant tes mains sur le sol devant toi.","Renvoie tes pieds vers l'arrière en position de pompe.","Effectue une pompe, en gardant ton corps aligné.","Ramène tes pieds en sautant en position de squat.","Saute vers le haut de manière explosive, en tendant les bras au-dessus de ta tête.","Atterris en douceur et redescends immédiatement en position de squat pour commencer la répétition suivante."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains le long de ton corps, les paumes tournées vers le bas.","En gainant tes abdominaux, soulève tes jambes du sol, en amenant tes genoux vers ta poitrine.","En haut du mouvement, contracte tes abdominaux et marque une pause.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Fléchis tes genoux et joins les plantes de tes pieds en laissant tes genoux tomber sur les côtés.","Tiens tes chevilles ou tes pieds avec tes mains.","Assieds-toi bien droit et allonge ta colonne vertébrale.","Appuie doucement tes genoux vers le sol, en sentant un étirement dans l'intérieur de tes cuisses.","Maintiens cette position pendant quelques respirations.","Pour relâcher, ramène lentement tes genoux vers le haut et tends tes jambes."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et saisis les poignées de la machine à câble en prise pronation.","Positionne tes mains à hauteur des épaules, les paumes tournées vers l'avant.","Garde ta sangle abdominale gainée et le dos droit.","Pousse une poignée vers le haut et vers l'avant jusqu'à ce que ton bras soit complètement tendu.","Marque une pause en haut, puis abaisse lentement la poignée pour revenir à la position de départ.","Répète avec l'autre bras.","Alterne les bras pour le nombre de répétitions souhaité."],["Tiens-toi face à la machine à câble, les pieds écartés à la largeur des épaules.","Tiens la poignée de câble de la main droite et lève ton bras de sorte que le haut de ton bras soit parallèle au sol et que ton coude soit fléchi à un angle de 90 degrés.","Garde le haut du bras immobile et étends ton avant-bras vers l'arrière, en tendant complètement ton bras.","Marque une pause, puis reviens lentement à la position de départ.","Répète avec ton bras gauche.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Règle la machine à câble de sorte que la sangle de cheville soit au réglage le plus bas.","Allonge-toi face vers le bas sur le banc, les jambes tendues et l'accessoire de cheville fixé à tes chevilles.","Tiens-toi aux poignées du banc pour la stabilité.","En gardant le haut de ton corps immobile, expire et fléchis tes jambes vers tes fessiers en pliant tes genoux.","Marque une pause en haut du mouvement, en contractant tes ischio-jambiers.","Inspire et abaisse lentement tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la poulie du câble en position haute et attache une barre droite.","Assieds-toi face à la machine à câble, les pieds à plat sur le sol et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Penche-toi légèrement en arrière et garde la poitrine ouverte, en maintenant une légère cambrure dans le bas du dos.","Tire la barre vers ta poitrine, en menant avec tes coudes et en contractant tes omoplates.","Marque une pause en bas du mouvement, puis ramène lentement la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble à hauteur de la poitrine et attache les poignées.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Saisis les poignées avec une prise en pronation et avance pour créer de la tension dans les câbles.","Positionne tes pieds fermement sur le sol et gaine ta sangle abdominale.","Plie tes coudes et amène tes mains à hauteur des épaules en gardant tes coudes à un angle de 90 degrés.","Pousse les poignées vers l'avant en tendant complètement tes bras devant toi.","Marque une pause, puis inverse lentement le mouvement en ramenant tes mains à la hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à poulie basse.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en supination, les mains écartées à la largeur des épaules.","Garde tes coudes près de tes flancs et le haut de tes bras immobile tout au long de l'exercice.","Expire et remonte la barre vers tes épaules, en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc ou une chaise, les pieds à plat sur le sol et les genoux légèrement fléchis.","Tiens la poignée de câble en prise supination et appuie ton coude contre l'intérieur de ta cuisse.","En gardant le haut du bras immobile, expire et fléchis la poignée du câble vers ton épaule en contractant tes biceps.","Marque une pause en haut du mouvement, puis inspire et abaisse lentement la poignée du câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Assieds-toi sur un banc ou une chaise, les genoux fléchis et les pieds à plat sur le sol.","Tiens la poignée de câble de la main droite et place ton coude sur l'intérieur de ton genou droit.","Étends complètement ton bras, en gardant ton coude immobile et près de ton genou.","Marque une pause en haut, puis abaisse lentement ton bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Fixe une poignée de câble de chaque côté d'une machine à câble à hauteur des épaules.","Tiens-toi au milieu de la machine, les pieds écartés à la largeur des épaules.","Saisis les poignées avec une prise en pronation et recule pour créer de la tension dans les câbles.","Penche-toi légèrement en avant à partir des hanches, en gardant le dos droit et la poitrine ouverte.","Tire les poignées vers le bas et en travers de ton corps en contractant tes omoplates l'une vers l'autre.","Marque une pause en bas du mouvement, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une poignée en D à chaque poulie basse du câble et tiens-toi au milieu de la machine à câbles croisés.","Saisis les poignées avec une prise pronation (paumes tournées vers le bas) et fais un pas en avant, en plaçant tes pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et penche-toi vers l'avant au niveau de la taille en gardant le dos droit et tes abdominaux gainés.","Les bras tendus sur les côtés et légèrement fléchis aux coudes, expire et contracte tes omoplates en tirant les câbles vers l'arrière et vers le haut dans un mouvement d'oiseau inversé.","Marque une pause au sommet de la contraction, puis inspire et reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle les poulies du câble à hauteur de la poitrine.","Tiens-toi au centre de la machine à câble, un pied devant l'autre.","Saisis les poignées avec les paumes tournées vers le bas et les bras étendus sur les côtés.","Fais un pas en avant, en gardant les bras légèrement fléchis.","Avec une légère flexion dans tes coudes, ramène tes mains l'une contre l'autre devant ta poitrine.","Marque une pause, puis ramène lentement tes bras à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à la machine à câble, les pieds écartés à la largeur des épaules.","Saisis la poignée du câble avec une prise en supination, les paumes tournées vers le haut.","Garde tes coudes près de tes flancs et le haut de tes bras immobile.","Expire et remonte l'accessoire du câble vers tes épaules, en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement l'accessoire du câble jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à la machine à câble, les pieds écartés à la largeur des épaules.","Fléchis les hanches et les genoux en abaissant ton torse jusqu'à ce que ton dos soit parallèle au sol.","Saisis les poignées du câble avec une prise en pronation, en gardant tes bras tendus et tes épaules en arrière.","Contracte tes fessiers et tes ischio-jambiers pour soulever les poignées du câble, en étendant les hanches et en te redressant.","Marque une pause en haut, puis abaisse lentement les poignées du câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble en position déclinée.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Tiens les poignées, les paumes tournées vers l'avant et les bras étendus droit devant toi.","En gardant une légère flexion des coudes, ouvre les bras sur les côtés dans un mouvement contrôlé.","Marque une pause en position complètement étendue, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble en position déclinée.","Tiens-toi dos à la machine et attrape la poignée d'une main.","Positionne-toi le dos contre le banc décliné et ton bras tendu droit devant toi.","Plie ton coude et abaisse la poignée vers ta poitrine tout en gardant le haut de ton bras immobile.","Marque une pause en bas, puis pousse la poignée vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Règle la machine à câble en position déclinée.","Assieds-toi sur le banc décliné face à la machine à câble.","Saisis les poignées avec une prise en pronation et place-les à hauteur de la poitrine.","Garde tes pieds à plat sur le sol et ton dos fermement contre le banc.","Expire et pousse les poignées loin de ton corps, en tendant complètement tes bras.","Marque une pause à la fin du mouvement, en contractant tes muscles pectoraux.","Inspire et ramène lentement les poignées à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur le banc décliné face à la machine à câble, les pieds bien placés sur les repose-pieds.","Saisis la poignée du câble avec une prise large en pronation, les paumes tournées vers le bas.","Penche-toi légèrement en arrière, en gardant le dos droit et la sangle abdominale gainée.","Tire le câble vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause au sommet de la contraction, puis relâche lentement le câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à une machine à câble, les pieds écartés à la largeur des épaules.","Saisis la poignée du câble avec une prise en supination, les paumes tournées vers le haut et les bras complètement tendus.","En gardant le haut des bras immobile, expire et fléchis l'accessoire du câble vers tes épaules en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement l'accessoire du câble jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues et le dos droit.","Fixe une poignée de câble à une poulie basse et place la machine à câble derrière toi.","Saisis la poignée avec une prise large en pronation, les paumes tournées vers le bas.","Penche-toi légèrement en arrière, en gardant le dos droit et la poitrine relevée.","Tire la poignée vers ta taille en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut du mouvement, puis relâche lentement la poignée pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens la poignée de câble en prise pronation, les paumes tournées vers le bas et les bras complètement étendus devant toi.","En gardant les bras tendus, lève la poignée du câble à hauteur d'épaule.","Marque une pause en haut, puis abaisse lentement la poignée du câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et saisis la poignée du câble en prise pronation.","Garde le dos droit et ta sangle abdominale gainée.","Lève la poignée du câble devant toi en gardant tes bras tendus et tes paumes tournées vers le bas.","Continue à soulever jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement la poignée du câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et saisis la poignée du câble en prise pronation.","Garde le dos droit et ta sangle abdominale gainée.","Lève la poignée du câble devant toi en gardant tes bras tendus et tes paumes tournées vers le bas.","Continue à soulever jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement la poignée du câble pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout bien droit, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tiens l'accessoire corde du câble en prise supination, les paumes tournées l'une vers l'autre et les bras complètement étendus.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever la corde attachée au câble jusqu'à ce que tes biceps soient complètement contractés et que la corde soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser la corde du câble jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une corde à une poulie haute et tiens-toi dos à la machine.","Saisis la corde des deux mains et étends les bras au-dessus de ta tête.","Garde tes coudes près de ta tête et le haut de tes bras immobile.","Abaisse lentement la corde derrière ta tête en fléchissant les coudes.","Marque une pause, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à hauteur de la poitrine.","Mets-toi à genoux devant la machine à câble et saisis la barre en prise pronation, les mains écartées à la largeur des épaules.","Assieds-toi sur tes talons, en gardant ton dos droit et ta sangle abdominale gainée.","Tire la barre vers le haut de ton abdomen, en contractant tes omoplates.","Marque une pause en haut du mouvement, puis relâche lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe la sangle de cheville à ta cheville et tiens-toi face à la machine à câble.","Positionne-toi suffisamment loin de la machine pour qu'il y ait de la tension sur le câble.","Place tes mains sur la machine pour te soutenir.","En gardant la jambe tendue, déplace lentement ta jambe à travers ton corps vers la ligne médiane.","Marque une pause à la fin du mouvement, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le banc sur une inclinaison de 45 degrés.","Fixe les poignées de câble aux poulies hautes.","Assieds-toi sur le banc face à la machine à câble, les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et amène-les à hauteur des épaules.","Pousse les poignées vers l'avant et vers le haut jusqu'à ce que tes bras soient complètement tendus.","Marque une pause, puis abaisse lentement les poignées jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un banc incliné à un angle de 45 degrés et fixe une poignée de câble à la poulie basse.","Assieds-toi sur le banc face à la machine à câble, les pieds à plat sur le sol et les genoux légèrement fléchis.","Saisis la poignée du câble avec une prise en pronation et étends complètement tes bras devant toi.","Penche-toi en avant à partir des hanches en gardant le dos droit et la sangle abdominale gainée.","Tire la poignée du câble vers ta poitrine en rétractant tes omoplates et en fléchissant tes coudes.","Contracte les muscles de ton dos en haut du mouvement, puis étends lentement les bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble en position basse et attache les poignées.","Assieds-toi sur un banc incliné, le dos contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et étends les bras droit devant toi.","En gardant une légère flexion des coudes, ouvre les bras sur les côtés dans un mouvement contrôlé.","Marque une pause en position complètement étendue, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un ballon de stabilité en position inclinée.","Fixe les poignées de câble aux poulies hautes d'une machine à câble.","Assieds-toi sur le ballon de stabilité, dos à la machine, les pieds fermement ancrés au sol.","Saisis les poignées du câble avec une prise en pronation, les paumes tournées vers l'avant.","Penche-toi légèrement en avant, en gardant le dos droit et la sangle abdominale gainée.","Dans un mouvement contrôlé, écarte tes bras sur les côtés en gardant une légère flexion dans tes coudes.","Continue le mouvement jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à poulie haute.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Penche-toi légèrement en avant et garde le dos droit.","Tire la barre vers tes cuisses en tendant tes coudes.","Marque une pause en bas, puis ramène lentement la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à câble en position poulie basse.","Fixe une barre droite au câble.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation et étends les bras droit au-dessus de la tête.","Penche-toi légèrement en avant, en gardant le dos droit et la sangle abdominale gainée.","Plie tes coudes et abaisse la barre derrière ta tête en gardant le haut de tes bras près de tes oreilles.","Marque une pause, puis étends tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à la machine à câble, les pieds écartés à la largeur des épaules.","Tiens la poignée de câble des deux mains à hauteur de poitrine, les paumes tournées vers le bas.","Gaine ta sangle abdominale et fais pivoter ton torse vers la droite, en tirant le câble à travers ton corps.","En pivotant, fais pivoter ton pied arrière et laisse tes hanches tourner naturellement.","Étends complètement tes bras et termine le mouvement en faisant passer la poignée du câble par-dessus ton épaule.","Reviens à la position de départ en inversant le mouvement, en ramenant ton torse au centre par rotation.","Répète le mouvement du côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi face à une machine à câble, les pieds écartés à la largeur des épaules.","Tiens la poignée de câble de la main droite et recule pour créer de la tension dans le câble.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Garde le haut du bras près du corps et le coude fléchi à un angle de 90 degrés.","Étends ton avant-bras vers l'arrière, en tendant complètement ton bras.","Marque une pause, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Fixe une poignée à corde à une poulie haute et agenouille-toi dos à la machine.","Tiens la poignée corde des deux mains et place-la derrière ta tête, en gardant tes coudes vers les côtés.","En gardant tes hanches immobiles, fléchis ta taille et enroule ton torse vers tes cuisses.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une poignée à corde à une poulie basse et agenouille-toi face à la machine.","Saisis la corde avec une prise neutre (paumes tournées l'une vers l'autre) et étends complètement les bras devant toi.","En gardant le dos droit et la sangle abdominale gainée, tire la corde vers ton corps en rétractant tes omoplates.","Contracte tes omoplates l'une vers l'autre à la fin du mouvement et maintiens une brève pause.","Relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une poignée à corde à une poulie haute et agenouille-toi face à la machine à câble.","Saisis la corde avec une prise neutre (paumes tournées l'une vers l'autre) et amène tes mains sur les côtés de ta tête.","Garde tes coudes près de ta tête et le haut de tes bras immobile tout au long de l'exercice.","Étends tes avant-bras en contractant tes triceps jusqu'à ce que tes bras soient complètement tendus.","Marque une pause, puis reviens lentement à la position de départ en pliant tes coudes.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur la machine de tirage vertical, les genoux placés sous les coussinets.","Saisis la barre du câble avec une prise en pronation, un peu plus large que la largeur des épaules.","Penche-toi légèrement en arrière et garde la poitrine ouverte, en maintenant une légère cambrure dans le bas du dos.","Tire la barre vers le haut de ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une corde à la machine à câble en position haute.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis la corde avec une prise en pronation, les paumes tournées l'une vers l'autre.","Garde le dos droit et penche-toi légèrement vers l'arrière.","Tire la corde vers le bas le long de tes flancs en contractant tes omoplates l'une vers l'autre.","Marque une pause en bas du mouvement.","Relâche lentement la tension et laisse la corde revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur la machine de tirage à la poulie et saisis la barre en V avec une prise en pronation.","Règle la cale-genoux de sorte que tes cuisses soient bien fixées en dessous.","Garde le dos droit et penche-toi légèrement vers l'arrière.","Tire la barre en V vers le bas en direction du haut de ta poitrine en gardant tes coudes près de ton corps.","Contracte les muscles de ton dos en bas du mouvement.","Ramène lentement la barre en V à la position de départ et répète pour le .","Ramène lentement la poignée à la position de départ et répète pour le nombre de répétitions souhaité."],["Règle la machine à câble de sorte que la poulie soit à la position la plus haute.","Assieds-toi face à la machine, les pieds à plat sur le sol et les genoux légèrement fléchis.","Saisis la poignée du câble avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Penche-toi légèrement en arrière, en gardant le dos droit et la poitrine ouverte.","Tire l'accessoire du câble vers ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement le câble jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe un câble à une poulie basse et allonge-toi sur le dos sur un tapis.","Tiens le câble des deux mains et étends tes bras droit vers le plafond.","Fléchis les genoux et lève les jambes en amenant tes cuisses vers ta poitrine.","Tout en gardant le haut de ton corps stable, enroule ton bassin vers ta poitrine en soulevant tes hanches du tapis.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à une machine à câble à poulie basse.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en supination, les mains écartées à la largeur des épaules.","Garde tes coudes près de tes flancs et le haut de tes bras immobile tout au long de l'exercice.","Expire et remonte la barre vers tes épaules, en contractant tes biceps.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ, en tendant complètement les bras.","Répète le nombre de répétitions souhaité."],["Fixe une barre droite à la machine à câble au réglage le plus haut.","Tiens-toi face à la machine à câble, les pieds écartés à la largeur des épaules.
