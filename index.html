<!doctype html>

<head>
<meta charset="utf-8">

<title>Carnet Muscu</title>
<style>
:root{color-scheme:dark;
  --bg:#0f1114;--card:#181b20;--card2:#20242b;--line:#2c313a;
  --text:#eef0f3;--muted:#8d95a3;--accent:#c6f135;--accent-ink:#141a00;
  --danger:#ff6b6b;--ok:#4ade80;--ss:#7dd3fc;--warm:#ffc857;--drop:#c4a4ff;--radius:14px;
  --done-bg:#14251b;--has-bg:#1f2a0c;--has-line:#4a5a1d;--w-bg:#3a2e12;--w-line:#6b5420;--d-bg:#2a1f3d;--d-line:#4b3a78;
}
[data-theme="oled"]{--bg:#000;--card:#0c0c0c;--card2:#171717;--line:#262626}
[data-theme="clair"]{color-scheme:light;--bg:#f3f4f6;--card:#fff;--card2:#eceff3;--line:#d9dde3;--text:#14181f;--muted:#5f6b7a;
  --accent:#1f9d55;--accent-ink:#fff;--danger:#d92d3a;--ok:#16a34a;--ss:#0284c7;--warm:#b45309;--drop:#7c3aed;
  --done-bg:#e3f6ea;--has-bg:#e3f4e9;--has-line:#8fcca6;--w-bg:#fdf0d5;--w-line:#e6c27a;--d-bg:#efe7fd;--d-line:#c4a8f2}
[data-theme="bleu"]{--bg:#0b1220;--card:#121b2e;--card2:#1a2540;--line:#26324d;--muted:#8a98b3;--accent:#4cc9f0;--accent-ink:#00212b;
  --ss:#c4b5fd;--has-bg:#0f2733;--has-line:#245a73}
[data-theme="rouge"]{--bg:#140f10;--card:#1e1517;--card2:#2a1d20;--line:#3b2a2e;--muted:#a3908f;--accent:#ff5a5f;--accent-ink:#2b0204;
  --danger:#ff9f43;--has-bg:#331618;--has-line:#6b2a2d}
[data-theme="violet"]{--bg:#100f16;--card:#181624;--card2:#211e33;--line:#302c47;--muted:#958fae;--accent:#b388ff;--accent-ink:#1a0638;
  --has-bg:#261f3d;--has-line:#4f3f82}
[data-theme="hevy"]{--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--line:#38383a;--muted:#98989f;--accent:#1e88ff;--accent-ink:#fff;--has-bg:#0d2540;--has-line:#1e5aa8}
[data-theme="rose"]{--bg:#130f12;--card:#1d171b;--card2:#291f26;--line:#3b2c36;--muted:#a3929d;--accent:#ff6fae;--accent-ink:#2b0516;--has-bg:#33172a;--has-line:#7a2d55}
[data-theme="menthe"]{--bg:#0c1312;--card:#131d1b;--card2:#1b2826;--line:#283a37;--muted:#8ea39f;--accent:#3ee6b0;--accent-ink:#002a1c;--has-bg:#0f2e25;--has-line:#1f6b53}
[data-theme="or"]{--bg:#12110d;--card:#1c1a14;--card2:#27241b;--line:#3a3628;--muted:#a39c86;--accent:#f5c542;--accent-ink:#2b2000;--has-bg:#33290c;--has-line:#7a6116}
[data-theme="foret"]{--bg:#0e120d;--card:#161c14;--card2:#1f281c;--line:#2e3b2a;--muted:#93a18e;--accent:#7bc96f;--accent-ink:#0b2306;--has-bg:#1b2e17;--has-line:#3f6b37}
[data-theme="orange"]{--bg:#121010;--card:#1c1816;--card2:#272220;--line:#3a332f;--muted:#a39890;--accent:#ff9f1c;--accent-ink:#2b1700;
  --has-bg:#33200a;--has-line:#7a4a0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0;letter-spacing:-.3px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:16px 16px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.ss{border-left:4px solid var(--ss)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exlist{margin:8px 0 12px;padding:0;list-style:none}
.exlist li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.exlist li:last-child{border-bottom:0}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.exlink{border-bottom:1px dotted var(--muted);cursor:pointer}
textarea,input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
textarea.short{min-height:80px;font-family:inherit;font-size:16px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.setrow input{text-align:center;padding:10px 4px}
.setrow.done input{border-color:var(--ok);background:var(--done-bg)}
.nb{position:relative;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--muted);font-weight:700;font-size:15px}
.nb.t-F{color:var(--danger)}
.nb.t-W{background:var(--w-bg);color:var(--warm);border-color:var(--w-line)}
.nb.t-D{background:var(--d-bg);color:var(--drop);border-color:var(--d-line)}
.nb.hasn::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.check{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:20px}
.done .check{background:var(--ok);color:#06210f;border-color:var(--ok)}
.colhead{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.pr{color:var(--accent);font-weight:700}
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;
  background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;
  display:none;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px #0008}
#timer.show{display:flex}
#timer .t{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:#0002;border:0;color:inherit;border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-140%);
  background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;
  transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000a;z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.preview{background:var(--card);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.preview b{color:var(--accent)}
canvas{width:100%;height:210px;display:block}
.stat{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.gap{height:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.main{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
button.chip{cursor:pointer}
.exoimg{position:relative;width:min(100%,340px);aspect-ratio:1/1;background:#fff;border-radius:14px;overflow:hidden;margin:10px auto}
.exoimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.exoimg .fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#555;padding:20px;font-size:14px}
.pkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;margin-bottom:6px}
.pkrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pkh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--card);color:var(--text);
  font-size:14px;position:relative;padding:0}
.cal button.blank{visibility:hidden}
.cal button.has{border-color:var(--has-line);background:var(--has-bg)}
.cal button.has::after{content:'';position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cal button.today{border-color:var(--muted)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal button.sel::after{background:var(--accent-ink)}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar .track{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sug{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--card2);border:1px dashed var(--accent);font-size:13px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid #fff4}
.seg button{font-size:13px}
#back{background:none;border:0;color:var(--text);font-size:24px;padding:0 8px 0 0;line-height:1;cursor:pointer}
#hdr{display:flex;align-items:center;gap:8px}
.hbtn{background:none;border:0;color:var(--text);font-size:22px;padding:2px 4px;cursor:pointer}
.th{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:var(--s);height:var(--s);border-radius:50%;background:#fff;overflow:hidden;border:1px solid var(--line)}
.th::before{content:'🏋️';font-size:calc(var(--s) * .42)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.btn.big{padding:16px;font-size:16px;text-align:left}
.btn.ghost{background:none;border-color:transparent}
.rcard{cursor:pointer}
.fhead{padding:8px 0;cursor:pointer;user-select:none}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;padding:4px 0;cursor:pointer}
.exlink.acc{color:var(--accent);border-bottom:0;font-weight:700;font-size:16px}
.rex{padding:14px 0;border-bottom:1px solid var(--line)}
.rex.ssl{border-left:3px solid var(--ss);padding-left:10px}
.stbl{width:100%;border-collapse:collapse;font-size:15px}
.stbl th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:6px 10px;letter-spacing:.4px}
.stbl td{padding:9px 10px}
.stbl tbody tr:nth-child(odd){background:var(--card2)}
.stbl td:first-child,.stbl th:first-child{width:64px}
.tinput{font-size:20px;font-weight:700;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.ninput{margin-top:8px;font-size:14px;background:none;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:6px 0}
.setrow.c3,.colhead.c3{grid-template-columns:40px 1fr 1fr 44px}
.menu .btn{margin-bottom:8px;text-align:left}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:0 0 auto}
.tile{padding:16px 12px;text-align:left;font-size:15px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;margin-bottom:8px;font-size:15px;cursor:pointer}
.mic{font-size:22px;width:30px;text-align:center}
.gifbig{width:min(70vw,240px);aspect-ratio:1/1;border-radius:14px;background:#fff;object-fit:contain}
.calhead{gap:8px}
.calhead>div{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:14px}
.wd7{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:3;background:var(--bg);margin:0;padding:6px 0}
.mtitle{margin:16px 0 6px;text-transform:capitalize;font-size:17px}
.cal2{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px}
.cday{background:none;border:0;color:var(--text);padding:4px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;min-width:0}
.cday .dn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.cday.has .dn{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cday.today .dn{box-shadow:inset 0 0 0 1.5px var(--accent)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.wday{background:var(--card2);border-radius:8px;padding:6px 2px;text-align:center;font-size:11px;min-width:0}
.wday b{display:block;font-size:11px;color:var(--muted);font-weight:600}
.wday span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.wday.on{background:var(--accent);color:var(--accent-ink)}
.wday.on b{color:var(--accent-ink)}
.card.today{border-color:var(--accent)}
.reo{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);background:var(--bg)}
.reo{transition:none;will-change:transform}
.reo.dragging{background:var(--card2);box-shadow:0 10px 28px #000a;border-radius:12px;position:relative;z-index:5;opacity:.97}
.reon{flex:1;min-width:0}
.handle{font-size:26px;color:var(--muted);padding:4px 10px;touch-action:none;cursor:grab;user-select:none}
.reodel{width:28px;height:28px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-weight:800;font-size:18px;line-height:1;flex:0 0 auto}
.ssrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:12px 4px;text-align:left;font-size:16px;cursor:pointer}
.ssrow:disabled{opacity:1;cursor:default}
.ssbar{width:5px;height:34px;border-radius:3px;flex:0 0 auto}
.ssb{display:inline-block;background:var(--ss);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;margin-top:8px}
.setrow.w5,.colhead.w5{grid-template-columns:34px 64px 1fr 1fr 46px;gap:6px}
.prev{background:none;border:0;color:var(--muted);font-size:13px;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.check.run{background:var(--warm);color:#1a1200;border-color:var(--warm);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.rng{display:flex;align-items:center;gap:4px;min-width:0}
.rng input{min-width:0;padding:10px 2px;text-align:center}
.rng span{color:var(--muted);font-size:13px}
.setrow.c3,.colhead.c3{grid-template-columns:40px .9fr 1.5fr 40px}
.pltviz{display:flex;align-items:center;gap:3px;min-height:116px;padding:4px 0}
.pltviz .sleeve{width:34px;height:12px;background:var(--muted);border-radius:3px}
.plate{width:24px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg)}
.rirs{display:flex;gap:6px;flex-wrap:wrap}
.rirs .btn{min-width:44px}
.chrono{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:15px}
.cday .dl{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
</style>
</head>
<body>
<header><button id="back" data-act="back" aria-label="Retour" style="visibility:hidden">←</button><h1 id="title">Carnet Muscu</h1><div id="hdr"></div></header>
<main id="app"></main>
<div id="timer"><span>Repos <span class="t" id="tval">0:00</span></span>
  <span class="row"><button data-act="timer-add">+30 s</button><button data-act="timer-stop">Passer</button></span></div>
<nav id="nav">
  <button data-tab="train"><span class="ic">🏋️</span>Entraînement</button>
  <button data-tab="profile"><span class="ic">👤</span>Profil</button>
</nav>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json,.csv,text/csv" hidden>

<script>
'use strict';

const FR = [["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus vers le bas le long du corps.","En gardant le dos droit et ta sangle abdominale gainée, penche lentement ton torse sur un côté, en abaissant ta main vers ton genou.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les mains placées derrière la tête.","Décolle tes jambes du sol et fléchis tes genoux à un angle de 90 degrés.","Amène ton coude droit vers ton genou gauche tout en tendant simultanément ta jambe droite.","Reviens à la position de départ et répète le mouvement du côté opposé, en amenant ton coude gauche vers ton genou droit tout en tendant ta jambe gauche.","Continue à alterner les côtés dans un mouvement de pédalage pour le nombre de répétitions souhaité."],["Commence à quatre pattes, les mains directement sous les épaules et les genoux directement sous les hanches.","Étends une jambe droit vers l'arrière, en gardant ton genou fléchi et ton pied en flexion.","Abaisse lentement tes hanches vers le sol, en ressentant un étirement dans tes quadriceps.","Maintiens cette position pendant 20 à 30 secondes.","Change de jambe et répète l'étirement de l'autre côté."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Étends les bras droit sur les côtés, parallèles au sol.","En gainant tes abdominaux, soulève tes épaules du sol et amène ta main droite vers ton talon droit.","Reviens à la position de départ et répète du côté gauche, en tendant ta main gauche vers ton talon gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi sur la machine à câble, le dos droit et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Penche-toi légèrement en arrière et tire les poignées vers ta poitrine, en contractant tes omoplates.","Marque une pause au sommet du mouvement, puis relâche lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Décolle une jambe du sol et fais tourner ta cheville en cercle.","Effectue le nombre de cercles souhaité dans une direction, puis change de direction.","Répète avec l'autre jambe."],["Commence suspendu à une barre de traction en prise pronation, légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et tire tes omoplates vers le bas et l'arrière.","En te hissant vers le haut, plie un bras et amène ton coude vers ton côté tout en gardant l'autre bras tendu.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre et que ton bras fléchi soit complètement contracté.","Redescends de manière contrôlée, en tendant le bras fléchi et en répétant le mouvement de l'autre côté.","Alterne les côtés à chaque répétition."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules.","Étends un bras droit sur le côté, parallèle au sol.","Abaisse ton corps en fléchissant tes coudes, en gardant ton dos droit et ta sangle abdominale gainée.","Repousse-toi vers la position de départ.","Répète de l'autre côté en étendant le bras opposé sur le côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les genoux fléchis à un angle de 90 degrés.","Gaine ta sangle abdominale et lève tes genoux vers ta poitrine, en les amenant aussi près que possible de tes coudes.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les jambes tendues vers le bas.","Gaine ta sangle abdominale et lève tes jambes devant toi jusqu'à ce qu'elles soient parallèles au sol.","Maintiens un moment en haut, puis abaisse lentement tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus sur les côtés.","En gardant les jambes tendues, penche-toi vers l'avant au niveau de la taille et tends la main droite vers tes orteils.","En te penchant vers le bas, soulève simultanément ta jambe gauche tendue derrière toi en gardant l'équilibre.","Reviens à la position de départ et répète le mouvement en tendant ta main gauche vers tes orteils et en levant ta jambe droite derrière toi.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Étends tes bras au-dessus de la tête, en les gardant tendus.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse soit à la verticale.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à la hauteur souhaitée et cale tes genoux sur le coussin.","Saisis les poignées avec les paumes tournées vers le bas et les bras complètement étendus.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis repousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine tes muscles abdominaux et amène tes genoux vers ta poitrine, en fléchissant les hanches et les genoux.","Marque une pause en haut du mouvement, en contractant tes abdominaux.","Abaisse lentement tes jambes vers la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes genoux vers ta poitrine, en gardant tes jambes jointes.","Une fois tes genoux à hauteur de poitrine, projette tes jambes vers le sol de manière explosive, en les tendant complètement.","Laisse tes jambes revenir en balancier vers le haut et répète le mouvement pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues.","Plie un genou et place ton pied à plat sur le sol.","Avec tes mains ou une serviette, tire doucement tes orteils vers ton corps, en sentant un étirement dans ton mollet.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche l'étirement et répète avec l'autre jambe."],["Allonge-toi sur le dos, les jambes tendues.","Fléchis ton genou droit et pose ta cheville droite sur ta cuisse gauche, juste au-dessus du genou.","Saisis ta cuisse gauche des deux mains et tire-la doucement vers ta poitrine.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche et répète de l'autre côté."],["Allonge-toi sur le dos, les jambes tendues.","Fléchis ton genou droit et pose ta cheville droite sur ta cuisse gauche, juste au-dessus du genou.","Saisis ta cuisse gauche des deux mains et tire-la doucement vers ta poitrine.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche l'étirement et répète de l'autre côté."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Place tes mains sous tes fessiers pour te soutenir.","Gaine tes abdominaux et lève tes jambes du sol, en les gardant droites.","Tout en gardant tes jambes serrées, abaisse-les d'un côté jusqu'à quelques centimètres au-dessus du sol.","Marque une pause, puis relève tes jambes à la position de départ.","Répète le mouvement de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Place tes mains sous tes fessiers pour te soutenir.","Gaine ta sangle abdominale et lève tes jambes du sol, en les gardant droites.","Lève tes jambes jusqu'à ce qu'elles soient perpendiculaires au sol.","Redescends tes jambes jusqu'à la position de départ.","Simultanément, projette tes jambes vers le sol, en les gardant tendues.","Remonte tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les genoux fléchis et les pieds à plat sur le sol.","Tiens le médecine-ball des deux mains devant ta poitrine.","Penche-toi légèrement en arrière, en engageant tes abdominaux et en gardant le dos droit.","Tourne lentement ton torse vers la droite, en amenant le médecine-ball vers le côté droit de ton corps.","Marque une pause, puis fais pivoter ton torse vers la gauche, en amenant le médecine-ball vers le côté gauche de ton corps.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Règle la machine au poids et à la hauteur souhaités.","Place tes mains sur les barres parallèles avec une prise serrée, les paumes tournées l'une vers l'autre.","Suspends-toi aux barres, les bras complètement étendus et les pieds décollés du sol.","Sollicite les muscles de ton dos et tire ton corps vers les barres, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus des barres.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas sur un tapis ou un banc, les jambes entièrement tendues.","Fais-toi aider par un partenaire ou utilise un élastique pour maintenir tes chevilles.","Contracte tes ischio-jambiers et amène tes jambes vers tes fessiers, en gardant les genoux tendus.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi face vers le bas au sol, les jambes tendues.","Fléchis ton genou gauche et attrape ton pied ou ta cheville gauche en tendant ta main gauche vers l'arrière.","Tire doucement ton pied gauche vers tes fessiers, en sentant un étirement dans ton quadriceps gauche.","Maintiens l'étirement pendant 20 à 30 secondes, puis relâche.","Répète avec ta jambe droite."],["Allonge-toi face vers le bas au sol, les jambes droites.","Fléchis ton genou droit et attrape ton pied ou ta cheville droite en tendant ta main droite vers l'arrière.","Tire doucement ton pied ou ta cheville droite vers tes fessiers, en sentant un étirement à l'avant de ta cuisse droite.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche et répète de l'autre côté."],["Règle la machine aux réglages de poids et de hauteur souhaités.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Suspends-toi, les bras complètement étendus et les pieds décollés du sol.","Sollicite les muscles de ton dos et tire ton corps vers les poignées, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus des poignées.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens un ballon de stabilité des deux mains et étends tes bras droit devant toi.","Abaisse lentement le ballon de stabilité vers ta poitrine, en ressentant un étirement dans tes muscles pectoraux.","Maintiens l'étirement pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et superposées l'une sur l'autre.","Fléchis légèrement ta jambe inférieure pour plus de stabilité.","Place ton pied supérieur sur une surface stable, comme un banc ou un step.","En gardant ta jambe supérieure tendue, abaisse-la lentement vers le sol, en ressentant un étirement à l'intérieur de ta cuisse.","Maintiens l'étirement pendant 20 à 30 secondes.","Reviens à la position de départ et répète de l'autre côté."],["Assieds-toi au bord d'un banc ou demande à quelqu'un de maintenir tes pieds au sol.","Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine au niveau d'assistance souhaité.","Tiens-toi sur la plateforme pour les pieds et saisis les poignées en prise pronation, légèrement plus écartées que la largeur des épaules.","Garde la poitrine relevée et les épaules en arrière, gaine ta sangle abdominale et fléchis légèrement tes genoux.","Tire ton corps vers le haut en fléchissant tes coudes et en les entraînant vers le bas le long de tes flancs.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine aux réglages de poids et de hauteur souhaités.","Tiens-toi face à la machine, les pieds écartés à la largeur des épaules.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Contracte tes grands dorsaux et tes biceps, et hisse-toi vers les poignées.","Marque une pause en haut, en contractant les muscles de ton dos.","Abaisse-toi lentement vers la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une serviette à deux mains derrière ta tête.","Garde tes coudes près de tes oreilles et le haut de tes bras immobile.","Étends lentement tes avant-bras vers le haut, en contractant tes triceps au sommet.","Marque une pause, puis abaisse lentement la serviette jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine au poids et à la hauteur souhaités.","Mets-toi à genoux sur le coussinet face à la machine, les mains agrippant les poignées.","Abaisse ton corps en fléchissant tes coudes, en gardant ton dos droit et près de la machine.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine à la hauteur souhaitée et cale tes genoux sur le coussin.","Saisis les poignées avec une prise large et garde les coudes légèrement fléchis.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Repousse-toi vers le haut jusqu'à la position de départ en étendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps en position accroupie.","Saute vers le haut de manière explosive, en étendant tes jambes et tes bras.","En l'air, écarte les jambes et tends les bras sur les côtés.","Atterris en douceur avec les pieds écartés à la largeur des épaules, en fléchissant les genoux pour absorber l'impact.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Avance le pied droit, en fléchissant le genou et en abaissant ton corps en position de fente.","Pousse sur ton pied droit et recule vers la position de départ.","Répète le mouvement avec ton pied gauche, en alternant les jambes à chaque pas.","Continue à faire des pas d'avant en arrière, en maintenant un rythme régulier.","Répète pendant la durée souhaitée ou le nombre de répétitions souhaité."],["Place le ballon de stabilité au sol et allonge-toi face contre lui, tes hanches reposant sur le ballon et tes pieds contre un mur ou une autre surface stable.","Positionne tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en étendant ton dos jusqu'à ce que ton corps forme une ligne droite de la tête aux talons.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et tire tes omoplates vers le bas et l'arrière.","Fléchis les genoux et ramène-les vers ta poitrine.","Soulève lentement tes jambes, en les gardant tendues, jusqu'à ce que ton corps soit parallèle au sol.","Maintiens cette position pendant quelques secondes, puis abaisse lentement tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Étends les bras droit devant toi, parallèles au sol.","Croise tes bras devant ton corps, le bras droit par-dessus le bras gauche.","Entrelace tes doigts et tourne tes paumes vers l'extérieur, à l'opposé de ton corps.","Soulève lentement tes bras vers le haut et loin de ton corps, en ressentant un étirement dans ton dos et ta poitrine.","Maintiens l'étirement pendant 15 à 30 secondes, puis relâche.","Répète du côté opposé."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et saute vers l'arrière en poussant avec les deux pieds.","Atterris en douceur sur la pointe des pieds, en fléchissant les genoux pour absorber l'impact.","Répète le nombre de répétitions souhaité."],["Place la planche d'équilibre sur une surface plane.","Monte sur la planche d'équilibre avec un pied, en veillant à ce qu'il soit bien centré.","Déplace lentement ton poids sur le pied posé sur la planche d'équilibre, en gardant ta sangle abdominale gainée.","Maintiens ton équilibre et ta stabilité en tenant la position pendant la durée souhaitée.","Répète l'exercice avec l'autre pied."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique en prise supination, paumes tournées vers le haut.","Garde tes coudes près de tes flancs et enroule lentement un bras vers ton épaule, en contractant ton biceps en haut.","Abaisse le bras jusqu'à la position de départ et répète avec l'autre bras.","Continue à alterner les bras pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras tendus au-dessus de la tête, en tenant l'élastique.","Gaine tes abdominaux et lève tes jambes et ton haut du corps du sol simultanément, en tendant tes mains vers tes orteils.","En redescendant tes jambes et le haut de ton corps, change la position de tes jambes en les croisant l'une sur l'autre.","Répète le mouvement en alternant la position de tes jambes à chaque répétition.","Continue pour le nombre de répétitions souhaité."],["Fixe l'élastique à une barre de traction ou à un point d'ancrage solide.","Monte sur l'élastique et saisis la barre les paumes tournées vers l'extérieur, les mains un peu plus écartées que la largeur des épaules.","Suspends-toi, les bras complètement étendus, en gardant la sangle abdominale gainée et les épaules basses et en arrière.","Tire ton corps vers le haut en direction de la barre en contractant tes omoplates l'une vers l'autre et en entraînant tes coudes vers le bas en direction de tes hanches.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre, puis abaisse-toi lentement jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Mets-toi à genoux au sol et tiens les poignées de l'élastique des deux mains, paumes tournées vers le bas.","Place l'élastique au sol devant toi et positionne tes mains écartées à la largeur des épaules.","Gaine ta sangle abdominale et fais rouler lentement la roue vers l'avant, en étendant ton corps aussi loin que possible tout en gardant le contrôle.","Marque une pause au point le plus éloigné, puis fais rouler lentement la roue vers tes genoux pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis les poignées de l'élastique avec une prise en pronation, un peu plus large que la largeur des épaules.","Étends complètement tes bras, en poussant les élastiques loin de ta poitrine.","Abaisse lentement les élastiques vers ta poitrine, en gardant tes coudes à un angle de 90 degrés.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide à hauteur des chevilles.","Tiens-toi dos au point d'ancrage, les pieds écartés à la largeur des épaules.","Recule pour créer de la tension dans l'élastique, en gardant les genoux légèrement fléchis.","Bascule au niveau des hanches et penche-toi en avant, en maintenant une colonne neutre.","Étends ta jambe droite vers l'arrière, en contractant tes fessiers en haut.","Repose ta jambe droite et répète avec la jambe gauche.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les mains derrière la tête et les genoux fléchis.","Décolle tes pieds du sol et amène ton genou droit vers ta poitrine tout en tournant simultanément ton torse pour amener ton coude gauche vers ton genou droit.","Tends la jambe droite tout en ramenant le genou gauche vers ta poitrine et en faisant pivoter ton torse pour amener le coude droit vers le genou gauche.","Continue à alterner le mouvement de torsion, comme si tu pédalais à vélo, tout en gardant ta sangle abdominale gainée pendant tout le mouvement.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage haut, comme une barre de traction ou une poutre solide.","Tiens-toi face au point d'ancrage et attrape l'élastique en prise supination, les mains écartées à la largeur des épaules.","Recule pour créer de la tension dans l'élastique, en gardant les pieds écartés à la largeur des hanches.","Gaine ta sangle abdominale et garde ton dos droit pendant que tu tires l'élastique vers le bas en direction de ta poitrine, en rapprochant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement l'élastique jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Place un élastique autour de tes bras, juste au-dessus des coudes.","Prends une position de pompes, tes mains directement sous tes épaules et ton corps aligné de la tête aux talons.","Plie tes coudes et abaisse ta poitrine vers le sol en gardant tes coudes près de tes côtés.","Pousse à travers tes paumes pour étendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc ou une chaise, les jambes écartées et les pieds à plat sur le sol.","Tiens une extrémité de l'élastique dans ta main et pose le pied du même côté sur l'autre extrémité.","Penche-toi légèrement en avant et pose ton coude sur l'intérieur de ta cuisse, juste au-dessus du genou.","La paume tournée vers le haut, fléchis lentement ta main vers ton épaule en gardant le haut de ton bras immobile.","Marque une pause en haut, puis abaisse lentement ta main pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Fixe l'élastique à un point fixe au-dessus de toi, comme une barre de traction ou une poutre solide.","Assieds-toi sur un banc ou une chaise face à l'élastique, les pieds à plat sur le sol et les genoux fléchis.","Saisis l'élastique avec une prise serrée, les paumes tournées vers toi.","Garde le dos droit et gaine ta sangle abdominale.","Tire l'élastique vers ta poitrine, en contractant tes omoplates.","Marque une pause en bas du mouvement, en ressentant la contraction dans tes grands dorsaux.","Relâche lentement l'élastique pour revenir à la position de départ, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide au-dessus de ta tête.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","Saisis l'élastique avec une prise en supination, les mains un peu plus larges que la largeur des épaules.","Recule pour créer de la tension dans l'élastique, en gardant les bras complètement tendus.","Gaine ta sangle abdominale et resserre tes omoplates.","Tire l'élastique vers ta poitrine, en menant avec tes coudes.","Marque une pause en bas du mouvement, en ressentant la contraction dans tes grands dorsaux.","Relâche lentement la tension de l'élastique et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique devant tes cuisses, paumes tournées vers le bas.","Garde tes bras tendus et lève l'élastique devant toi jusqu'à ce que tes bras soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement l'élastique pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique devant tes cuisses, paumes tournées vers le bas.","Garde tes bras tendus et lève-les lentement vers l'avant jusqu'à ce qu'ils soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place un élastique juste au-dessus de tes genoux.","Contracte tes fessiers et tes muscles abdominaux.","Presse tes talons dans le sol et soulève tes hanches du sol, en contractant tes fessiers en haut.","Marque une pause en haut, puis abaisse lentement tes hanches pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide à hauteur de la taille.","Tiens-toi perpendiculaire au point d'ancrage, les pieds écartés à la largeur des épaules.","Saisis la poignée de l'élastique avec les deux mains et éloigne-toi du point d'ancrage pour créer de la tension dans l'élastique.","Amène tes mains vers ta poitrine en gardant tes coudes fléchis et proches de ton corps.","Gaine ta sangle abdominale et maintiens une posture stable.","Étends les bras droit devant toi, en poussant l'élastique loin de ton corps.","Maintiens la position étendue pendant quelques secondes, en te concentrant sur le maintien de la tension dans ta sangle abdominale.","Ramène lentement tes mains vers ta poitrine, en résistant à la traction de l'élastique.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras tendus au-dessus de la tête, en tenant l'élastique.","Gaine tes abdominaux et lève tes jambes et ton haut du corps simultanément, en amenant tes mains vers tes pieds.","Marque une pause en haut, puis abaisse lentement tes jambes et le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide au-dessus de ta tête.","Mets-toi à genoux et tiens l'élastique d'une main, paume tournée vers le bas.","Étends complètement ton bras au-dessus de la tête, en gardant le coude légèrement fléchi.","Contracte tes grands dorsaux et tire l'élastique vers le bas le long de ton flanc, en amenant ton coude vers ta cage thoracique.","Marque une pause en bas, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Fixe l'élastique à un point d'ancrage solide à hauteur de la taille.","Mets-toi à genoux dos au point d'ancrage et tiens l'élastique des deux mains, en gardant les coudes fléchis et proches de tes flancs.","Gaine tes abdominaux et fais lentement pivoter ton torse d'un côté, en amenant tes mains vers la hanche opposée.","Marque une pause, puis reviens lentement à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et un élastique passé autour de tes pieds.","Fléchis tes genoux et amène-les vers ta poitrine en gardant tes pieds joints.","Fais pivoter lentement tes genoux vers l'extérieur, en les éloignant l'un de l'autre, tout en gardant les pieds joints.","Marque une pause à la fin de la rotation, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les pieds joints.","Place l'élastique autour de la voûte plantaire de tes pieds et tiens les extrémités de l'élastique avec tes mains.","En gainant tes abdominaux, soulève les deux jambes du sol jusqu'à ce qu'elles soient perpendiculaires au sol.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place une extrémité de l'élastique sous ton pied.","Tiens l'autre extrémité de l'élastique, le bras complètement étendu au-dessus de la tête, la paume tournée vers l'avant.","En gardant le haut du bras immobile, fléchis ton avant-bras vers ton épaule, en contractant tes biceps.","Marque une pause en haut, puis abaisse lentement ton avant-bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de bras."],["Tiens-toi les pieds écartés à la largeur des hanches et place un élastique autour de tes chevilles.","Étends une jambe vers l'avant et pose le dessus de ton pied sur un banc ou une marche derrière toi.","Tiens-toi à un support d'une main pour l'équilibre.","Fléchis ta jambe d'appui et abaisse ton corps en position accroupie en gardant ton genou aligné avec tes orteils.","Pousse à travers ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Fixe l'élastique à un point d'ancrage stable à hauteur de la taille.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","Tiens l'élastique d'une main, la paume tournée vers l'intérieur, et recule pour créer de la tension dans l'élastique.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Tire l'élastique vers ta taille, en contractant tes omoplates.","Marque une pause en haut du mouvement, puis relâche lentement l'élastique pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Fixe l'élastique à un point d'ancrage solide à hauteur de la poitrine.","Tiens-toi debout de côté face au point d'ancrage et attrape l'élastique d'une main.","Éloigne-toi du point d'ancrage pour créer de la tension dans l'élastique.","Positionne tes pieds écartés à la largeur des épaules et fléchis légèrement tes genoux.","Amène ta main qui tient l'élastique en travers de ton corps, vers l'épaule opposée.","Tout en maintenant la tension dans l'élastique, pousse ta main vers l'avant et loin de ton corps en tendant ton bras.","Reviens lentement à la position de départ et répète pour le nombre de répétitions souhaité.","Change de côté et répète l'exercice avec l'autre main."],["Assieds-toi sur un banc ou une chaise, les pieds à plat sur le sol et le dos droit.","Tiens l'élastique d'une main et étends complètement ton bras devant toi.","En gardant le dos droit, tire l'élastique vers ton corps en fléchissant ton coude et en resserrant tes omoplates.","En même temps, pivote ton torse vers le côté du bras qui tire.","Marque une pause en haut, puis relâche lentement la tension dans l'élastique et reviens à la position de départ.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Fixe un élastique à un point d'ancrage solide au niveau du sol.","Tiens-toi dos au point d'ancrage, les pieds écartés à la largeur des épaules.","Avance pour créer de la tension dans l'élastique, en gardant les genoux légèrement fléchis.","Bascule au niveau des hanches et pousse tes fessiers vers l'arrière, en maintenant une légère flexion dans tes genoux.","Abaisse ton torse jusqu'à ce qu'il soit parallèle au sol, en ressentant un étirement dans tes ischio-jambiers.","Pousse tes hanches vers l'avant et contracte tes fessiers pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe solidement l'élastique à un point d'ancrage stable.","Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Tiens l'élastique des deux mains et étends tes bras droit vers le plafond.","En gainant tes abdominaux, soulève lentement le haut de ton corps du sol, en t'enroulant vers l'avant jusqu'à ce que ton torse forme un angle de 45 degrés.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un objet fixe à hauteur de la poitrine.","Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique à deux mains devant toi.","Garde tes bras tendus et lève-les sur les côtés jusqu'à ce qu'ils soient parallèles au sol.","Contracte tes omoplates l'une vers l'autre en haut du mouvement.","Abaisse lentement tes bras vers la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc ou une chaise, les pieds à plat sur le sol.","Tiens l'élastique en prise pronation, les paumes tournées vers le bas, et enroule-le autour de tes doigts.","Pose tes avant-bras sur tes cuisses, les poignets dépassant du bord.","Enroule lentement tes poignets vers le haut, en contractant tes avant-bras.","Marque une pause en haut, puis abaisse lentement tes poignets pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur une chaise ou un banc, le dos droit et les pieds à plat sur le sol.","Place un élastique autour de tes cuisses, juste au-dessus de tes genoux.","Garde les genoux fléchis à un angle de 90 degrés et les pieds écartés à la largeur des épaules.","Contracte tes fessiers et fais pivoter lentement tes genoux vers l'extérieur, en poussant contre la résistance de l'élastique.","Marque une pause à la fin du mouvement, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi et le dos droit.","Enroule l'élastique autour de ta taille et tiens les extrémités des deux mains.","Gaine tes abdominaux et fais lentement pivoter ton torse d'un côté, en gardant ton dos droit et tes pieds au sol.","Marque une pause à la fin de la torsion, puis reviens lentement à la position de départ.","Répète la torsion vers l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique sous tes pieds.","Tiens l'élastique, les paumes tournées vers l'avant, et lève tes mains à hauteur d'épaule, les coudes fléchis.","Pousse l'élastique au-dessus de ta tête, en tendant complètement tes bras.","Marque une pause en haut, puis abaisse lentement l'élastique à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique sous tes pieds, en tenant les extrémités dans tes mains.","Garde tes bras tendus et relâchés, et laisse l'élastique pendre devant tes cuisses.","Contracte tes trapèzes en haussant les épaules vers le haut, en soulevant l'élastique aussi haut que possible.","Maintiens la contraction un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique à deux mains, paumes tournées vers le bas.","Étends les bras droit sur les côtés, en les gardant parallèles au sol.","Fléchis lentement les coudes et ramène tes mains vers tes épaules, en gardant le haut des bras immobile.","Marque une pause, puis étends lentement tes bras jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi les pieds écartés à la largeur des hanches et place l'élastique autour de la pointe de ton pied gauche.","Tiens-toi à un objet stable pour l'équilibre si nécessaire.","Lève lentement le talon gauche du sol, en reportant le poids de ton corps sur la pointe du pied.","Marque une pause en haut, puis abaisse lentement ton talon gauche pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis passe à la jambe droite."],["Tiens-toi les pieds écartés à la largeur des hanches et place l'élastique autour de la pointe de ton pied.","Tiens-toi à un objet stable pour l'équilibre.","Soulève lentement ton talon du sol, en élevant le poids de ton corps sur la pointe du pied.","Marque une pause en haut, puis abaisse lentement ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis passe à l'autre jambe."],["Tiens-toi les pieds écartés à la largeur des hanches et place un élastique autour de tes chevilles.","Fais un grand pas en avant avec le pied droit et un plus petit pas en arrière avec le pied gauche.","Fléchis les genoux et abaisse ton corps jusqu'à ce que ta cuisse droite soit parallèle au sol, en gardant ton genou gauche légèrement au-dessus du sol.","Pousse à travers ton talon droit pour revenir à la position de départ.","Répète de l'autre côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, l'élastique placé juste au-dessus de tes genoux.","En gardant la poitrine relevée et la sangle abdominale gainée, pousse tes hanches vers l'arrière et fléchis tes genoux pour descendre en position de squat.","Assure-toi que tes genoux sont alignés au-dessus de tes orteils et que ton poids repose sur tes talons.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide à hauteur de la taille.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","Tiens les poignées de l'élastique, les paumes tournées l'une vers l'autre et les bras étendus devant toi.","Fléchis les genoux et descends en position accroupie en gardant le dos droit et la poitrine relevée.","Depuis la position de squat, tire les poignées de l'élastique vers ton corps, en resserrant tes omoplates.","Marque une pause en haut, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage solide à hauteur de la taille.","Tiens-toi dos au point d'ancrage, les pieds écartés à la largeur des épaules.","Tiens l'élastique des deux mains et amène-le vers ta poitrine, en gardant tes coudes fléchis et près de ton corps.","Gaine tes abdominaux et enroule-toi lentement vers l'avant, en amenant ta poitrine vers tes genoux.","Marque une pause en haut du crunch, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique sous tes pieds.","Tiens les poignées de l'élastique, les paumes tournées l'une vers l'autre et les bras étendus devant toi.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Tire l'élastique vers ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique autour du haut de ton dos, en le croisant devant ta poitrine.","Tiens les extrémités de l'élastique avec tes mains, en gardant tes coudes fléchis et près de tes côtés.","Gaine tes abdominaux et fais pivoter ton torse d'un côté, en amenant ton coude vers le genou opposé.","Marque une pause, puis reviens à la position de départ.","Répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Place un élastique autour de tes cuisses, juste au-dessus de tes genoux.","Tiens-toi face à une marche ou une plateforme, les pieds écartés à la largeur des hanches.","Monte sur la plateforme avec le pied droit, en poussant sur ton talon.","Étends ta jambe gauche derrière toi, en la gardant tendue.","Repose ton pied gauche au sol.","Répète avec ton pied gauche en montant sur la plateforme.","Continue à alterner les jambes pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique autour de tes chevilles.","Tiens l'élastique des deux mains devant tes cuisses, les paumes tournées vers ton corps.","En gardant le dos droit et ta sangle abdominale gainée, bascule au niveau des hanches et abaisse lentement le haut de ton corps vers le sol.","En descendant, pousse tes hanches vers l'arrière et laisse tes genoux fléchir légèrement.","Abaisse l'élastique vers le sol, en ressentant un étirement dans tes ischio-jambiers.","Marque une pause en bas, puis contracte tes fessiers et tes ischio-jambiers pour relever le haut de ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique autour du haut de tes jambes.","Tiens l'élastique des deux mains devant tes cuisses, les paumes tournées vers ton corps.","En gardant le dos droit et les genoux légèrement fléchis, bascule au niveau des hanches et abaisse l'élastique vers le sol.","Sens l'étirement dans tes ischio-jambiers en abaissant l'élastique.","Contracte tes fessiers et tes ischio-jambiers pour ramener ton corps vers le haut en position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique autour de tes pieds.","Tiens l'élastique des deux mains, les paumes tournées vers ton corps, et garde tes bras tendus.","Gaine ta sangle abdominale et maintiens une légère flexion dans tes genoux.","Bascule lentement vers l'avant au niveau des hanches, en gardant le dos droit et la poitrine relevée.","Abaisse l'élastique vers le sol tout en gardant tes jambes tendues.","Marque une pause en bas, puis contracte tes fessiers et tes ischio-jambiers pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place l'élastique sous tes pieds.","Tiens les poignées de l'élastique à hauteur d'épaule, les paumes tournées vers l'avant.","Gaine ta sangle abdominale et pousse l'élastique au-dessus de ta tête, en étendant complètement tes bras.","En poussant, pivote ton torse d'un côté en gardant tes hanches stables.","Marque une pause en haut, puis reviens à la position de départ.","Répète le développé et la rotation du côté opposé.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et place un élastique sous tes deux pieds.","Tiens les extrémités de l'élastique avec tes mains pour la stabilité.","Lève tes talons du sol aussi haut que possible en utilisant tes mollets.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Fixe l'élastique à un point d'ancrage haut, comme une barre de traction ou une poutre solide.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","Saisis l'élastique avec une prise en supination, les mains un peu plus larges que la largeur des épaules.","Étends complètement tes bras au-dessus de la tête, en gardant tes coudes légèrement fléchis.","Contracte tes grands dorsaux et tire l'élastique vers le bas jusqu'à ta poitrine, en resserrant tes omoplates.","Marque une pause en bas du mouvement, puis relâche lentement la tension et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras tendus au-dessus de la tête, en tenant l'élastique.","En gainant tes abdominaux, soulève simultanément tes jambes et le haut de ton corps du sol, en tendant tes mains vers tes orteils.","Marque une pause en haut, puis abaisse lentement tes jambes et le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et enroule l'élastique autour d'un objet solide à hauteur de poitrine.","Tiens l'élastique des deux mains et éloigne-toi du point d'ancrage, en créant de la tension dans l'élastique.","Positionne-toi perpendiculairement au point d'ancrage, ton côté face à l'élastique.","Étends les bras droit devant toi, en gardant les mains à hauteur de poitrine.","Gaine ta sangle abdominale et pousse l'élastique loin de ta poitrine, en étendant complètement tes bras.","Maintiens la position pendant quelques secondes, puis ramène lentement l'élastique vers ta poitrine.","Répète le nombre de répétitions souhaité, puis change de côté."],["Assieds-toi sur un banc ou une chaise, les pieds à plat sur le sol.","Tiens l'élastique des deux mains, les paumes tournées vers le haut, et pose tes avant-bras sur tes cuisses.","Enroule lentement tes poignets vers le haut, en contractant tes avant-bras.","Marque une pause en haut, puis abaisse lentement tes poignets pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens l'élastique devant tes cuisses, paumes tournées vers l'intérieur.","Garde tes bras tendus et lève-les vers le haut et sur les côtés, en formant un « Y » avec ton corps.","Contracte tes omoplates l'une vers l'autre en haut du mouvement.","Abaisse lentement tes bras vers la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre dans chaque main, les paumes tournées vers l'avant.","Garde le haut des bras immobile et expire en fléchissant les poids tout en contractant tes biceps.","Continue à lever les barres jusqu'à ce que tes biceps soient complètement contractés et que les barres soient à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire pendant que tu commences lentement à abaisser les barres jusqu'à la position de départ.","Répète le nombre de répétitions souhaité en alternant les bras."],["Commence debout, les pieds écartés à la largeur des épaules et la barre posée sur le haut de la poitrine, juste sous la clavicule.","Tiens la barre en prise pronation, en gardant tes coudes hauts et tes bras parallèles au sol.","Abaisse ton corps en position de squat en fléchissant les genoux et les hanches, en gardant ton dos droit et ta poitrine relevée.","Marque une pause en bas du squat, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise en pronation un peu plus large que la largeur des épaules.","Soulève la barre du rack et maintiens-la directement au-dessus de ta poitrine, les bras complètement tendus.","Abaisse lentement la barre vers ta poitrine, en gardant tes coudes serrés.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en étendant tes bras.","Répète le nombre de répétitions souhaité."],["Installe une barre sur un rack à squat à hauteur de poitrine.","Tiens-toi dos au rack, les pieds écartés à la largeur des épaules.","Fléchis les genoux et abaisse ton corps en position accroupie en gardant le dos droit et la poitrine relevée.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et recule, en veillant à ce que tes pieds soient toujours écartés à la largeur des épaules.","Abaisse ton corps en squat, en gardant tes genoux alignés avec tes orteils.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, la tête à une extrémité et les pieds au sol.","Tiens une barre avec une prise à la largeur des épaules et étends les bras droit au-dessus de ta poitrine.","Abaisse la barre derrière ta tête tout en gardant tes bras légèrement fléchis.","Marque une pause, puis ramène la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Penche-toi vers l'avant au niveau des hanches en gardant ton dos droit et ta poitrine haute.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Tire la barre vers le bas de ta poitrine en rétractant tes omoplates et en contractant les muscles de ton dos.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre en prise supination, les paumes tournées vers le haut.","Place le haut de tes bras contre l'arm blaster, en gardant tes coudes près de ton torse.","En gardant le haut des bras immobile, expire et fléchis les poids en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire et commence lentement à abaisser la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et la barre au sol devant toi.","Fléchis les genoux et bascule au niveau des hanches pour descendre et saisir la barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Pousse sur tes talons et étends tes hanches et tes genoux pour soulever la barre du sol, en la gardant près de ton corps.","Lorsque la barre atteint tes cuisses, étends tes hanches de façon explosive, hausse les épaules et tire la barre vers ta poitrine.","Lorsque la barre atteint la hauteur de la poitrine, glisse-toi rapidement en dessous et réceptionne-la à hauteur des épaules, les coudes pointés vers l'avant et les paumes tournées vers le haut.","Depuis la position de réception, développe la barre au-dessus de la tête en tendant tes bras et en poussant la barre droit vers le haut.","Abaisse la barre jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules et la barre posée sur le haut de la poitrine, les coudes pointés vers l'avant.","Abaisse ton corps en fléchissant tes genoux et en poussant tes hanches vers l'arrière, comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le dos droit pendant que tu descends, en veillant à ce que tes genoux ne dépassent pas tes orteils.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour te relever, en tendant tes hanches et tes genoux.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc, les pieds à plat au sol et le dos plaqué contre le banc.","Saisis la barre avec une prise serrée, un peu plus étroite que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes près du corps.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules, et tiens une barre en prise supination, les paumes tournées vers l'avant.","Garde tes coudes près de ton torse et expire pendant que tu enroules les poids en contractant tes biceps.","Continue à lever la barre jusqu'à ce que tes biceps soient complètement contractés et que la barre soit à hauteur d'épaule.","Maintiens la position contractée pendant une brève pause en contractant tes biceps.","Inspire pendant que tu commences lentement à abaisser la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et la barre au sol devant toi.","Fléchis les genoux et bascule au niveau des hanches pour abaisser ton torse et saisir la barre en prise pronation, les mains légèrement plus écartées que la largeur des épaules.","Garde le dos droit et la poitrine relevée pendant que tu pousses sur tes talons pour soulever la barre du sol, en étendant tes hanches et tes genoux.","En te redressant, contracte tes fessiers et garde ta sangle abdominale gainée.","Abaisse la barre jusqu'au sol en fléchissant les hanches et les genoux, en gardant ton dos droit.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, les pieds bloqués et la tête plus basse que les hanches.","Saisis la barre avec une prise en pronation un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, la tête plus basse que les hanches et les pieds bloqués.","Tiens une barre avec une prise pronation (paumes tournées vers l'extérieur) et étends les bras droit au-dessus de ta poitrine.","Abaisse la barre derrière ta tête de manière contrôlée, en gardant tes bras légèrement fléchis.","Marque une pause, puis ramène la barre à la position de départ en contractant tes grands dorsaux.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, la tête plus basse que les pieds, et tiens une barre en prise serrée.","Abaisse la barre vers ton front en fléchissant tes coudes, en gardant le haut de tes bras immobile.","Marque une pause, puis étends tes bras pour presser la barre vers le haut et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, la tête plus basse que les hanches et les pieds bloqués.","Tiens la barre en prise pronation (paumes tournées vers l'extérieur), les mains un peu plus écartées que la largeur des épaules.","Étends tes bras au-dessus de ta poitrine, en gardant une légère flexion dans tes coudes.","Abaisse la barre en arc de cercle derrière ta tête, en ressentant un étirement dans ta poitrine et tes épaules.","Marque une pause, puis ramène la barre à la position de départ en inversant le mouvement.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, les pieds bloqués et la tête plus basse que les hanches.","Saisis la barre avec une prise large, un peu plus large que la largeur des épaules.","Abaisse la barre vers ta poitrine, en gardant tes coudes écartés sur les côtés.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur un banc décliné, la tête plus basse que les hanches et les pieds bloqués.","Tiens une barre avec une prise large et étends les bras droit au-dessus de ta poitrine.","Abaisse la barre derrière ta tête de manière contrôlée, en gardant tes bras tendus.","Marque une pause, puis ramène la barre à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens une barre en prise supination, paumes tournées vers le haut.","Laisse la barre pendre à bout de bras devant tes cuisses.","En gardant le haut des bras immobile, fléchis la barre vers ta poitrine en contractant tes biceps.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Place une barre au sol devant toi.","Tiens-toi avec la pointe des pieds sur le bord de la barre, les talons dans le vide.","Tiens-toi à un objet stable pour l'équilibre si nécessaire.","Lève tes talons aussi haut que possible en utilisant tes mollets pour soulever ton corps.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens la barre devant ta poitrine, les mains écartées à la largeur des épaules, les coudes pointés vers l'avant.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses ton corps en position de squat, en poussant tes hanches vers l'arrière et en pliant tes genoux.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement
