<title>Carnet Muscu</title>
<style>
:root{
  --bg:#0f1114;--card:#181b20;--card2:#20242b;--line:#2c313a;
  --text:#eef0f3;--muted:#8d95a3;--accent:#c6f135;--accent-ink:#141a00;
  --danger:#ff6b6b;--ok:#4ade80;--ss:#7dd3fc;--warm:#ffc857;--drop:#c4a4ff;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:20px;margin:0;letter-spacing:-.3px}
main{padding:16px 16px 90px;max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:12px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.ss{border-left:4px solid var(--ss)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;
  padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exlist{margin:8px 0 12px;padding:0;list-style:none}
.exlist li{padding:6px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px}
.exlist li:last-child{border-bottom:0}
.tag{font-size:12px;color:var(--muted);white-space:nowrap}
.exlink{border-bottom:1px dotted var(--muted);cursor:pointer}
textarea,input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
textarea.short{min-height:80px;font-family:inherit;font-size:16px}
.setrow{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.setrow input{text-align:center;padding:10px 4px}
.setrow.done input{border-color:var(--ok);background:#14251b}
.nb{position:relative;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--muted);font-weight:700;font-size:15px}
.nb.t-F{color:var(--danger)}
.nb.t-W{background:#3a2e12;color:var(--warm);border-color:#6b5420}
.nb.t-D{background:#2a1f3d;color:var(--drop);border-color:#4b3a78}
.nb.hasn::after{content:'';position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.check{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:20px}
.done .check{background:var(--ok);color:#06210f;border-color:var(--ok)}
.colhead{display:grid;grid-template-columns:40px 1fr 1fr 52px;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.last{font-size:13px;color:var(--muted);margin-top:4px}
.pr{color:var(--accent);font-weight:700}
#timer{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;
  background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:10px 14px;
  display:none;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 8px 24px #0008}
#timer.show{display:flex}
#timer .t{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:#0002;border:0;color:inherit;border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-140%);
  background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:50;
  transition:transform .25s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000a;z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:640px;
  max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.preview{background:var(--card);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.preview b{color:var(--accent)}
canvas{width:100%;height:210px;display:block}
.stat{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.hist summary{list-style:none;cursor:pointer}
.hist summary::-webkit-details-marker{display:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.gap{height:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;gap:3px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px 4px;border-radius:9px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card2);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.chip.main{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-weight:600}
.chip.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
button.chip{cursor:pointer}
.exoimg{position:relative;width:100%;aspect-ratio:1/1;max-height:50vh;background:#fff;border-radius:14px;overflow:hidden;margin:10px auto}
.exoimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0}
.exoimg img.on{opacity:1}
.exoimg .fail{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#555;padding:20px;font-size:14px}
.pkrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 12px;margin-bottom:6px}
.pkrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pkh{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:var(--card);color:var(--text);
  font-size:14px;position:relative;padding:0}
.cal button.blank{visibility:hidden}
.cal button.has{border-color:#4a5a1d;background:#1f2a0c}
.cal button.has::after{content:'';position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.cal button.today{border-color:var(--muted)}
.cal button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal button.sel::after{background:var(--accent-ink)}
.bar{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.bar .track{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:7px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>

    let sc = 0, ok = true;
    for (const a of alts) {

function routineToText(r) {
  return 'ROUTINE: ' + r.name + '\n' + r.exercises.map(e => {
    const f = [e.name, `${e.sets} x ${e.reps}`, fmtW(e.weight)];

function parseText(txt, defaultName) {
  const out = []; let cur = null;
  String(txt).split(/\r?\n/).forEach(raw => {
    let l = raw.replace(/[`*]/g, '').trim();
    if (!l) return;
    const m = l.match(/^#*\s*ROUTINE\s*:\s*(.+)$/i);
    if (m) { cur = {name: m[1].trim(), exercises: []}; out.push(cur); return; }
    if (!l.includes('|')) return;
    if (!cur) { if (!defaultName) return; cur = {name: defaultName, exercises: []}; out.push(cur); }
    l = l.replace(/^(?:[-•–]|\d+[.)])\s*/, '');
    const p = l.split('|').map(s => s.trim());
    if (!p[0]) return;
    const sr = (p[1] || '').match(/(\d+)\s*[x×*]\s*(.+)/i);
    let sets = sr ? parseInt(sr[1], 10) : 2;
    sets = Math.max(1, Math.min(sets || 2, 10));
    const reps = sr ? sr[2].trim().replace(/[–—]/g, '-').replace(/\s*reps?$/i, '') : (p[1] || '8-12');
    const wm = (p[2] || '').replace(',', '.').match(/\d+(\.\d+)?/);
    let ss = null; const notes = [];
    p.slice(3).forEach(f => { const sm = f.match(/^SS\s*:?\s*([A-Za-z0-9]+)$/i); if (sm) ss = sm[1].toUpperCase(); else if (f) notes.push(f); });
    const o = {name: p[0], sets, reps, weight: wm ? +wm[0] : '', note: notes.join(' | ')};
    if (ss) o.ss = ss;
    out[out.length - 1].exercises.push(o);
  });
  out.forEach(r => fixSS(r.exercises));
  return out.filter(r => r.exercises.length);
}

let pk = null, pkResults = [];
function myNames() {
  const seen = new Map();
  S.routines.forEach(r => r.exercises.forEach(e => { if (!seen.has(norm(e.name))) seen.set(norm(e.name), e.name); }));
  S.history.forEach(h => h.exercises.forEach(e => { if (!seen.has(norm(e.name))) seen.set(norm(e.name), e.name); }));

/* ---------- Séance ---------- */
function startWorkout(rid) {
  if (S.active && !confirm('Une séance est déjà en cours. La remplacer?')) { tab = 'workout'; render(); return; }
  const r = S.routines.find(x => x.id === rid);
  S.active = {
    routineId: r.id, routineName: r.name, start: new Date().toISOString(),
    exercises: r.exercises.map(e => ({name: e.name, ss: e.ss, rest: e.rest, note: '', target: {...e}, sets: mkSets(e.sets, lastFor(e.name), e.weight, e.reps)}))
  };
  save(); tab = 'workout'; render(); window.scrollTo(0, 0);
}
function finishWorkout() {
  const a = S.active; if (!a) return;
  const exercises = a.exercises.map(e => {
    const o = {name: e.name, sets: e.sets.filter(s => s.done || (s.r !== '' && +s.r > 0)).map(s => {
      const x = {w: s.w === '' ? '' : +s.w, r: +s.r || +s.ph || 0};
      if (s.t) x.t = s.t; if (s.n) x.n = s.n; return x;
    })};
    if (e.note) o.note = e.note; if (e.ss) o.ss = e.ss; return o;
  }).filter(e => e.sets.length);
  if (!exercises.length) { if (confirm('Aucune série remplie. Abandonner la séance?')) { S.active = null; save(); stopTimer(); tab = 'routines'; render(); } return; }
  const id = uid(), prs = [];
  exercises.forEach(e => {
    const best = Math.max(0, ...work(e.sets).map(s => e1rm(s.w, s.r)));
    const prev = Math.max(0, ...S.history.flatMap(h => h.exercises.filter(x => norm(x.name) === norm(e.name)).flatMap(x => work(x.sets).map(s => e1rm(s.w, s.r)))));
    if (best > 0 && prev > 0 && best > prev) prs.push(e.name);
  });
  S.history.push({id, routineId: a.routineId, routineName: a.routineName, date: a.start, duration: Math.round((Date.now() - new Date(a.start)) / 60000), exercises});
  S.active = null; save(); stopTimer(); tab = 'history'; histMode = 'list'; render();
  modal(`<h2>Séance enregistrée 💪</h2>
    <p>${exercises.length} exercices · ${exercises.reduce((n, e) => n + work(e.sets).length, 0)} séries de travail</p>
    ${prs.length ? `<p class="pr">🏆 Nouveau record : ${prs.map(esc).join(', ')}</p>` : ''}
    <button class="btn primary block" data-act="close">Super</button>`);
}
function replaceExercise(ei, pick) {
  const e = S.active.exercises[ei], old = e.name;
  if (norm(old) === norm(pick.name)) return;
  e.name = pick.name; e.target.name = pick.name;
  if (pick.lib) S.links[norm(pick.name)] = pick.lib;
  const last = lastFor(pick.name);
  e.sets.forEach((s, i) => { if (s.done) return; const ls = last && (last.sets[i] || last.sets[last.sets.length - 1]); s.w = ls && ls.w !== '' ? ls.w : ''; if (ls) s.ph = ls.r; });
  const re = routineEx(S.active.routineId, old);
  if (re && confirm(`Remplacer aussi « ${old} » par « ${pick.name} » dans la routine ${S.active.routineName}?`)) re.name = pick.name;
  save(); render(); toast('🔄 Exercice remplacé');
}
function addExercise(pick) {
  const a = S.active;
  if (pick.lib) S.links[norm(pick.name)] = pick.lib;
  a.exercises.push({name: pick.name, note: '', target: {name: pick.name, sets: 2, reps: '8-12', weight: '', note: ''}, sets: mkSets(2, lastFor(pick.name), '', '8-12')});
  const r = S.routines.find(x => x.id === a.routineId);
  if (r && !routineEx(a.routineId, pick.name) && confirm(`Ajouter aussi « ${pick.name} » à la routine ${a.routineName}?`)) r.exercises.push(ex(pick.name, 2, '8-12'));
  save(); render(); toast('＋ Exercice ajouté');
  setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50);
}

let timerEnd = 0, timerInt = null;
function startTimer(sec) {
  timerEnd = Date.now() + sec * 1000;
  $('#timer').classList.add('show');
  clearInterval(timerInt); tickTimer(); timerInt = setInterval(tickTimer, 250);
}
function tickTimer() {
  const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  $('#tval').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (left <= 0) { stopTimer(); if (navigator.vibrate) navigator.vibrate([300, 150, 300]); toast('⏱️ Repos terminé!'); }
}

function vHistory() {
  const seg = `<div class="seg"><button class="${histMode === 'list' ? 'on' : ''}" data-act="hist-mode" data-m="list">Liste</button><button class="${histMode === 'cal' ? 'on' : ''}" data-act="hist-mode" data-m="cal">Calendrier</button></div>`;

  return seg + add + S.history.slice().reverse().map(h => histCard(h)).join('');
}
function vCalendar() {
  const first = new Date(cal.y, cal.m, 1), days = new Date(cal.y, cal.m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const byDay = {};
  S.history.forEach(h => { const k = dkey(h.date); (byDay[k] = byDay[k] || []).push(h); });
  const today = dkey(new Date());
  let cells = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="wd">${d}</div>`).join('');
  for (let i = 0; i < lead; i++) cells += '<button class="blank" tabindex="-1"></button>';
  let count = 0;
  for (let d = 1; d <= days; d++) {
    const k = `${cal.y}-${pad2(cal.m + 1)}-${pad2(d)}`;
    const n = (byDay[k] || []).length; count += n;
    cells += `<button class="${n ? 'has' : ''} ${k === today ? 'today' : ''} ${k === cal.sel ? 'sel' : ''}" data-act="cal-day" data-d="${k}">${d}</button>`;
  }
  const title = first.toLocaleDateString('fr-CA', {month: 'long', year: 'numeric'});
  const list = cal.sel ? (byDay[cal.sel] || []) : [];
  return `<div class="card"><div class="row between"><button class="btn sm" data-act="cal-prev">‹</button><h3 style="text-transform:capitalize">${esc(title)}</h3><button class="btn sm" data-act="cal-next">›</button></div>

async function exportData() {

  }

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast('✅ Fichier exporté');
}
function parseCsv(txt) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && txt[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function parseHevyDate(s) {
  const m = String(s).match(/(\d{1,2})\s+([A-Za-zéû.]+)\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if (m) {
    const mo = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m[2].slice(0, 3).toLowerCase());
    if (mo >= 0) return new Date(+m[3], mo, +m[1], +m[4], +m[5]);
  }
  return new Date(s);
}
function importHevyCsv(txt) {
  const rows = parseCsv(txt.replace(/^﻿/, ''));
  const h = rows[0].map(x => x.trim().toLowerCase());
  const col = n => h.findIndex(x => x === n || x.startsWith(n));
  const cT = col('title'), cS = col('start_time'), cE = col('end_time'), cX = col('exercise_title'), cY = col('set_type'),
        cW = h.findIndex(x => x.startsWith('weight_')), cR = col('reps'), cN = col('exercise_notes'), cSS = col('superset_id');
  if (cX < 0 || cS < 0 || cR < 0) throw new Error('format');
  const toKg = cW >= 0 && h[cW].includes('kg') && U() === 'lb' ? 2.20462 : (cW >= 0 && h[cW].includes('lb') && U() === 'kg' ? 1 / 2.20462 : 1);
  const map = new Map();
  rows.slice(1).forEach(r => {
    if (!r[cX]) return;
    const key = r[cS];
    if (!map.has(key)) {
      const d = parseHevyDate(r[cS]); const e = cE >= 0 ? parseHevyDate(r[cE]) : d;
      map.set(key, {id: uid(), routineName: r[cT] || 'Séance Hevy', date: isNaN(d) ? new Date().toISOString() : d.toISOString(),
        duration: isNaN(e - d) ? 0 : Math.max(0, Math.round((e - d) / 60000)), exercises: [], _ss: {}});
    }
    const s = map.get(key);
    let e = s.exercises.find(x => x.name === r[cX]);
    if (!e) {
      e = {name: r[cX], sets: []};
      if (cN >= 0 && r[cN]) e.note = r[cN];
      if (cSS >= 0 && r[cSS] !== '') { const g = r[cSS]; if (!s._ss[g]) s._ss[g] = String.fromCharCode(65 + Object.keys(s._ss).length); e.ss = s._ss[g]; }
      s.exercises.push(e);
    }
    const w = cW >= 0 && r[cW] !== '' ? Math.round(+r[cW] * toKg * 2) / 2 : '';
    const reps = +r[cR] || 0;
    if (reps > 0) {
      const set = {w: w === 0 ? '' : w, r: reps};
      const ty = cY >= 0 ? r[cY].toLowerCase() : '';
      if (/warm/.test(ty)) set.t = 'W'; else if (/fail/.test(ty)) set.t = 'F'; else if (/drop/.test(ty)) set.t = 'D';
      e.sets.push(set);
    }
  });
  const known = new Set(S.history.map(x => x.date.slice(0, 16)));
  const add = [...map.values()].filter(s => s.exercises.some(e => e.sets.length) && !known.has(s.date.slice(0, 16)));
  add.forEach(s => { delete s._ss; fixSS(s.exercises); });
  S.history.push(...add); S.history.sort((a, b) => a.date.localeCompare(b.date));
  return add.length;
}
function importFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const txt = String(rd.result);
    try {
      if (/\.csv$/i.test(file.name) || /^﻿?"?title"?,/i.test(txt)) {
        const n = importHevyCsv(txt); save(); render(); toast(`✅ ${n} séances Hevy importées`); return;
      }
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.routines) || !Array.isArray(d.history)) throw new Error('format');
      if (!confirm(`Remplacer tes données actuelles par ce fichier (${d.history.length} séances, ${d.routines.length} routines)?`)) return;
      S = migrate({settings: d.settings, routines: d.routines, history: d.history, body: d.body, links: d.links, active: null});
      save(); tab = 'routines'; render(); toast('✅ Données importées');
    } catch (e) { toast('⚠️ Fichier non reconnu'); }
  };
  rd.readAsText(file);
}

  return `Voici mes séances d'entraînement des 30 derniers jours (charges en ${U()}, format charge×reps${S.settings.failDefault ? ", séries faites à l'échec sauf indication" : ''}) :\n\n` +
    hs.map(h => `${new Date(h.date).toLocaleDateString('fr-CA')} — ${h.routineName} (${h.duration} min)\n` +
      h.exercises.map(e => `  ${e.name} : ${e.sets.map(s => fmtSet(s, false).replace(' (échec)', '')).join(', ')}${e.note ? ' — note : ' + e.note : ''}`).join('\n')).join('\n\n') +
    `\n\nMes routines actuelles :\n\n${S.routines.map(routineToText).join('\n\n')}\n\n` +
    `Si tu proposes des changements de routines, donne-les dans EXACTEMENT ce format pour que je puisse les coller dans mon appli :\nROUTINE: Nom\n- Exercice | séries x reps | charge ${U()} | note | SS:A (optionnel pour un superset)\n\nMa question : `;
}

/* ===================== Graphique ===================== */
function drawChart(pts) {
  const c = $('#chart'); if (!c || !pts.length) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim(), line = css.getPropertyValue('--line').trim(), muted = css.getPropertyValue('--muted').trim();
  const pad = {l: 42, r: 12, t: 12, b: 24};
  const vals = pts.map(p => p.v);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 5; mx += 5; }
  const span = mx - mn; mn -= span * .1; mx += span * .1;
  const x = i => pad.l + (pts.length === 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (pts.length - 1));
  const y = v => pad.t + (1 - (v - mn) / (mx - mn)) * (H - pad.t - pad.b);
  g.strokeStyle = line; g.fillStyle = muted; g.font = '11px sans-serif'; g.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = mn + (mx - mn) * i / 3, yy = y(v);
    g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r, yy); g.stroke();
    g.fillText((Math.round(v * 10) / 10).toString(), 4, yy + 4);
  }
  g.textAlign = 'left'; g.fillText(dateFr(pts[0].d), pad.l, H - 6);
  if (pts.length > 1) { g.textAlign = 'right'; g.fillText(dateFr(pts[pts.length - 1].d), W - pad.r, H - 6); }
  g.strokeStyle = accent; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(i), y(p.v)) : g.moveTo(x(i), y(p.v))); g.stroke();
  g.fillStyle = accent; pts.forEach((p, i) => { g.beginPath(); g.arc(x(i), y(p.v), 3.5, 0, 7); g.fill(); });
}
function chartPoints() {
  if (progTab === 'body') return bodySeries(bodyMetric).map(p => ({d: p.d + 'T12:00', v: +p.v}));
  return S.history.map(h => {
    const e = h.exercises.find(x => norm(x.name) === norm(progEx)); if (!e) return null;
    const ws = work(e.sets); if (!ws.length) return null;
    const v = Math.max(...ws.map(s => e1rm(s.w, s.r)));
    return {d: h.date, v: v > 0 ? v : Math.max(...ws.map(s => s.r))};
  }).filter(Boolean);
}

/* ===================== Rendu ===================== */
const TITLES = {routines: 'Routines', workout: 'Séance', history: 'Historique', progress: 'Progrès', settings: 'Réglages'};
function render() {
  $('#title').textContent = tab === 'workout' && S.active ? S.active.routineName : TITLES[tab];
  $('#hdr').innerHTML = tab === 'workout' && S.active ? `<span class="muted small" id="elapsed"></span>` : '';
  const v = {routines: vRoutines, workout: vWorkout, history: vHistory, progress: vProgress, settings: vSettings}[tab];
  $('#app').innerHTML = v();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab || (tab === 'workout' && b.dataset.tab === 'routines')));
  if (tab === 'progress' && (progTab === 'ex' || progTab === 'body')) drawChart(chartPoints());
  updElapsed();
}
function updElapsed() {
  const el = $('#elapsed'); if (!el || !S.active) return;
  el.textContent = Math.round((Date.now() - new Date(S.active.start)) / 60000) + ' min';
}
setInterval(updElapsed, 30000);

/* ===================== Événements ===================== */
document.addEventListener('click', e => {
  const n = e.target.closest('[data-tab]');
  if (n) { tab = n.dataset.tab === 'routines' && S.active ? 'routines' : n.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, rid = b.dataset.rid, r = S.routines.find(x => x.id === rid);
  const ei = +b.dataset.e, si = +b.dataset.s;
  const A = S.active;
  switch (act) {
    case 'start': startWorkout(rid); break;
    case 'go-workout': tab = 'workout'; render(); break;
    case 'ai-copy': copy(aiPrompt([r])); break;
    case 'ai-share': shareText(aiPrompt([r])); break;
    case 'ai-all': copy(aiPrompt(S.routines)); break;
    case 'ai-history': { const t = historyPrompt(); t ? copy(t) : toast('Aucune séance dans les 30 derniers jours'); break; }
    case 'paste': openPaste(rid); break;
    case 'paste-clip':
      navigator.clipboard.readText().then(t => { $('#pasteTa').value = t; previewPaste(b.closest('.sheet').querySelector('[data-act="paste-ok"]').dataset.rid); })
        .catch(() => toast('Appuie longuement dans la zone et fais « Coller »'));
      break;
    case 'paste-ok': applyPaste(rid); break;
    case 'edit': openEdit(rid); break;
    case 'del-routine': if (confirm(`Supprimer « ${r.name} »?`)) { S.routines = S.routines.filter(x => x.id !== rid); save(); closeAll(); render(); } break;
    case 'close': closeModal(); break;

    /* fiche exercice / bibliothèque */
    case 'exo': openExo(b.dataset.n); break;
    case 'exo-link': { const nm = b.dataset.n; closeModal(); openPicker({title: `Lier « ${nm} »`, libOnly: true, cb: p => { if (p.lib) { S.links[norm(nm)] = p.lib; save(); render(); toast('🔗 Exercice lié'); openExo(nm); } }}); break; }
    case 'exo-unlink': { const nm = b.dataset.n; S.links[norm(nm)] = 0; save(); closeModal(); render(); toast('Image retirée'); break; }
    case 'pk-chip': { const i = +b.dataset.i; pk.chip = pk.chip === i ? -1 : i; renderPicker(); break; }
    case 'pick': doPick(+b.dataset.i); break;

    /* séance */
    case 'done': {
      const s = A.exercises[ei].sets[si], e = A.exercises[ei];
      s.done = !s.done;
      if (s.done && s.r === '') s.r = s.ph;
      save(); render();
      if (s.done) {
        const inSS = e.ss && A.exercises[ei + 1] && A.exercises[ei + 1].ss === e.ss;
        if (!inSS) startTimer(s.t === 'W' ? 45 : (+e.rest || +S.settings.rest || 150));
      }
      break;
    }
    case 'add-set': { const st = A.exercises[ei].sets; const l = st[st.length - 1]; const o = {w: l ? l.w : '', r: '', done: false, ph: l ? l.ph : ''}; if (S.settings.failDefault) o.t = 'F'; st.push(o); save(); render(); break; }
    case 'add-warm': { const st = A.exercises[ei].sets; st.unshift({w: '', r: '', done: false, ph: '10', t: 'W'}); save(); render(); break; }
    case 'rm-set': A.exercises[ei].sets.pop(); save(); render(); break;
    case 'set-menu': openSetMenu(A.exercises[ei].sets, si, A.exercises[ei].name, () => { save(); render(); }); break;
    case 'st-type': { const s = setCtx.sets[setCtx.si]; if (b.dataset.t === 'N') delete s.t; else s.t = b.dataset.t; document.querySelectorAll('#sttypes .btn').forEach(x => x.classList.toggle('on', x === b)); break; }
    case 'st-del': { setCtx.sets.splice(setCtx.si, 1); closeModal(); break; }
    case 'ex-menu': openExMenu(ei); break;
    case 'ex-replace': closeModal(); openPicker({title: `Remplacer « ${A.exercises[ei].name} »`, cb: p => replaceExercise(ei, p)}); break;
    case 'ex-ss': {
      const list = A.exercises, e = list[ei], nx = list[ei + 1];
      const tag = e.ss || newSSTag(list); e.ss = tag; nx.ss = tag;
      [e, nx].forEach(x => { const re = routineEx(A.routineId, x.name); if (re) re.ss = tag; });
      save(); closeModal(); toast('⛓ Superset créé'); break;
    }
    case 'ex-ss-off': {
      const list = A.exercises, e = list[ei], tag = e.ss;
      delete e.ss; fixSS(list);
      list.forEach(x => { const re = routineEx(A.routineId, x.name); if (re) { if (x.ss) re.ss = x.ss; else delete re.ss; } });
      const re = routineEx(A.routineId, e.name); if (re) delete re.ss;
      save(); closeModal(); break;
    }
    case 'ex-del': if (confirm(`Retirer « ${A.exercises[ei].name} » de cette séance?`)) { A.exercises.splice(ei, 1); fixSS(A.exercises); save(); closeModal(); } break;
    case 'add-exo': openPicker({title: 'Ajouter un exercice', cb: addExercise}); break;
    case 'finish': finishWorkout(); break;
    case 'cancel-workout': if (confirm('Abandonner cette séance sans l\'enregistrer?')) { S.active = null; save(); stopTimer(); tab = 'routines'; render(); } break;
    case 'timer-add': timerEnd += 30000; tickTimer(); break;
    case 'timer-stop': stopTimer(); break;

    /* historique */
    case 'hist-mode': histMode = b.dataset.m; render(); break;
    case 'cal-prev': cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } cal.sel = null; render(); break;
    case 'cal-next': cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } cal.sel = null; render(); break;
    case 'cal-day': cal.sel = cal.sel === b.dataset.d ? null : b.dataset.d; render(); break;
    case 'del-hist': if (confirm('Supprimer cette séance?')) { S.history = S.history.filter(h => h.id !== b.dataset.hid); save(); render(); } break;
    case 'hist-edit': openEditor(b.dataset.hid); break;
    case 'hist-new': openNewPast(); break;
    case 'new-past-ok': createPast(); break;
    case 'ed-set-menu': openSetMenu(draft.exercises[ei].sets, si, draft.exercises[ei].name, () => showEditor()); break;
    case 'ed-set-del': draft.exercises[ei].sets.splice(si, 1); showEditor(); break;
    case 'ed-add-set': { const st = draft.exercises[ei].sets; const l = st[st.length - 1]; const o = {w: l ? l.w : '', r: ''}; if (S.settings.failDefault) o.t = 'F'; st.push(o); showEditor(); break; }
    case 'ed-ex-del': if (confirm('Retirer cet exercice de la séance?')) { draft.exercises.splice(ei, 1); showEditor(); } break;
    case 'ed-add-ex': openPicker({title: 'Ajouter un exercice', cb: p => { if (p.lib) S.links[norm(p.name)] = p.lib; draft.exercises.push({name: p.name, sets: [S.settings.failDefault ? {w: '', r: '', t: 'F'} : {w: '', r: ''}]}); showEditor(); }}); break;
    case 'ed-save': if (saveEditor()) { closeAll(); render(); toast('✅ Séance enregistrée'); } break;

    /* progrès */
    case 'prog-tab': progTab = b.dataset.p; render(); break;
    case 'vol-p': volPeriod = b.dataset.p; render(); break;
    case 'body-save': saveBody(); break;
    case 'body-del': if (confirm('Supprimer cette mesure?')) { S.body = S.body.filter(x => x.id !== b.dataset.id); save(); render(); } break;

    /* réglages */
    case 'export': exportData(); break;
    case 'import': $('#fileIn').click(); break;
    case 'reset': if (confirm('Effacer TOUTES tes données? Exporte d\'abord si tu veux les garder.')) { S = migrate(seed()); save(); tab = 'routines'; render(); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in && S.active) {
    const s = S.active.exercises[+t.dataset.e].sets[+t.dataset.s];
    s[t.dataset.in] = t.value.replace(',', '.'); save();
  }
  if (t.dataset.edw && draft) { draft.exercises[+t.dataset.e].sets[+t.dataset.s][t.dataset.edw] = t.value.replace(',', '.'); }
  if (t.dataset.edm && draft) {
    const k = t.dataset.edm;
    if (k === 'date') { const d = new Date(t.value); if (!isNaN(d)) draft.date = d.toISOString(); } else draft[k] = t.value;
  }
  if (t.dataset.stnote !== undefined && setCtx) { const s = setCtx.sets[setCtx.si]; if (t.value.trim()) s.n = t.value; else delete s.n; }
  if (t.dataset.exnote !== undefined && S.active) { S.active.exercises[+t.dataset.exnote].note = t.value; }
  if (t.dataset.set) {
    if (t.type === 'checkbox') S.settings[t.dataset.set] = t.checked;
    else S.settings[t.dataset.set] = t.dataset.set === 'rest' ? (parseInt(t.value, 10) || 150) : t.value;
    save();
  }
  if (t.id === 'pasteTa') { const ok = document.querySelector('[data-act="paste-ok"]'); previewPaste(ok ? ok.dataset.rid : ''); }
  if (t.id === 'pkq' && pk) renderPicker();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'exSel') { progEx = t.value; render(); }
  if (t.id === 'bodySel') { bodyMetric = t.value; render(); }
  if (t.dataset.set === 'unit') render();
  if (t.dataset.exrest !== undefined && S.active) {
    const x = S.active.exercises[+t.dataset.exrest]; x.rest = t.value ? +t.value : undefined;
    const re = routineEx(S.active.routineId, x.name); if (re) { if (x.rest) re.rest = x.rest; else delete re.rest; }
    save();
  }
});
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('resize', () => { if (tab === 'progress') drawChart(chartPoints()); });

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
