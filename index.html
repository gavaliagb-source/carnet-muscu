/* ---------- Calculateur de disques ---------- */
const PLATES = {lb: [45, 35, 25, 10, 5, 2.5], kg: [25, 20, 15, 10, 5, 2.5, 1.25]};
function platesFor(total, bar) {
  let side = (total - bar) / 2; const out = [];
  if (side < 0) return {out, rest: 0, under: true};
  for (const pl of PLATES[U()]) while (side >= pl - 1e-9) { out.push(pl); side = Math.round((side - pl) * 1000) / 1000; }
  return {out, rest: Math.round(side * 2 * 100) / 100};
}
function openPlates(w) {
  const bar = S.settings.bar != null ? S.settings.bar : (U() === 'kg' ? 20 : 45);
  const bars = U() === 'kg' ? [20, 15, 10, 0] : [45, 35, 25, 15, 0];
  modal(`<div class="row between"><h2>🧮 Calculateur de disques</h2><button class="btn sm" data-act="close">✕</button></div>
    <div class="grid2"><div><label>Charge totale (${U()})</label><input id="pltw" inputmode="decimal" value="${esc(w || '')}"></div>
    <div><label>Barre</label><select id="pltb">${bars.map(b => `<option value="${b}" ${b === bar ? 'selected' : ''}>${b ? b + ' ' + U() : 'Aucune (machine)'}</option>`).join('')}</select></div></div>
    <div id="pltres" style="margin-top:12px"></div>`);
  renderPlates();
}
function renderPlates() {
  const t = parseFloat(($('#pltw').value || '').replace(',', '.')), bar = +$('#pltb').value, box = $('#pltres');
  if (!(t > 0)) { box.innerHTML = '<p class="muted small">Entre une charge.</p>'; return; }
  const {out, rest, under} = platesFor(t, bar);
  const big = PLATES[U()][0];
  box.innerHTML = under ? `<p class="muted">C'est moins que la barre (${bar} ${U()}).</p>` :
    `<p style="margin:0 0 8px"><b>De chaque côté :</b> ${out.length ? out.join(' + ') + ' ' + U() : 'rien, la barre seule'}</p>
     <div class="pltviz"><span class="sleeve"></span>${out.map(pl => `<span class="plate" style="height:${Math.round(34 + pl / big * 76)}px">${pl}</span>`).join('')}</div>
     ${rest > 0.001 ? `<p class="small" style="color:var(--warm)">⚠️ Impossible exactement : il manque ${rest} ${U()} avec les disques standards.</p>` : ''}`;
}

let reo = null;
function openReorder(list, onDone) {

    <p class="muted small">Glisse ≡ pour changer l'ordre. Touche − pour retirer un exercice.</p>
    <div id="reolist">${list.map((e, i) => `<div class="reo" data-i="${i}"><button class="reodel" data-act="reo-del" aria-label="Retirer">−</button>${thumb(e.name, 40)}<span class="reon">${esc(e.name)}</span><span class="handle" aria-label="Glisser pour déplacer">≡</span></div>`).join('')}</div>
    <button class="btn primary block" data-act="reo-done" style="margin-top:14px">Terminé</button>`);
  const box = m.querySelector('#reolist'), sheet = m.querySelector('.sheet');
  let d = null;
  const shiftOthers = () => {
    d.items.forEach((it, k) => {
      if (k === d.from) return;
      let s = 0;
      if (d.from < k && k <= d.to) s = -d.h; else if (d.to <= k && k < d.from) s = d.h;
      it.style.transform = s ? `translateY(${s}px)` : '';
    });
  };
  box.addEventListener('pointerdown', e => {
    const hd = e.target.closest('.handle'); if (!hd) return;
    const item = hd.closest('.reo'), items = [...box.querySelectorAll('.reo')];
    const rects = items.map(x => x.getBoundingClientRect());
    d = {item, items, rects, from: items.indexOf(item), to: items.indexOf(item), y0: e.clientY, s0: sheet.scrollTop, h: rects[items.indexOf(item)].height};
    items.forEach(x => { if (x !== item) x.style.transition = 'transform .18s ease'; });
    item.classList.add('dragging');
    try { hd.setPointerCapture(e.pointerId); } catch (x) {}
    if (navigator.vibrate) navigator.vibrate(12);
    e.preventDefault();
  });
  box.addEventListener('pointermove', e => {
    if (!d) return;
    const sr = sheet.getBoundingClientRect();
    if (e.clientY > sr.bottom - 50) sheet.scrollTop += 8; else if (e.clientY < sr.top + 50) sheet.scrollTop -= 8;
    const dy = e.clientY - d.y0 + (sheet.scrollTop - d.s0);
    d.item.style.transform = `translateY(${dy}px) scale(1.02)`;
    const c = d.rects[d.from].top + d.h / 2 + dy;
    let to = 0;
    d.rects.forEach((r, k) => { if (k !== d.from && c > r.top + r.height / 2) to++; });
    if (to !== d.to) { d.to = to; shiftOthers(); if (navigator.vibrate) navigator.vibrate(5); }
    e.preventDefault();
  });
  const end = () => {
    if (!d) return;
    const {item, items, from, to} = d;
    items.forEach(x => { x.style.transition = ''; x.style.transform = ''; });
    item.classList.remove('dragging');
    const rest = items.filter(x => x !== item);
    if (to >= rest.length) box.appendChild(item); else box.insertBefore(item, rest[to]);
    d = null;
  };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
}

function regroupSS(list) {

  let last = -1; rest.forEach((x, i) => { if (x.ss === tag) last = i; });

let pfMetric = 'dur', pfWeeks = 12;
function weekly(n) {
  const ws = weekStart(new Date()), out = [];
  for (let i = n - 1; i >= 0; i--) { const s = new Date(ws); s.setDate(s.getDate() - 7 * i); const e = new Date(s); e.setDate(e.getDate() + 7); out.push({s, e, dur: 0, vol: 0, reps: 0, n: 0}); }
  S.history.forEach(h => { const t = new Date(h.date); const b = out.find(x => t >= x.s && t < x.e); if (!b) return; b.n++; b.dur += (+h.duration || 0) / 60; b.vol += sessVol(h); b.reps += sessReps(h); });
  return out;
}
function niceMax(m) { const p = Math.pow(10, Math.floor(Math.log10(m))); for (const k of [1, 1.5, 2, 3, 4, 5, 6, 8, 10]) if (k * p >= m) return k * p; return 10 * p; }
function barsSVG(vals, labels, fmt) {
  const W = 360, H = 170, pl = 40, pb = 22, pt = 8;
  const top = niceMax(Math.max(1, ...vals)), bw = (W - pl - 4) / vals.length;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = top * i / 3, y = pt + (H - pt - pb) * (1 - i / 3); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${fmt(v)}</text>`; }
  vals.forEach((v, i) => {
    const bh = (H - pt - pb) * v / top, x = pl + 2 + i * bw + bw * 0.16;
    g += `<rect x="${x.toFixed(1)}" y="${(H - pb - bh).toFixed(1)}" width="${(bw * 0.68).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="3" style="fill:var(--accent)"/>`;
    if (labels[i]) g += `<text x="${(x + bw * 0.34).toFixed(1)}" y="${H - 6}" text-anchor="middle" style="fill:var(--muted);font-size:10px">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Graphique hebdomadaire">${g}</svg>`;
}
function streakWeeks() {
  const set = new Set(S.history.map(h => dkey(weekStart(h.date))));
  const w = weekStart(new Date()); if (!set.has(dkey(w))) w.setDate(w.getDate() - 7);
  let n = 0; while (set.has(dkey(w))) { n++; w.setDate(w.getDate() - 7); }
  return n;
}
function restDays() {
  if (!S.history.length) return null;
  const last = new Date(Math.max(...S.history.map(h => +new Date(h.date)))), t = new Date();
  last.setHours(0, 0, 0, 0); t.setHours(0, 0, 0, 0);
  return Math.max(0, Math.round((t - last) / 864e5));
}
function vProfile() {

  const wk = weekly(pfWeeks), last = wk[wk.length - 1];
  const vals = wk.map(b => pfMetric === 'dur' ? b.dur : pfMetric === 'vol' ? b.vol : b.reps);
  const step = Math.ceil(wk.length / 6);
  const labels = wk.map((b, i) => (wk.length - 1 - i) % step === 0 ? dateFr(b.s) : '');
  const fmtV = {dur: v => (Math.round(v * 10) / 10) + ' h', vol: v => v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : Math.round(v) + '', reps: v => Math.round(v) + ''}[pfMetric];

/* ---------- Calendrier façon Hevy ---------- */
let calMonths = 6;
function vCal2() {
  const byDay = {};
  S.history.forEach(h => { const k = dkey(h.date); (byDay[k] = byDay[k] || []).push(h); });
  const rd = restDays(), sw = streakWeeks();
  let h = `<div class="row calhead"><div>🔥 Série de <b>${sw}</b> semaine${sw > 1 ? 's' : ''}</div><div>🌙 ${rd == null ? 'Aucune séance' : rd === 0 ? 'Entraîné aujourd\'hui' : rd + ' jour' + (rd > 1 ? 's' : '') + ' de repos'}</div></div>
    <button class="btn sm block" data-act="cal-more" style="margin:10px 0">Afficher les mois précédents</button>
    <div class="cal2 wd7">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="muted small" style="text-align:center">${d}</div>`).join('')}</div>`;
  const now = new Date(), today = dkey(now);
  for (let i = calMonths - 1; i >= 0; i--) {
    const first = new Date(now.getFullYear(), now.getMonth() - i, 1), Y = first.getFullYear(), M = first.getMonth();
    const days = new Date(Y, M + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
    h += `<h3 class="mtitle">${first.toLocaleDateString('fr-CA', {month: 'long', year: 'numeric'})}</h3><div class="cal2">`;
    for (let j = 0; j < lead; j++) h += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const k = `${Y}-${pad2(M + 1)}-${pad2(d)}`, hs = byDay[k];
      h += `<button class="cday ${hs ? 'has' : ''} ${k === today ? 'today' : ''}" ${hs ? `data-act="cal2-day" data-d="${k}"` : 'tabindex="-1"'}><span class="dn">${d}</span>${hs ? `<span class="dl">${esc(hs[0].routineName)}${hs.length > 1 ? ' +' + (hs.length - 1) : ''}</span>` : ''}</button>`;
    }
    h += '</div>';
  }
  return h + `<button class="btn sm block" data-act="hist-new" style="margin-top:12px">＋ Ajouter une séance oubliée</button>`;
}

    case 'del-hist': if (confirm('Supprimer cette séance?')) { S.history = S.history.filter(h => h.id !== b.dataset.hid); save(); closeAll(); render(); } break;
    case 'hist-edit': openEditor(b.dataset.hid); break;
    case 'hist-new': openNewPast(); break;
    case 'new-past-ok': createPast(); break;
    case 'ed-set-menu': openSetMenu(draft.exercises[ei].sets, si, draft.exercises[ei].name, () => showEditor()); break;
    case 'ed-set-del': draft.exercises[ei].sets.splice(si, 1); showEditor(); break;
    case 'ed-add-set': { const st = draft.exercises[ei].sets; const l = st[st.length - 1]; const o = {w: l ? l.w : '', r: ''}; if (S.settings.failDefault) o.t = 'F'; st.push(o); showEditor(); break; }
    case 'ed-ex-del': if (confirm('Retirer cet exercice de la séance?')) { draft.exercises.splice(ei, 1); showEditor(); } break;
    case 'ed-add-ex': openPicker({title: 'Ajouter un exercice', cb: p => { if (p.lib) S.links[norm(p.name)] = p.lib; draft.exercises.push({name: p.name, sets: [S.settings.failDefault ? {w: '', r: '', t: 'F'} : {w: '', r: ''}]}); showEditor(); }}); break;
    case 'ed-save': if (saveEditor()) { closeAll(); render(); toast('✅ Séance enregistrée'); } break;

    /* progrès */
    case 'prog-tab': progTab = b.dataset.p; render(); break;
    case 'theme': S.settings.theme = b.dataset.t; save(); applyTheme(); render(); break;
    case 'rec-sort': recSort = b.dataset.s; render(); break;
    case 'apply-sug': {
      const e = A.exercises[ei], sg = suggestFor(e); if (!sg) break;
      let k = 0;
      e.sets.forEach(s => { if (s.t === 'W' || s.done) return; s.w = sg.next[Math.min(k, sg.next.length - 1)].w; s.ph = String(sg.lo); k++; });
      save(); render(); toast('💪 Nouvelle charge appliquée'); break;
    }
    case 'warm-auto': openWarmAuto(ei); break;
    case 'warm-apply': {
      const {ei: wi, plans} = warmCtx; const arr = plans[+b.dataset.k][1]; const e = A.exercises[wi];
      e.sets = e.sets.filter(s => !(s.t === 'W' && !s.done));
      e.sets.unshift(...arr.map(x => ({w: x.w, r: '', done: false, ph: String(x.r), t: 'W'})));
      save(); closeModal(); render(); toast('🔥 Échauffement ajouté'); break;
    }
    case 'vol-p': volPeriod = b.dataset.p; render(); break;
    case 'body-save': saveBody(); break;
    case 'body-del': if (confirm('Supprimer cette mesure?')) { S.body = S.body.filter(x => x.id !== b.dataset.id); save(); render(); } break;

    /* réglages */
    case 'export': exportData(); break;
    case 'import': $('#fileIn').click(); break;
    case 'reset': if (confirm('Effacer TOUTES tes données? Exporte d\'abord si tu veux les garder.')) { S = migrate(seed()); save(); setRoot('train'); render(); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in && S.active) {
    const s = S.active.exercises[+t.dataset.e].sets[+t.dataset.s];
    s[t.dataset.in] = t.value.replace(',', '.'); save();
  }
  if (t.dataset.edw && draft) { draft.exercises[+t.dataset.e].sets[+t.dataset.s][t.dataset.edw] = t.value.replace(',', '.'); }
  if (t.dataset.edm && draft) {
    const k = t.dataset.edm;
    if (k === 'date') { const d = new Date(t.value); if (!isNaN(d)) draft.date = d.toISOString(); } else draft[k] = t.value;
  }
  if (t.dataset.stnote !== undefined && setCtx) { const s = setCtx.sets[setCtx.si]; if (t.value.trim()) s.n = t.value; else delete s.n; }
  if (t.dataset.exnote !== undefined && S.active) { S.active.exercises[+t.dataset.exnote].note = t.value; }
  if (t.dataset.set) {
    if (t.type === 'checkbox') { S.settings[t.dataset.set] = t.checked; if (t.dataset.set === 'wake') syncWake(); }
    else if (t.dataset.set === 'inc') { const v = parseFloat(t.value.replace(',', '.')); if (v > 0) S.settings.inc = v; else delete S.settings.inc; }
    else S.settings[t.dataset.set] = t.dataset.set === 'rest' ? (parseInt(t.value, 10) || 150) : t.value;
    save();
  }
  if (t.id === 'pasteTa') { const ok = document.querySelector('[data-act="paste-ok"]'); previewPaste(ok ? ok.dataset.rid : ''); renderRestPick(); }
  if (t.id === 'pkq' && pk) renderPicker();
  if (t.dataset.rd && rdraft && t.tagName !== 'SELECT') { rdraft[t.dataset.rd] = t.value; rdirty = true; }
  if (t.dataset.rdnote !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdnote].note = t.value; rdirty = true; }
  if (t.dataset.rdw !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdw].sl[+t.dataset.s].w = t.value.replace(',', '.'); rdirty = true; }
  if ((t.dataset.rdlo !== undefined || t.dataset.rdhi !== undefined) && rdraft) {
    const ins = t.parentElement.querySelectorAll('input'), lo = ins[0].value.trim(), hi = ins[1].value.trim();
    rdraft.exercises[+(t.dataset.rdlo ?? t.dataset.rdhi)].sl[+t.dataset.s].r = lo && hi ? (lo === hi ? lo : `${lo}-${hi}`) : (lo || hi);
    rdirty = true;
  }
  if (t.dataset.rdr !== undefined && rdraft) { rdraft.exercises[+t.dataset.rdr].sl[+t.dataset.s].r = t.value.replace(/[–—]/g, '-'); rdirty = true; }
  if (t.id === 'exq') { exQ = t.value; $('#exlist').innerHTML = exListHtml(); }
  if (t.id === 'pltw') renderPlates();
  if (t.dataset.accent !== undefined) { S.settings.accent = t.value; save(); applyTheme(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'exSel') { progEx = t.value; render(); }
  if (t.id === 'bodySel') { bodyMetric = t.value; render(); }
  if (t.dataset.set === 'unit') render();
  if (t.dataset.rd === 'folder' && rdraft) {
    if (t.value === '__new') { const nf = (prompt('Nom du nouveau dossier :') || '').trim(); if (nf) { if (!S.folders.includes(nf)) S.folders.push(nf); rdraft.folder = nf; } render(); }
    else rdraft.folder = t.value;
    rdirty = true;
  }
  if (t.dataset.rdrest !== undefined && rdraft) { const e2 = rdraft.exercises[+t.dataset.rdrest]; if (t.value === '') delete e2.rest; else if (t.value === 'off') e2.rest = -1; else e2.rest = +t.value; rdirty = true; }
  if (t.dataset.pf === 'range') { pfWeeks = +t.value; render(); }
  if (t.id === 'pltb') { S.settings.bar = +t.value; save(); renderPlates(); }
  if (t.dataset.sched !== undefined) { S.schedule[+t.dataset.sched] = t.value; save(); }
  if (t.dataset.accent !== undefined) render();
  if (t.dataset.move !== undefined) {
    const r2 = S.routines.find(x => x.id === t.dataset.move); if (!r2) return;
    let f = t.value;
    if (f === '__new') { f = (prompt('Nom du nouveau dossier :') || '').trim(); if (!f) { closeAll(); return; } }
    if (!S.folders.includes(f)) S.folders.push(f);
    r2.folder = f; save(); closeAll(); render(); toast('📁 Routine déplacée dans « ' + f + ' »');
  }
  if (t.dataset.restpick !== undefined) {
    const res = parseText($('#pasteTa').value, editName); if (!res.length) return;
    const r = res[0], i = +t.dataset.restpick;
    if (t.value) r.exercises[i].rest = +t.value; else delete r.exercises[i].rest;
    $('#pasteTa').value = routineToText(r); renderRestPick();
    const ok = document.querySelector('[data-act="paste-ok"]'); previewPaste(ok ? ok.dataset.rid : '');
  }
  if (t.dataset.exrest !== undefined && S.active) {
    const x = S.active.exercises[+t.dataset.exrest]; x.rest = t.value ? +t.value : undefined;
    const re = routineEx(S.active.routineId, x.name); if (re) { if (x.rest) re.rest = x.rest; else delete re.rest; }
    save();
  }
});
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
window.addEventListener('resize', () => afterRender(cur()));

render();
{ const bad = brokenImports(); if (bad.length) modal(`<h2>🛠️ Dates de séances à réparer</h2>
  <p>J'ai trouvé <b>${bad.length} séances importées de Hevy</b> qui ont toutes reçu la même date à cause d'un bug de l'import (les mois en français comme « août » ou « juil. » n'étaient pas reconnus). C'est corrigé.</p>
  <p class="muted small">Pour les récupérer avec les bonnes dates : supprime-les, puis réimporte ton fichier CSV de Hevy (Hevy → Profil → Réglages → Exporter les données). Les séances déjà correctes ne seront pas dupliquées.</p>
  <button class="btn primary block" data-act="fix-import">Supprimer et réimporter le CSV</button>
  <button class="btn block" data-act="close" style="margin-top:8px">Plus tard</button>`); }
{ const q = new URLSearchParams(location.search).get('go');
  if (q) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    if (q === 'today') { if (S.active) openWorkout(); else { const r = schedR(dayIdx(new Date())); if (r) startWorkout(r.id); else toast("Rien de prévu aujourd'hui dans ton horaire"); } }
    else if (q === 'empty') startEmpty();
    else if (q === 'profile') { setRoot('profile'); render(); }
  } }
if (cloudOn()) setTimeout(() => cloudPush(), 4000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
