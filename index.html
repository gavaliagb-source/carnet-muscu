e la barre vers le plafond en menant avec tes coudes.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le siège et le repose-pieds de la machine Smith dans une position confortable.","Assieds-toi sur la machine, le dos contre le dossier et les pieds écartés à la largeur des épaules sur la plaque de pied.","Saisis les poignées ou les côtés de la machine pour te stabiliser.","Pousse le repose-pieds loin de toi en étendant tes jambes, en gardant ton dos contre le dossier.","Marque une pause en position complètement étendue.","Fléchis lentement les genoux et abaisse la plaque de pied vers toi, en revenant à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à une hauteur qui te permet de la poser confortablement sur le haut de ton dos.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Passe sous la barre et place-la sur le haut du dos, en la faisant reposer sur tes trapèzes.","Saisis la barre avec les mains légèrement plus écartées que la largeur des épaules.","Sors la barre du support en tendant les jambes et en reculant du rack.","Prends une grande inspiration et gaine ta sangle abdominale.","Amorce le squat en poussant tes hanches vers l'arrière et en pliant tes genoux.","Abaisse ton corps jusqu'à ce que tes cuisses soient parallèles au sol ou légèrement en dessous.","Garde la poitrine relevée et le dos droit tout au long du mouvement.","Pousse sur tes talons pour te relever, en étendant tes hanches et tes genoux.","Répète le nombre de répétitions souhaité."],["Règle la hauteur de la barre de la machine Smith à hauteur de la taille.","Tiens-toi face à la machine Smith, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en supination, les mains un peu plus larges que la largeur des épaules.","Garde tes coudes près de tes flancs et le haut de tes bras immobile.","Expire et remonte la barre vers tes épaules, en contractant tes biceps.","Marque une pause en haut du mouvement, en contractant tes biceps.","Inspire et abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le banc de la machine Smith en position déclinée.","Allonge-toi sur le banc, les pieds fermement ancrés au sol.","Saisis la barre avec une prise serrée, un peu plus étroite que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes près du corps.","Marque une pause lorsque la barre est juste au-dessus de ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Règle le siège de la machine Smith de sorte que la barre soit à hauteur des épaules.","Assieds-toi sur le banc, le dos contre le coussin et les pieds à plat sur le sol.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Étends complètement tes bras, en soulevant la barre du rack et en la maintenant directement au-dessus de ta poitrine.","Abaisse lentement la barre vers ton front, en gardant tes coudes près de ta tête.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith en position déclinée.","Allonge-toi sur le banc, les pieds bloqués sous les cale-pieds.","Saisis la barre avec une prise serrée, un peu plus étroite que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes rentrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation, légèrement plus resserrées que la largeur des épaules.","Garde le dos droit et la poitrine relevée pendant que tu tires les poignées vers ton corps, en resserrant tes omoplates.","Marque une pause au sommet du mouvement, puis relâche lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur de la barre de la machine Smith à hauteur de la taille.","Tiens-toi face à la machine Smith, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Saisis la barre d'une main avec une prise en pronation, la paume tournée vers le bas.","Garde ton coude près de ton corps et tire la barre vers ta taille, en resserrant tes omoplates.","Marque une pause en haut du mouvement, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis passe à l'autre bras."],["Positionne-toi au sol sous la barre de la machine Smith, dos à la machine.","Place l'avant de tes pieds sur une surface surélevée, comme un disque de poids ou un bloc.","Positionne la barre de la machine Smith en travers du bas de tes jambes, juste au-dessus de tes chevilles.","Tiens-toi à la barre avec tes mains pour la stabilité.","Lève tes talons du sol en étendant tes chevilles, en soulevant ton corps.","Marque une pause en haut du mouvement, puis abaisse lentement tes talons jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine, la poitrine contre le coussin et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation, légèrement plus écartées que la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée pendant que tu tires les poignées vers ta poitrine, en resserrant tes omoplates.","Marque une pause en haut du mouvement, puis relâche lentement les poignées pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la barre de la machine Smith à une hauteur juste en dessous de tes épaules.","Tiens-toi face à la barre, les pieds écartés à la largeur des hanches et les orteils pointés vers l'avant.","Place l'avant de tes pieds sur le bord d'une marche ou d'une plateforme, avec tes talons dans le vide.","Tiens-toi à la barre pour te soutenir, en gardant le dos droit et la sangle abdominale gainée.","Lève tes talons aussi haut que possible en reportant le poids de ton corps sur la plante de tes pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la barre de la machine Smith à une hauteur juste en dessous de tes épaules.","Tiens-toi face à la barre, les pieds écartés à la largeur des hanches et les orteils pointés vers l'avant.","Place l'avant de tes pieds sur le bord d'une marche ou d'une plateforme, avec tes talons dans le vide.","Tiens-toi à la barre pour te soutenir.","Lève tes talons aussi haut que possible en soulevant ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi face à la barre, les pieds écartés à la largeur des épaules.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Saisis la barre avec une prise en supination, les mains écartées à la largeur des épaules.","Tire la barre vers le bas de ta poitrine, en contractant tes omoplates.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur de la barre de la machine Smith à hauteur de la poitrine.","Tiens-toi face à la barre, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Recule et place-toi avec les genoux légèrement fléchis.","Garde la poitrine relevée et ta sangle abdominale gainée tout au long de l'exercice.","Abaisse la barre vers ta poitrine, en gardant tes coudes serrés.","Marque une pause en bas, puis pousse la barre vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur la machine, le dos contre le coussinet et les pieds sur le repose-pied.","Place une jambe sur le repose-pied et garde l'autre jambe en dehors du repose-pied.","En utilisant les muscles de tes mollets, lève ton talon aussi haut que possible.","Marque une pause en haut, puis abaisse lentement ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe et recommence."],["Règle la hauteur du siège de sorte que les poignées soient à hauteur des épaules.","Assieds-toi sur la machine, le dos contre le coussinet et les pieds à plat sur le sol.","Saisis les poignées avec une prise en pronation et soulève-les des supports, en étendant complètement les bras.","Abaisse les poignées à hauteur des épaules, en gardant tes coudes légèrement fléchis.","Pousse les poignées vers le haut au-dessus de ta tête jusqu'à ce que tes bras soient complètement tendus.","Marque une pause en haut, puis abaisse lentement les poignées à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc devant une machine Smith, les pieds à plat sur le sol.","Saisis la barre avec une prise en supination, les mains écartées à la largeur des épaules.","Pose tes avant-bras sur tes cuisses, en laissant tes poignets dépasser.","Enroule lentement tes poignets vers le haut, en ramenant la barre vers tes avant-bras.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et installe-toi sur la machine Smith, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et positionne-la à hauteur des épaules, les coudes fléchis et les paumes tournées vers l'avant.","Pousse la barre vers le haut jusqu'à ce que tes bras soient complètement tendus au-dessus de ta tête.","Marque une pause en haut, puis abaisse lentement la barre à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Garde tes bras tendus et tes épaules relâchées.","Monte tes épaules vers tes oreilles, en contractant tes trapèzes en haut.","Maintiens un moment, puis abaisse lentement tes épaules jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi devant la machine Smith, les pieds écartés à la largeur des épaules.","Place un pied derrière toi sur un banc ou une marche, les orteils pointés vers l'avant.","Tiens-toi à la barre de la machine Smith pour la stabilité.","Plie ton genou avant et abaisse ton corps en position de fente en gardant ton dos droit.","Marque une pause en bas, puis pousse sur ton talon avant pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi dos à la machine, les pieds écartés à la largeur des épaules.","Recule le pied droit et pose-le sur la barre, en faisant reposer le dessus du pied sur la barre.","Fléchis ton genou gauche et abaisse ton corps en position de fente en gardant le dos droit.","Pousse à travers ton talon gauche pour revenir à la position de départ.","Répète de l'autre côté en reculant ton pied gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à une hauteur appropriée pour ton squat.","Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Positionne-toi sous la barre, en la faisant reposer sur le haut de tes trapèzes et tes épaules.","Saisis la barre avec une prise large, légèrement plus écartée que la largeur des épaules.","Gaine ta sangle abdominale et sors la barre du rack, en reculant pour dégager le support.","En gardant la poitrine relevée et le dos droit, amorce le squat en fléchissant les hanches et les genoux.","Abaisse ton corps jusqu'à ce que tes cuisses soient parallèles au sol ou légèrement en dessous.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à la machine Smith, les pieds écartés à la largeur des épaules.","Saisis la barre avec une prise en pronation, les mains écartées à la largeur des épaules.","Garde le dos droit et tes coudes près de ton corps.","Enroule lentement tes poignets vers le haut, en ramenant la barre vers ton corps.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège de la machine Smith de sorte que la barre soit à hauteur des épaules.","Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et recule, en maintenant une position stable.","Positionne la barre derrière ta tête, reposant sur le haut de tes trapèzes.","Garde ta sangle abdominale gainée et la poitrine relevée tout au long de l'exercice.","Pousse la barre au-dessus de ta tête en tendant tes bras, en les redressant complètement.","Marque une brève pause en haut du mouvement, puis abaisse lentement la barre jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la barre de la machine Smith à une hauteur qui te permet de te tenir debout, les pieds à plat sur le sol et les épaules sous la barre.","Positionne-toi sous la barre, les pieds écartés à la largeur des épaules et les orteils pointés vers l'avant.","Place tes mains sur la barre pour la stabilité.","Sollicite tes mollets et lève lentement tes talons du sol, en soulevant ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Soulève la barre du rack et descends-la à hauteur des épaules, les paumes tournées vers l'avant.","Pousse la barre vers le haut jusqu'à ce que tes bras soient complètement tendus au-dessus de ta tête.","Marque une pause en haut, puis abaisse lentement la barre à hauteur des épaules.","Répète le nombre de répétitions souhaité."],["Règle la machine Smith avec la barre à hauteur de hanche.","Tiens-toi debout, les pieds plus écartés que la largeur des épaules, les orteils tournés vers l'extérieur.","Positionne-toi sous la barre, en la faisant reposer sur le haut de ton dos et tes épaules.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses ton corps en position de squat, en poussant tes hanches vers l'arrière et en pliant tes genoux.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu le peux confortablement.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la barre de la machine Smith à une hauteur qui te permet de te tenir debout confortablement, les pieds à plat sur le sol.","Positionne-toi sous la barre, les épaules directement en dessous d'elle et les pieds écartés à la largeur des épaules.","Place l'avant de tes pieds sur une plateforme surélevée ou des disques de poids, avec tes talons dans le vide au bord.","Saisis la barre avec une prise en pronation, un peu plus large que la largeur des épaules.","Gaine ta sangle abdominale et garde ton dos droit tout au long de l'exercice.","Lève lentement les talons le plus haut possible, en reportant le poids de ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, face à la machine Smith.","Saisis la barre avec une prise en pronation, les mains un peu plus larges que la largeur des épaules.","Garde le dos droit et ta sangle abdominale gainée.","Tire la barre vers le haut en direction de ton menton, en menant avec tes coudes.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le banc dans une position confortable sur la machine Smith.","Allonge-toi sur le banc, les pieds à plat au sol.","Saisis la barre avec une prise large, un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes ouverts sur les côtés.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Règle le banc décliné à l'angle souhaité.","Allonge-toi sur le banc, les pieds bloqués sous les cale-pieds.","Saisis la barre avec une prise large, un peu plus large que la largeur des épaules.","Sors la barre du support et abaisse-la lentement vers ta poitrine, en gardant les coudes pointés vers l'extérieur.","Marque une pause lorsque la barre touche ta poitrine.","Repousse la barre vers le haut jusqu'à la position de départ en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et la barre au sol devant toi.","Fléchis les genoux et bascule au niveau des hanches pour descendre en position accroupie, en saisissant la barre en prise pronation.","Garde le dos droit et la poitrine relevée pendant que tu pousses sur tes talons pour soulever la barre du sol, en étendant tes hanches et tes genoux.","Lorsque la barre atteint la hauteur des hanches, tire-la vers le haut de façon explosive en haussant les épaules et en tirant tes coudes haut et vers les côtés.","Lorsque la barre atteint son point le plus haut, glisse-toi rapidement en dessous en te tirant dans une position de squat profond.","Réceptionne la barre au-dessus de ta tête avec les bras complètement tendus et les genoux fléchis.","Redresse-toi en étendant les hanches et les genoux, en gardant la barre au-dessus de la tête.","Abaisse la barre jusqu'à la position de départ en inversant le mouvement.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère d'une main.","Fléchis légèrement les genoux et bascule vers l'avant au niveau de la taille en gardant le dos droit.","Étends ton bras avec l'haltère vers le pied opposé, en faisant pivoter ton torse en même temps.","Reviens à la position de départ et répète de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi face vers le bas au sol, les avant-bras à plat au sol, les coudes directement sous tes épaules.","Gaine ta sangle abdominale et lève ta poitrine du sol, en gardant tes avant-bras et tes orteils au sol.","Maintiens cette position pendant quelques secondes, en veillant à garder ton cou dans une position neutre.","Abaisse lentement ta poitrine vers la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Amène ton genou droit vers ton coude droit en le gardant décollé du sol.","En ramenant ton genou droit, abaisse simultanément ton corps vers le sol en fléchissant tes coudes.","Repousse-toi vers la position de départ et répète en amenant ton genou gauche vers ton coude gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Place tes mains au sol derrière toi, les doigts pointés vers ton corps.","Gaine ta sangle abdominale et penche-toi lentement en arrière, en gardant le dos droit.","Continue à te pencher vers l'arrière jusqu'à ce que tu sentes un étirement dans ta colonne vertébrale.","Maintiens l'étirement pendant quelques secondes, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Fléchis les genoux et pose les pieds à plat sur le sol, écartés à la largeur des hanches.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","Gaine tes abdominaux et fais lentement pivoter ton torse vers la droite, en amenant ton coude droit vers ton genou gauche.","Marque une pause à la fin de la torsion, puis reviens lentement à la position de départ.","Répète la torsion vers le côté gauche, en amenant ton coude gauche vers ton genou droit.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec un pied et place-le à environ soixante centimètres devant l'autre pied.","Abaisse ton corps en fléchissant tes genoux et tes hanches, en gardant ton dos droit.","Continue à descendre jusqu'à ce que ta cuisse avant soit parallèle au sol et que ton genou arrière soit juste au-dessus du sol.","Marque une pause, puis pousse sur ton talon avant pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe et recommence."],["Commence avec la barre posée sur les épaules, les pieds écartés à la largeur des épaules.","Descends en position accroupie, en gardant la poitrine relevée et tes genoux alignés au-dessus des orteils.","Une fois au bas du squat, pousse explosivement avec tes jambes et pousse la barre au-dessus de ta tête.","Lorsque la barre atteint son sommet, glisse-toi rapidement dans une position de fente, un pied devant et un pied derrière.","Réceptionne la barre au-dessus de ta tête avec les bras complètement tendus et ton genou arrière touchant légèrement le sol.","Redresse-toi depuis la position en fente, en ramenant tes pieds l'un contre l'autre.","Abaisse la barre jusqu'à tes épaules et répète pour le nombre de répétitions souhaité."],["Place le ballon Bosu au sol avec le côté plat vers le haut.","Tiens-toi debout, les pieds écartés à la largeur des épaules et place-toi sur le ballon Bosu.","Abaisse ton corps en fléchissant tes genoux et tes hanches, comme si tu t'asseyais sur une chaise.","Garde la poitrine relevée et le poids sur tes talons.","Descends jusqu'à ce que tes cuisses soient parallèles au sol.","Marque une pause, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","En remontant du squat, étends tes bras au-dessus de la tête en tendant vers le plafond.","Reviens à la position de départ en abaissant tes bras et en fléchissant tes genoux pour t'accroupir de nouveau.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Abaisse ton corps en position de squat en fléchissant tes genoux et en poussant tes hanches vers l'arrière.","En remontant du squat, lève tes bras au-dessus de la tête et fais pivoter ton torse d'un côté.","Reviens à la position de départ et répète le squat, cette fois en faisant pivoter ton torse vers le côté opposé.","Continue à alterner les côtés à chaque répétition de squat."],["Assieds-toi sur le ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, enroule lentement le haut de ton corps vers l'avant, en amenant ta poitrine vers tes genoux.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence debout, les pieds écartés à la largeur des épaules et les bras tendus au-dessus de la tête.","Fléchis légèrement les genoux et gaine ta sangle abdominale.","Abaisse ton corps en position de squat tout en gardant tes bras tendus au-dessus de la tête.","En descendant en squat, pousse tes bras vers le sol en engageant tes triceps.","Marque une pause en bas du squat, puis pousse sur tes talons pour te relever tout en ramenant simultanément tes bras au-dessus de ta tête.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Étends les bras droit devant toi à hauteur d'épaules, parallèles au sol.","Fais pivoter ton torse vers la droite, en gardant tes bras étendus et ton dos droit.","En pivotant, étends ton bras droit vers l'avant et ton bras gauche vers l'arrière, imitant le geste de tirer sur la corde d'un arc.","Maintiens la position un moment, puis reviens à la position de départ.","Répète le mouvement, cette fois en faisant pivoter ton torse vers la gauche et en étendant ton bras gauche vers l'avant et ton bras droit vers l'arrière.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens la barre derrière ta nuque en prise pronation.","Garde le dos droit et ta sangle abdominale gainée.","Développe la barre au-dessus de ta tête en tendant tes bras, en tendant complètement tes coudes.","Marque une pause en haut, puis abaisse lentement la barre pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi sur le bord d'une marche ou d'une plateforme solide, les talons dans le vide et les orteils sur la marche.","Tiens-toi à une rampe ou à un mur pour l'équilibre si nécessaire.","Lève lentement les talons le plus haut possible, en reportant le poids de ton corps sur la pointe des pieds.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils pointés vers l'avant.","Lève tes talons du sol aussi haut que possible en te tenant sur la pointe des pieds.","Maintiens la position un moment, puis abaisse lentement tes talons jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi face à un mur ou un objet solide, à environ une longueur de bras.","Place tes mains sur le mur ou l'objet à hauteur des épaules.","Recule un pied, en gardant le talon à plat sur le sol.","Fléchis légèrement ton genou avant et penche-toi en avant en gardant ta jambe arrière tendue.","Tu devrais sentir un étirement dans le muscle de ton mollet.","Maintiens l'étirement pendant 20 à 30 secondes.","Répète avec l'autre jambe."],["Tiens-toi debout bien droit, les pieds écartés à la largeur des épaules.","Tiens la sangle des deux mains et place-la autour de la plante de ton pied.","Garde la jambe tendue et penche-toi lentement vers l'avant à partir des hanches, en gardant le dos droit.","Sens l'étirement dans tes ischio-jambiers et tes mollets.","Maintiens l'étirement pendant 20 à 30 secondes.","Relâche l'étirement et répète avec l'autre jambe.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Étends les bras droit sur les côtés, parallèles au sol.","Penche lentement le haut de ton corps d'un côté, en ressentant un étirement dans ton flanc et tes grands dorsaux.","Maintiens l'étirement pendant 15 à 30 secondes.","Reviens à la position de départ et répète de l'autre côté.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Place tes mains sur tes hanches ou laisse-les pendre le long de ton corps.","Gaine tes muscles abdominaux et bascule ton bassin vers l'avant, en poussant le bas de ton dos vers le mur derrière toi.","Maintiens la position pendant quelques secondes, puis relâche et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des hanches et les mains sur les hanches.","Reporte ton poids sur ta jambe gauche et soulève ton pied droit du sol, en fléchissant ton genou.","Enroule lentement ton talon droit vers tes fessiers, en contractant ton ischio-jambier.","Marque une pause en haut, puis abaisse lentement ton pied droit pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Commence debout, bien droit, les pieds écartés à la largeur des épaules et la roue abdominale devant toi.","Penche-toi au niveau de la taille et fais rouler lentement la roue vers l'avant en gardant ton dos droit et ta sangle abdominale gainée.","Continue à rouler vers l'avant jusqu'à ce que tu sentes un étirement dans tes abdominaux et que ton corps soit étendu aussi loin que possible.","Marque une pause, puis fais rouler lentement la roue vers ton corps, en revenant à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras le long du corps.","Fléchis légèrement les genoux et saute vers le haut de façon explosive.","En sautant, écarte tes jambes et étends tes bras sur les côtés, formant une étoile avec ton corps.","Atterris en douceur sur la pointe des pieds, les genoux légèrement fléchis.","Répète le nombre de répétitions souhaité."],["Règle la hauteur et la position du siège pour garantir un bon alignement.","Place tes pieds sur les pédales et fixe-les avec les sangles si elles sont disponibles.","Commence à pédaler à un rythme confortable.","Maintiens un rythme régulier et augmente la résistance comme tu le souhaites.","Gaine tes muscles abdominaux pour maintenir la stabilité et une posture correcte.","Continue à pédaler pendant la durée souhaitée de ta séance.","Diminue progressivement la résistance et ralentis avant de t'arrêter complètement.","Étire tes jambes et récupère après l'entraînement."],["Règle la hauteur et la position du siège sur le vélo stationnaire pour garantir un bon alignement.","Place tes pieds sur les pédales et fixe-les avec les sangles si elles sont disponibles.","Commence à pédaler à un rythme confortable, en gardant le dos droit et la sangle abdominale gainée.","Maintiens un rythme régulier et augmente le niveau de résistance si tu le souhaites.","Continue à pédaler pendant la durée souhaitée de ta séance de cardio.","Récupère en réduisant progressivement ton rythme et ton niveau de résistance.","Étire les muscles de tes jambes après l'entraînement pour éviter les raideurs et favoriser la récupération."],["Commence suspendu à une paire d'anneaux, les bras complètement tendus et le corps aligné.","Écarte largement les jambes, en formant une position en écart.","Gaine ta sangle abdominale et abaisse lentement ton corps jusqu'à ce que tes bras soient parallèles au sol.","Maintiens cette position pendant quelques secondes, puis repousse-toi jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de pompe, les mains écartées à la largeur des épaules et les pieds bien écartés.","Gaine ta sangle abdominale et déplace lentement ton poids vers l'avant, en amenant tes épaules au-dessus de tes mains.","Plie tes coudes et abaisse ton corps vers le sol en gardant tes coudes près de tes côtés.","Marque une pause en bas, puis pousse sur tes mains pour tendre tes bras et soulever ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le côté, les jambes tendues et superposées l'une sur l'autre.","Place ton bras inférieur sous ta tête pour le soutien.","Gaine ta sangle abdominale et lève ta jambe supérieure aussi haut que possible sans faire pivoter tes hanches ni te pencher en arrière.","Marque une pause en haut, puis abaisse lentement ta jambe pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Gaine ta sangle abdominale et abaisse ton corps vers le sol, en gardant tes coudes près de tes flancs.","En abaissant ton corps, décolle simultanément ton bras droit et ta jambe gauche du sol en les tendant bien droit.","Marque une pause en haut, puis abaisse ton bras et ta jambe tout en te poussant vers le haut pour revenir à la position de départ.","Répète le mouvement, cette fois en levant ton bras gauche et ta jambe droite.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Fixe une sangle de suspension à un point d'ancrage haut et règle les sangles à hauteur de la taille.","Tiens-toi dos au point d'ancrage et tiens les poignées, les bras tendus devant toi.","Penche-toi en avant au niveau de la taille, en gardant le corps droit et la sangle abdominale gainée.","Abaisse ton corps aussi bas que possible tout en gardant le contrôle et la tension dans tes abdominaux.","Marque une pause en bas, puis relève lentement ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Trouve un appareil de suspension et règle-le à une hauteur appropriée.","Tiens-toi dos au point d'ancrage et tiens les poignées en prise pronation.","Avance les pieds en penchant ton corps en avant jusqu'à ce que ton poids soit soutenu par la sangle de suspension.","Garde ton corps bien aligné de la tête aux talons, gaine ta sangle abdominale et abaisse ta poitrine vers les poignées.","Pousse avec ta poitrine et tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes genoux vers ta poitrine, en enroulant ton bassin vers ta cage thoracique.","Marque une pause en haut, puis abaisse lentement tes genoux pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Installe un entraîneur en suspension à une hauteur appropriée.","Tiens-toi face au point d'ancrage, les pieds écartés à la largeur des épaules.","Tiens les poignées en prise pronation, les paumes tournées l'une vers l'autre.","Penche-toi en arrière, en gardant le corps droit et les talons au sol.","Tire ta poitrine vers les poignées en contractant tes omoplates l'une vers l'autre.","Marque une pause en haut, puis abaisse-toi lentement pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi dos à un sangle de suspension, les pieds écartés à la largeur des épaules.","Étends une jambe vers l'avant et place le dessus de ton pied dans l'étrier du sangle de suspension.","Fléchis ta jambe d'appui et abaisse ton corps en position de fente en gardant la poitrine relevée et ton genou aligné avec tes orteils.","Pousse à travers ton talon pour revenir à la position de départ.","Répète le nombre de répétitions souhaité, puis change de jambe."],["Allonge-toi face vers le bas sur un tapis, les bras tendus au-dessus de la tête.","Gaine ta sangle abdominale et lève ta poitrine et tes jambes du sol simultanément.","Bats des jambes de haut en bas dans un mouvement de battement, comme si tu nageais.","Continue à donner des coups de pied pour le nombre de répétitions souhaité.","Abaisse ta poitrine et tes jambes jusqu'à la position de départ."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Tends les bras droit devant toi, parallèles au sol.","Gaine ta sangle abdominale et balance tes bras dans un mouvement circulaire, en faisant pivoter ton torse en même temps.","Continue le mouvement circulaire en balançant tes bras et en faisant pivoter ton torse pour le nombre de répétitions souhaité.","Pense à respirer tout au long de l'exercice."],["Assieds-toi sur un banc, les mains agrippant le bord, doigts pointant vers l'avant.","Fais glisser tes fesses hors du banc, en soutenant ton poids avec tes mains.","Plie tes coudes et abaisse ton corps jusqu'à ce que le haut de tes bras soit parallèle au sol.","Repousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, face au pneu.","Fléchis les genoux et bascule au niveau des hanches en descendant en position accroupie.","Penche-toi et saisis le bord inférieur du pneu avec tes deux mains, les doigts tournés vers toi.","Contracte tes fessiers et les muscles de tes jambes, et pousse de manière explosive avec tes jambes pour soulever le pneu du sol.","Lorsque le pneu se retourne, utilise la force du haut de ton corps pour le guider et garder le contrôle.","Une fois le pneu complètement retourné, recule rapidement et remets-toi en position.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et la barre trap au sol devant toi.","Fléchis les hanches et les genoux pour descendre et saisis les poignées de la barre trap en prise pronation.","Garde le dos droit et la poitrine relevée pendant que tu commences à soulever la barre trap du sol en étendant tes hanches et tes genoux.","En soulevant, concentre-toi sur la poussée dans tes talons et contracte tes fessiers en haut du mouvement.","Abaisse la barre trap jusqu'au sol en fléchissant les hanches et les genoux, en gardant ton dos droit tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'un banc ou d'une chaise, les mains agrippant le bord, doigts pointant vers l'avant.","Fais glisser tes fesses hors du banc, en soutenant ton poids avec tes mains.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'un banc, les mains agrippant le bord, doigts pointant vers l'avant.","Avance les pieds en faisant glisser tes fesses hors du banc, puis tends les bras.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Pousse à travers tes paumes pour tendre tes bras et revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un banc, les mains agrippant le bord du banc, doigts pointant vers l'avant.","Fais glisser tes fesses hors du banc, en soutenant ton poids avec tes mains.","Plie tes coudes et abaisse ton corps vers le sol en gardant ton dos près du banc.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au bord d'une chaise ou d'un banc, les mains à côté de tes hanches, doigts pointant vers l'avant.","Fais glisser tes fesses hors de l'avant de la chaise, les jambes tendues devant toi.","Tends les bras, en gardant une légère flexion dans les coudes pour maintenir la tension sur tes triceps et la retirer des articulations des coudes.","Fléchis lentement les coudes pour abaisser ton corps vers le sol jusqu'à ce que tes coudes forment un angle d'environ 90 degrés.","Une fois arrivé au bas du mouvement, pousse sur la chaise pour tendre tes coudes, en revenant à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les genoux légèrement fléchis.","Étends les bras droit devant toi, parallèles au sol.","Plie tes coudes et abaisse ton corps vers le sol en gardant le haut de tes bras près de tes côtés.","Marque une pause en bas, puis pousse-toi vers le haut jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout ou assis bien droit, le dos droit.","Étends un bras au-dessus de la tête, en le fléchissant au niveau du coude.","Place ta main opposée sur le coude fléchi et tire-le doucement vers ta tête.","Maintiens l'étirement pendant 15 à 30 secondes, en ressentant un léger étirement dans tes triceps.","Relâche l'étirement et répète avec l'autre bras."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains derrière ta tête avec tes coudes pointés vers l'extérieur.","En gainant tes abdominaux, soulève tes omoplates du sol et amène tes genoux vers ta poitrine, en enroulant simultanément le haut de ton corps vers tes genoux.","Marque une pause en haut, puis abaisse lentement tes omoplates et étends tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle la hauteur du siège et place-toi face à la machine à câble.","Saisis les poignées avec une prise en pronation, les mains écartées à la largeur des épaules.","Assieds-toi et place tes cuisses sous les coussinets, en gardant tes pieds à plat sur le sol.","Penche-toi légèrement en arrière et garde la poitrine ouverte, en maintenant une colonne neutre.","Tire les poignées vers le bas en direction du haut de ta poitrine en contractant tes omoplates l'une vers l'autre.","Marque une pause en bas du mouvement, en ressentant la contraction dans tes grands dorsaux.","Relâche lentement les poignées et reviens à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Place tes mains le long de ton corps pour le soutien.","Contracte tes fessiers et soulève tes hanches du sol, en formant une ligne droite de tes genoux à tes épaules.","Tout en gardant tes hanches soulevées, fais pivoter le bas de ton corps vers la droite en ramenant tes genoux vers le sol.","Reviens à la position de départ et répète la torsion vers le côté gauche.","Continue à alterner les torsions pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Place tes mains sous tes fessiers pour te soutenir.","Gaine tes abdominaux et lève tes deux jambes du sol, en les gardant droites.","En levant tes jambes, fais pivoter tes hanches d'un côté en amenant tes jambes vers ton épaule opposée.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le mouvement, cette fois en faisant pivoter tes hanches vers l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Allonge-toi sur le dos, les jambes tendues et les bras le long du corps.","Fléchis les genoux et décolle les jambes du sol en les amenant vers ta poitrine.","En levant tes jambes, fais pivoter tes hanches d'un côté en amenant tes genoux vers ton épaule opposée.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le mouvement, cette fois en faisant pivoter tes hanches vers l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les bras tendus sur les côtés.","Penche-toi vers l'avant au niveau de la taille en gardant ton dos droit et tes genoux légèrement fléchis.","Penche-toi vers tes orteils avec tes deux mains en gardant tes jambes tendues.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi bien droit, les pieds écartés à la largeur des épaules.","Étends les bras droit devant toi, parallèles au sol.","Entrelace tes doigts et tourne tes paumes vers l'extérieur, à l'opposé de ton corps.","Soulève lentement tes bras au-dessus de ta tête, en les gardant tendus et parallèles l'un à l'autre.","En levant tes bras, contracte tes omoplates l'une vers l'autre.","Maintiens l'étirement pendant 15 à 30 secondes, puis relâche et répète."],["Allonge-toi face vers le bas au sol, les jambes tendues derrière toi.","Place tes mains au sol à côté du bas de tes côtes, les doigts pointés vers l'avant.","Presse fermement tes mains dans le sol et redresse tes bras, en soulevant ton torse et tes cuisses du sol.","Roule tes épaules vers l'arrière et vers le bas, en ouvrant ta poitrine et en levant ton regard vers le plafond.","Maintiens cette position pendant quelques respirations, puis abaisse lentement ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les jambes tendues devant toi.","Penche-toi légèrement en arrière et décolle tes jambes du sol, en les gardant tendues.","Simultanément, soulève le haut de ton corps du sol et tends tes bras vers tes jambes.","Maintiens cette position pendant quelques secondes, puis abaisse lentement ton haut du corps et tes jambes jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi aux barres parallèles, les bras complètement étendus et le corps droit.","Gaine ta sangle abdominale et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou légèrement plus haut.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Règle le niveau de résistance et l'inclinaison du vélo elliptique selon tes réglages souhaités.","Monte sur les pédales de la machine et saisis légèrement les poignées.","Commence par pousser avec tes pieds et tirer les poignées vers ton corps.","Continue ce mouvement en alternant entre pousser et tirer, pour simuler une marche ou une course.","Maintiens un rythme régulier et garde ta sangle abdominale gainée pendant tout l'exercice.","Continue pendant la durée souhaitée de ta séance de cardio.","Diminue progressivement l'intensité et la vitesse de la machine avant de descendre."],["Tiens-toi debout, les pieds écartés à la largeur des hanches.","Monte ton genou droit vers ta poitrine aussi haut que possible tout en tenant en équilibre sur ta jambe gauche.","Avance le pied droit et abaisse ton corps en position de fente, en fléchissant les deux genoux à un angle de 90 degrés.","Pousse sur ton pied droit et amène ton genou gauche vers le haut en direction de ta poitrine.","Avance le pied gauche et abaisse ton corps en position de fente.","Continue à alterner les jambes et à faire des fentes vers l'avant en gardant ta sangle abdominale gainée et un rythme régulier.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec la jambe droite, en abaissant ton corps en position de fente.","Garde le torse droit et le genou avant aligné avec la cheville.","Pousse sur ton pied droit et amène ton pied gauche vers l'avant, en te plaçant en position de fente avec ta jambe gauche.","Continue à alterner les jambes et à avancer en maintenant un rythme contrôlé et régulier.","Répète le nombre de répétitions souhaité."],["Règle le niveau d'inclinaison du tapis de course selon l'intensité souhaitée.","Tiens-toi sur le tapis de course, les pieds écartés à la largeur des épaules.","Commence à marcher à un rythme confortable, en veillant à conserver une bonne posture.","Gaine tes muscles abdominaux et garde le dos droit tout au long de l'exercice.","Continue à marcher sur le tapis incliné pendant la durée souhaitée de ton entraînement cardio.","Diminue progressivement l'inclinaison et la vitesse du tapis de course pour récupérer avant de t'arrêter."],["Règle le stepmill à un niveau confortable.","Monte sur la machine et pose les mains sur les rampes pour te soutenir.","Commence à marcher en posant un pied sur une marche puis l'autre, en alternant les jambes.","Maintiens une posture bien droite et gaine tes muscles abdominaux.","Continue à marcher pendant la durée ou la distance souhaitée.","Augmente progressivement l'intensité ou la vitesse à mesure que tu te sens plus à l'aise avec l'exercice.","Pense à récupérer et à t'étirer après avoir terminé l'exercice."],["Assieds-toi sur un banc, les mains agrippant le bord, doigts pointant vers l'avant.","Fais glisser tes fesses hors du banc, en soutenant ton poids avec tes mains.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi devant la cage à dips et attrape les barres parallèles en prise supination, les mains écartées à la largeur des épaules.","Suspends-toi aux barres, les bras complètement étendus, les pieds décollés du sol et le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers les barres, en gardant tes coudes près de tes flancs.","Continue à tirer jusqu'à ce que ton menton soit au-dessus des barres, puis marque une pause.","Abaisse lentement ton corps vers la position de départ, en tendant complètement tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds plus écartés que la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens un poids devant ta poitrine des deux mains.","Reporte ton poids d'un côté et abaisse ton corps en fléchissant le genou du côté vers lequel tu t'es déplacé, tout en gardant l'autre jambe tendue.","Descends aussi bas que possible tout en gardant l'équilibre et la poitrine haute.","Pousse à travers le talon de la jambe fléchie pour revenir à la position de départ.","Répète de l'autre côté en alternant les jambes."],["Allonge-toi sur le dos, les genoux fléchis et les pieds à plat au sol.","Tiens un disque de poids ou un haltère sur ta poitrine.","Gaine tes abdominaux et lève ton haut du corps du sol, en t'enroulant vers l'avant jusqu'à ce que tes omoplates décollent du sol.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Allonge-toi à plat sur un banc décliné, les pieds bloqués sous les cale-pieds.","Place tes mains derrière ta tête ou croisées sur ta poitrine.","Gaine tes abdominaux et lève lentement ton haut du corps du banc, en t'enroulant vers l'avant jusqu'à ce que ton torse soit perpendiculaire au sol.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi sur une plateforme surélevée, les orteils sur le bord et les talons dans le vide.","Tiens-toi à un objet stable pour te soutenir.","Lève tes talons aussi haut que possible en étendant tes chevilles.","Marque une pause en haut, puis abaisse lentement tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence en position de planche haute, les mains un peu plus écartées que la largeur des épaules et les pieds joints.","Abaisse ta poitrine vers le sol, en gardant les coudes près de ton corps.","Une fois ta poitrine juste au-dessus du sol, pousse-toi vers le haut de manière explosive, en décollant tes mains du sol.","En te repoussant vers le haut, écarte rapidement tes mains sur les côtés et légèrement vers l'avant, en laissant ton corps descendre vers le sol.","Rattrape-toi avec les mains dans la position plus large et abaisse immédiatement ta poitrine à nouveau vers le sol.","Répète le mouvement de pompe, en te laissant descendre et en te rattrapant avec tes mains dans la position plus resserrée.","Continue à alterner entre les positions des mains plus larges et plus étroites pour le nombre de répétitions souhaité."],["Commence allongé face contre terre sur le sol.","Place tes avant-bras au sol, avec tes coudes directement sous tes épaules.","Étends tes jambes droit derrière toi, les orteils au sol.","Gaine ta sangle abdominale et lève ton corps du sol, en équilibre sur tes avant-bras et tes orteils.","Garde ton corps bien aligné de la tête aux talons.","Maintiens cette position pendant la durée souhaitée.","Abaisse ton corps jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un haltère dans chaque main, paumes tournées vers tes cuisses.","En gardant les bras tendus, expire et lève les haltères devant toi jusqu'à ce qu'ils soient à hauteur d'épaule.","Marque une pause en haut, puis inspire et abaisse lentement les haltères pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Suspends-toi à une barre de traction, les bras complètement étendus et les paumes tournées vers l'extérieur.","Gaine ta sangle abdominale et lève tes jambes devant toi, en les gardant droites.","Continue à soulever jusqu'à ce que tes jambes soient parallèles au sol ou légèrement plus haut.","Marque une pause en haut, puis abaisse lentement tes jambes pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Positionne-toi face contre terre sur un ballon de stabilité, les hanches reposant sur le ballon et les pieds contre un mur pour plus de stabilité.","Place tes mains derrière ta tête ou croise-les sur ta poitrine.","Gaine ta sangle abdominale et soulève lentement le haut du corps du ballon, en étendant ton dos jusqu'à ce que ton corps forme une ligne droite.","Marque une pause en haut, puis abaisse lentement le haut de ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Commence à genoux, les genoux écartés à la largeur des hanches et le dos droit.","Tiens un poids dans chaque main, les bras étendus droit vers le bas devant toi.","Gaine ta sangle abdominale et balance les poids vers le haut au-dessus de ta tête, en gardant les bras tendus.","Abaisse les poids jusqu'à la position de départ et répète pour le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, en tenant un poids dans chaque main.","Fais un pas en avant avec le pied droit, en abaissant ton corps en position de fente.","En te fendant vers l'avant, balance les poids vers l'avant et vers le haut en gardant tes bras tendus.","Pousse sur ton pied droit et reviens à la position de départ en ramenant les poids vers le bas.","Répète avec ton pied gauche et continue à alterner les jambes pour le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction, les paumes tournées vers l'extérieur et les mains légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et tire ton corps vers la barre, en menant avec ta poitrine.","Une fois en haut du mouvement, change ta prise pour que tes paumes soient tournées vers toi.","Continue à te hisser jusqu'à ce que ta poitrine atteigne la barre, puis marque une pause.","Abaisse-toi lentement vers la position de départ, en gardant le contrôle tout au long du mouvement.","Répète le nombre de répétitions souhaité."],["Commence suspendu à une barre de traction, les paumes tournées vers l'extérieur et les mains légèrement plus écartées que la largeur des épaules.","Gaine ta sangle abdominale et tire tes omoplates vers le bas et l'arrière.","Plie tes coudes et tire ta poitrine vers la barre en gardant ton corps droit.","Une fois ta poitrine au niveau de la barre, pousse avec tes mains et ramène tes coudes vers l'arrière, en soulevant ton corps au-dessus de la barre.","Marque une pause en haut du mouvement, puis redescends lentement jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Saisis la barre de traction avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, le bras complètement étendu et le corps droit.","Gaine ta sangle abdominale et tire ton corps vers la barre en pliant ton coude et en contractant les muscles de ton dos.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Abaisse ton corps jusqu'à la position de départ avec contrôle.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Tiens un disque de poids ou un haltère des deux mains et étends tes bras au-dessus de la tête.","Gaine tes abdominaux et enroule lentement ton torse vers l'avant, en amenant ta poitrine vers tes genoux.","Marque une pause en haut, puis abaisse lentement ton torse pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Saisis la barre de traction avec une prise en pronation, un peu plus large que la largeur des épaules.","Suspends-toi à la barre, les bras complètement étendus et le corps droit.","Sollicite les muscles de ton dos et tire ton corps vers la barre, en gardant tes coudes près de ton corps.","Continue à tirer jusqu'à ce que ton menton soit au-dessus de la barre.","Marque une pause en haut, puis abaisse lentement ton corps pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans chaque main.","Fléchis légèrement les genoux et bascule vers l'avant au niveau des hanches en gardant le dos droit.","Lève tes bras sur les côtés en gardant une légère flexion dans tes coudes.","Continue à lever tes bras jusqu'à ce qu'ils soient parallèles au sol.","Marque une pause en haut, puis abaisse lentement tes bras pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi au sol, les genoux fléchis et les pieds à plat sur le sol.","Tiens un poids ou un médecine-ball des deux mains devant ta poitrine.","Penche-toi légèrement en arrière, en gardant le dos droit et la sangle abdominale gainée.","Tourne lentement ton torse vers la droite, en amenant le poids ou le médecine-ball vers le sol sur ton côté droit.","Marque une pause, puis fais pivoter ton torse vers la gauche, en amenant le poids ou le médecine-ball vers le sol du côté gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les genoux fléchis et les pieds décollés du sol, en gardant les jambes serrées.","Tiens le poids des deux mains devant ta poitrine, en gardant tes coudes légèrement fléchis.","Penche-toi légèrement en arrière pour gainer ta sangle abdominale.","Fais pivoter ton torse vers la droite, en amenant le poids vers le sol sur ton côté droit.","Marque une pause, puis fais pivoter ton torse vers la gauche, en amenant le poids vers le sol du côté gauche.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi au sol, les genoux fléchis et les pieds à plat sur le sol.","Tiens le poids des deux mains devant ta poitrine.","Penche-toi légèrement en arrière pour gainer ta sangle abdominale.","Fais pivoter ton torse vers la droite, en amenant le poids vers le côté droit de ton corps.","Marque une pause, puis fais pivoter ton torse vers la gauche, en amenant le poids vers le côté gauche de ton corps.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et le dos droit.","Tiens un médecine-ball en prise supination, les paumes tournées vers le haut, et laisse tes bras pendre le long de tes côtés.","En gardant le haut des bras immobile, expire et fléchis le médecine-ball vers tes épaules.","Marque une pause en haut, en contractant tes biceps.","Inspire et abaisse lentement le médecine-ball jusqu'à la position de départ.","Répète le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds à plat sur le sol et les genoux fléchis à un angle de 90 degrés.","Tiens un disque de poids ou un haltère des deux mains, près de ta poitrine.","Gaine ta sangle abdominale et fais pivoter lentement ton torse d'un côté, en gardant les hanches stables.","Marque une pause à la fin de la rotation, puis reviens lentement à la position de départ.","Répète la rotation de l'autre côté.","Continue à alterner les côtés pour le nombre de répétitions souhaité."],["Assieds-toi sur un ballon de stabilité, les pieds écartés à la largeur des épaules et à plat sur le sol.","Tiens un poids dans une main et place ton autre main sur ta hanche.","Gaine ta sangle abdominale et penche-toi lentement sur le côté vers le côté lesté, en gardant ton dos droit.","Marque une pause en bas, puis reviens lentement à la position de départ.","Répète le nombre de répétitions souhaité, puis change de côté."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et les orteils légèrement tournés vers l'extérieur.","Tiens un poids devant ta poitrine des deux mains, ou place une barre en travers du haut de ton dos.","En gardant la poitrine relevée et ta sangle abdominale gainée, abaisse lentement ton corps en fléchissant les genoux et les hanches.","Continue à descendre jusqu'à ce que tes cuisses soient parallèles au sol ou aussi bas que tu peux confortablement aller.","Marque une pause en bas, puis pousse sur tes talons pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules, les orteils légèrement tournés vers l'extérieur.","Tiens un poids devant ta poitrine ou sur tes épaules.","Gaine ta sangle abdominale et garde ta poitrine relevée pendant que tu abaisses tes hanches vers le bas et l'arrière, comme si tu t'asseyais sur une chaise.","Descends jusqu'à ce que tes cuisses soient parallèles au sol, ou aussi bas que tu peux confortablement aller.","Pousse à travers tes talons pour te redresser en contractant tes fessiers en haut.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un haltère dans chaque main, paumes tournées vers l'avant.","Garde tes coudes près de ton torse et expire pendant que tu enroules les poids jusqu'au niveau des épaules.","Marque une pause en haut, puis inspire en abaissant lentement les poids pour revenir à la position de départ.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules et tiens un poids dans chaque main.","Étends les bras droit devant toi, les paumes tournées l'une vers l'autre.","Serre tes mains l'une contre l'autre aussi fort que possible, en engageant tes avant-bras.","Maintiens la contraction pendant quelques secondes, puis relâche.","Répète le nombre de répétitions souhaité."],["Positionne-toi entre des barres parallèles, les bras complètement tendus et le corps droit.","Abaisse ton corps en fléchissant tes coudes jusqu'à ce que le haut de tes bras soit parallèle au sol.","Marque une pause, puis repousse-toi vers le haut jusqu'à la position de départ en tendant tes bras.","Répète le nombre de répétitions souhaité."],["Tiens-toi debout, les pieds écartés à la largeur des épaules.","Fais un pas en avant avec le pied droit, en gardant le dos droit.","Abaisse ton corps en fléchissant tes genoux jusqu'à ce que ta cuisse droite soit parallèle au sol.","Pousse à travers ton talon droit pour revenir à la position de départ.","Répète avec ta jambe gauche.","Continue à alterner les jambes pour le nombre function qAlts(q) {
  let ws = norm(q).replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
  const noStop = ws.filter(w => !STOP.has(w)); if (noStop.length) ws = noStop;
  return ws.map(w => {
    const a = new Set([w]);
    const forms = [w];
    if (w.length > 3) { forms.push(w.replace(/s$/, ''), w.replace(/(es|s|x)$/, '')); }
    forms.forEach(k => { a.add(k); if (FR_TOK[k]) FR_TOK[k].forEach(x => a.add(x)); });
    return [...a];
  });
}
function searchLib(q, o = {}) {
  const limit = o.limit || 40, muscles = o.muscles || null;
  const alts = qAlts(q);
  if (!alts.length && !muscles) return [];
  const nq = norm(q);
  const out = [];
  for (const L of LIB) {
    if (muscles && !L.p.some(m => muscles.includes(m))) continue;
    let sc = 0, ok = true;
    for (const a of alts) {
      if (a.some(x => L.nameWords.some(w => w.startsWith(x)))) sc += 2;
      else if (a.some(x => L.hay.some(w => w.startsWith(x)))) sc += 1;
      else { ok = false; break; }
    }
    if (!ok) continue;
    sc -= 0.08 * L.nameWords.length;
    if (POP.has(L.id)) sc += 0.6;
    if (L.key === nq) sc += 3;
    out.push([sc, L]);
  }
  out.sort((a, b) => b[0] - a[0]);
  return out.slice(0, limit).map(x => x[1]);
}

function autoMatch(name) {
  const k1 = norm(name).replace(/[^a-z0-9]+/g, ' ').trim();
  if (ALIAS[k1]) return ALIAS[k1];
  const k0 = norm(name).replace(/\(.*?\)/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
  if (ALIAS[k0]) return ALIAS[k0];
  const r = searchLib(name, {limit: 1});
  return r.length ? r[0].id : null;
}
function libId(name) {
  const k = norm(name);
  if (S.links && k in S.links) { const v = S.links[k]; if (v === 0) return null; if (v && LIBMAP[v]) return v; }

}

function repRange(reps) {
  const m = String(reps).replace(/[–—]/g, '-').match(/^\s*(\d+)\s*(?:-\s*(\d+))?/);
  if (!m) return null;
  const a = +m[1], b = m[2] ? +m[2] : a;
  return [Math.min(a, b), Math.max(a, b)];
}
/* Double progression : si toutes les séries de travail de la dernière fois ont atteint le haut de la fourchette, on monte la charge */
function suggestFor(e) {
  if (deloadOn()) return null;
  const last = lastFor(e.name); if (!last || !last.sets.length) return null;
  const rg = repRange(e.target.reps); if (!rg) return null;
  const [lo, hi] = rg;
  if (!last.sets.every(s => +s.r >= hi)) return null;
  const inc = incr();
  const next = last.sets.map(s => ({w: Math.round(((s.w === '' || s.w == null ? 0 : +s.w) + inc) * 100) / 100}));
  const work0 = e.sets.filter(s => s.t !== 'W' && !s.done);
  if (!work0.length || work0.every((s, k) => +s.w === next[Math.min(k, next.length - 1)].w)) return null;
  return {next, lo, hi, top: Math.max(...next.map(x => x.w)), bw: last.sets.every(s => s.w === '' || s.w == null || +s.w === 0),
    from: last.sets.map(s => `${s.w === '' || s.w == null ? 'PDC' : s.w}×${s.r}`).join(', ')};
}
/* Échauffement automatique */
const WARM = [['Léger', [[0.6, 6]]], ['Standard', [[0.55, 8], [0.75, 4]]], ['Complet', [[0.5, 8], [0.7, 5], [0.85, 2]]]];
let warmCtx = null;
function openWarmAuto(ei) {
  const e = S.active.exercises[ei];
  const ws = e.sets.find(s => s.t !== 'W' && +s.w > 0);
  if (!ws) { toast("Entre d'abord ta charge de travail"); return; }
  const W = +ws.w, inc = incr();
  const rnd = x => Math.max(inc, Math.round(x / inc) * inc);
  const plans = WARM.map(([n, steps]) => {
    const arr = [];
    steps.forEach(([pc, r]) => { const w = Math.round(rnd(W * pc) * 100) / 100; if (w < W && !arr.some(a => a.w === w)) arr.push({w, r}); });
    return [n, arr];
  });
  warmCtx = {ei, plans};
  modal(`<h2>Échauffement · ${esc(e.name)}</h2>
    <p class="muted small">Calculé à partir de ta charge de travail : <b>${W} ${U()}</b></p>
    ${plans.map(([n, arr], i) => `<button class="btn block" style="margin:6px 0;text-align:left" data-act="warm-apply" data-k="${i}" ${arr.length ? '' : 'disabled'}><b>${n}</b> <span class="muted small">(${arr.length} série${arr.length > 1 ? 's' : ''})</span><br><span class="small muted">${arr.map(a => `${a.w} ${U()} × ${a.r}`).join('  →  ') || 'Charge trop légère'}</span></button>`).join('')}
    <button class="btn block" data-act="close" style="margin-top:6px">Annuler</button>`);
}

/* ---------- Minuteur ---------- */
let timerEnd = 0, timerInt = null;
function startTimer(sec) {
  timerEnd = Date.now() + sec * 1000;
  $('#timer').classList.add('show');
  scheduleBeeps(sec);
  clearInterval(timerInt); tickTimer(); timerInt = setInterval(tickTimer, 250);
}
/* Les bips sont programmés d'avance dans le moteur audio du téléphone : ils sonnent à l'heure même si l'écran
   est éteint et que l'appli est en pause. Un son inaudible garde le moteur audio actif pendant le repos. */
let sched = [];
function cancelBeeps() { sched.forEach(n => { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} }); sched = []; }
function schedTone(freq, at, dur, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + dur + 0.05); sched.push(o);
}
function scheduleBeeps(sec) {
  cancelBeeps();
  if (S.settings.sound === false) return;
  ensureAudio(); if (!actx) return;
  try {
    const t0 = actx.currentTime;
    const keep = actx.createOscillator(), kg = actx.createGain();
    keep.frequency.value = 30; kg.gain.value = 0.0005;
    keep.connect(kg); kg.connect(actx.destination); keep.start(t0); keep.stop(t0 + sec + 1.5); sched.push(keep);
    [3, 2, 1].forEach(k => { if (sec - k > 0.3) schedTone(660, t0 + sec - k, 0.1, 0.3); });
    schedTone(880, t0 + sec, 0.18, 0.5); schedTone(880, t0 + sec + 0.25, 0.18, 0.5); schedTone(1320, t0 + sec + 0.5, 0.35, 0.55);
  } catch (e) {}
}
function tickTimer() {
  const left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
  $('#tval').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (left <= 0) { clearInterval(timerInt); $('#timer').classList.remove('show'); sched = []; if (navigator.vibrate) navigator.vibrate([300, 150, 300]); toast('⏱️ Repos terminé!'); }
}
function stopTimer() { clearInterval(timerInt); cancelBeeps(); $('#timer').classList.remove('show'); }

function vCalendar() {
  const first = new Date(cal.y, cal.m, 1), days = new Date(cal.y, cal.m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;

function vExProgress() {

let recSort = 'recent';
function computeRecords() {
  const map = new Map();
  S.history.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(h => h.exercises.forEach(e => {
    const ws = work(e.sets); if (!ws.length) return;
    const k = norm(e.name);
    let r = map.get(k); if (!r) { r = {name: e.name, best: null, heavy: null, reps: null, count: 0}; map.set(k, r); }
    r.count++; r.name = e.name;
    ws.forEach(s => {
      const tm = s.u === 's', v = tm ? 0 : e1rm(s.w, s.r), w = tm ? 0 : (+s.w || 0), n = +s.r || 0; if (tm) r.timed = true;
      if (v > 0 && (!r.best || v > r.best.v)) r.best = {w, r: n, v, date: h.date};
      if (w > 0 && (!r.heavy || w > r.heavy.w)) r.heavy = {w, r: n, date: h.date};
      if (w === 0 && n > 0 && (!r.reps || n > r.reps.r)) r.reps = {r: n, date: h.date};

  }));
  return [...map.values()].filter(r => r.best || r.reps).map(r => ({...r, date: (r.best || r.reps).date}));
}
function vRecords() {
  const recs = computeRecords();

function weekStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function volumeBy(from, to) {
  const out = {}, unk = {}; let sessions = 0;
  S.history.forEach(h => {
    const t = new Date(h.date); if (t < from || t >= to) return; sessions++;
    h.exercises.forEach(e => {
      const n = work(e.sets).length; if (!n) return;
      const L = libEntry(e.name);
      if (!L) { unk[e.name] = 1; return; }
      L.p.forEach(m => out[m] = (out[m] || 0) + n);
      L.s.forEach(m => out[m] = (out[m] || 0) + n * 0.5);
    });
  });
  return {out, unk: Object.keys(unk), sessions};
}
function vVolume() {
  const ws = weekStart(new Date()), DAY = 864e5;
  let from, to, div = 1, label;
  if (volPeriod === 'cur') { from = ws; to = new Date(+ws + 7 * DAY); label = 'cette semaine'; }
  else if (volPeriod === 'last') { from = new Date(+ws - 7 * DAY); to = ws; label = 'la semaine dernière'; }
  else { from = new Date(+ws - 28 * DAY); to = ws; div = 4; label = 'en moyenne par semaine (4 dernières semaines)'; }
  const {out, unk, sessions} = volumeBy(from, to);
  const rows = Object.entries(out).map(([m, v]) => [m, v / div]).sort((a, b) => b[1] - a[1]);
  const max = Math.max(10, ...rows.map(r => r[1]));
  const fmt = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
  const seg = `<div class="seg"><button class="${volPeriod === 'cur' ? 'on' : ''}" data-act="vol-p" data-p="cur">Cette sem.</button><button class="${volPeriod === 'last' ? 'on' : ''}" data-act="vol-p" data-p="last">Sem. passée</button><button class="${volPeriod === 'avg' ? 'on' : ''}" data-act="vol-p" data-p="avg">Moy. 4 sem.</button></div>`;
  return seg + `<div class="card"><h3>Séries par muscle</h3><p class="muted small" style="margin:2px 0 8px">${esc(label)} · ${sessions} séance${sessions > 1 ? 's' : ''}</p>` +
    (rows.length ? rows.map(([m, v]) => `<div class="bar"><span>${esc(MUS_FR[m] || m)}</span><div class="track"><div class="fill" style="width:${Math.max(3, v / max * 100)}%"></div></div><b>${fmt(v)}</b></div>`).join('') : '<div class="empty">Aucune donnée pour cette période.</div>') +
    `<p class="muted small" style="margin:10px 0 0">Muscle principal = 1 série, muscle secondaire = 0,5. Les séries d'échauffement ne comptent pas.</p></div>` +
    (unk.length ? `<div class="card"><h3>Exercices sans muscle connu</h3><p class="muted small">Touche un nom puis « Choisir l'exercice lié » pour qu'il soit compté.</p><div class="chips">${unk.map(n => `<button class="chip" data-act="exo" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div></div>` : '');
}

function saveBody() {
  const d = $('#bd').value || dkey(new Date());
  const num = id => { const v = ($('#' + id).value || '').replace(',', '.').trim(); return v !== '' && !isNaN(v) ? +v : null; };
  const w = num('bw'), m = {}, nn = {};
  MEAS.forEach(([k]) => { const v = num('bm_' + k); if (v != null) m[k] = v; });
  NUTRI.forEach(([k]) => { const v = num('bn_' + k); if (v != null) nn[k] = v; });
  if (w == null && !Object.keys(m).length && !Object.keys(nn).length) { toast('Entre au moins une valeur'); return; }
  let e = S.body.find(x => x.d === d);
  if (!e) { e = {id: uid(), d, w: null, m: {}}; S.body.push(e); }
  if (w != null) e.w = w;
  e.m = Object.assign(e.m || {}, m);
  if (Object.keys(nn).length) e.n = Object.assign(e.n || {}, nn);
  save(); render(); toast('✅ Mesure enregistrée');
}

function drawChart(pts) {
  const c = $('#chart'); if (!c || !pts.length) return;
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue('--accent').trim(), line = css.getPropertyValue('--line').trim(), muted = css.getPropertyValue('--muted').trim();
  const pad = {l: 42, r: 12, t: 12, b: 24};
  const vals = pts.map(p => p.v);
  let mn = Math.min(...vals), mx = Math.max(...vals);
  if (mn === mx) { mn -= 5; mx += 5; }
  const span = mx - mn; mn -= span * .1; mx += span * .1;
  const x = i => pad.l + (pts.length === 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (pts.length - 1));
  const y = v => pad.t + (1 - (v - mn) / (mx - mn)) * (H - pad.t - pad.b);
  g.strokeStyle = line; g.fillStyle = muted; g.font = '11px sans-serif'; g.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = mn + (mx - mn) * i / 3, yy = y(v);
    g.beginPath(); g.moveTo(pad.l, yy); g.lineTo(W - pad.r, yy); g.stroke();
    g.fillText(Math.abs(mx - mn) >= 30 ? Math.round(v).toLocaleString('fr-CA') : (Math.round(v * 10) / 10).toString().replace('.', ','), 4, yy + 4);
  }
  g.textAlign = 'left'; g.fillText(dateFr(pts[0].d), pad.l, H - 6);
  if (pts.length > 1) { g.textAlign = 'right'; g.fillText(dateFr(pts[pts.length - 1].d), W - pad.r, H - 6); }
  g.strokeStyle = accent; g.lineWidth = 2.5; g.lineJoin = 'round'; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(i), y(p.v)) : g.moveTo(x(i), y(p.v))); g.stroke();
  g.fillStyle = accent; pts.forEach((p, i) => { g.beginPath(); g.arc(x(i), y(p.v), 3.5, 0, 7); g.fill(); });
}

/* ---------- Sauvegarde automatique dans un Gist GitHub privé ---------- */
const TKEY = 'carnet-muscu-token', GFILE = 'carnet-muscu-backup.json', GRE = /^carnet-muscu.*\.json$/;
const cfile = () => (S.cloud && S.cloud.file) || GFILE;
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'moi';

let cloudTimer = null, cloudBusy = false, cloudDirty = false;
const ghTok = () => { try { return localStorage.getItem(TKEY) || ''; } catch (e) { return ''; } };
const cloudOn = () => !!(ghTok() && S.cloud && S.cloud.gist);
const strHash = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = ((x << 5) + x + s.charCodeAt(i)) | 0; return s.length + ':' + x; };
const backupBody = () => JSON.stringify({...S, active: null, cloud: undefined});
async function gh(path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, {...opt, headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + ghTok(), ...(opt.body ? {'Content-Type': 'application/json'} : {})}});

}
function queueCloud(delay = 15000) { if (!cloudOn()) return; cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(() => cloudPush(), delay); }
async function cloudPush(force) {

  cloudBusy = true;
  try {
    await gh('/gists/' + S.cloud.gist, {method: 'PATCH', body: JSON.stringify({files: {[cfile()]: {content: body}}})});
    S.cloud.last = new Date().toISOString(); S.cloud.hash = hs; delete S.cloud.err; cloudDirty = false;
  } catch (e) { S.cloud.err = e.message; cloudDirty = true; }
  cloudBusy = false; saveLocal();
  if (cur().v === 'settings') render();
}
async function cloudFetch() {
  const g = await gh('/gists/' + S.cloud.gist);
  const f = g.files && g.files[cfile()]; if (!f) throw new Error('Fichier de sauvegarde introuvable');
  const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return JSON.parse(txt);
}

async function cloudConnect() {

    const mine = `carnet-muscu-${slug(name)}.json`;
