name: APK Android
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Activité principale, connexion Google et Health Connect
        run: python3 native/patch_android.py
      - name: Signature stable (si la clé est dans les secrets)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            K=$(printf '%s' "$KS" | tr -d ' \r\n\t')
            echo "Longueur du secret : ${#K} (attendu 3516) · début de l'empreinte : $(printf '%s' "$K" | sha256sum | cut -c1-16)"
            printf '%s' "$K" | base64 -d > android/app/runelift.p12 || { echo "::error::Le secret ANDROID_KEYSTORE_B64 n'est pas le bon texte (voir la longueur ci-dessus)"; exit 1; }
            SHA=$(keytool -list -v -keystore android/app/runelift.p12 -storepass android -storetype pkcs12 | grep -m1 'SHA1:' | awk '{print $2}')
            echo "Empreinte SHA-1 de la clé : $SHA"
            if [ "$SHA" != "CD:10:80:63:BF:72:00:59:26:CC:41:D5:CC:CC:D1:46:87:A8:6F:14" ]; then echo "::error::La clé dans le secret ANDROID_KEYSTORE_B64 est incomplète ou différente"; exit 1; fi
            printf "\nandroid { signingConfigs { debug { storeFile file('runelift.p12'); storePassword 'android'; keyAlias 'runelift'; keyPassword 'android'; storeType 'pkcs12' } } }\n" >> android/app/build.gradle
            echo "Signature stable activée"
          else
            echo "Pas de clé : signature de test temporaire"
          fi
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk runelift-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: runelift-test-apk
          path: runelift-test.apk
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test runelift-test.apk --target android --prerelease --title "Runelift Android (test)" --notes "Version de test : connexion Google native et Health Connect (séances et poids)."
