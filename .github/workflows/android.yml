name: APK Android
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Signature stable (si la clé est dans les secrets)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/runelift.p12
            printf "\nandroid { signingConfigs { debug { storeFile file('runelift.p12'); storePassword 'android'; keyAlias 'runelift'; keyPassword 'android'; storeType 'pkcs12' } } }\n" >> android/app/build.gradle
            echo "Signature stable activée"
          else
            echo "Pas de clé : signature de test temporaire"
          fi
      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk runelift-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: runelift-test-apk
          path: runelift-test.apk
      - name: Publier dans les Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test runelift-test.apk --target android --prerelease --title "Runelift Android (test)" --notes "Version de test. Pas encore de connexion Google ni de Health Connect."
