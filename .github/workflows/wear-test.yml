name: Test montre (émulateur)
on:
  workflow_dispatch:
  push:
    branches: [android]
permissions:
  contents: write
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-montre]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 native/patch_android.py
      - name: Compiler l'appli montre
        working-directory: android
        run: ./gradlew :wear:assembleDebug --no-daemon
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Wear OS rond
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 native/weartest.py android/wear/build/outputs/apk/debug/wear-debug.apk captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-montre
          path: captures
      - name: Publier les captures (branche captures-montre)
        if: always()
        run: |
          mkdir -p captures && cd captures
          git init -q -b captures-montre
          git config user.email "actions@github.com"; git config user.name "actions"
          git add -A && git commit -qm "Captures du test $GITHUB_RUN_ID" || true
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" captures-montre
